<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งซ่อมเครื่องจักร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F2C3B;
    --navy-2:#28394d;
    --amber:#E8A33D;
    --amber-dark:#c17f1e;
    --paper:#F5F2EA;
    --card:#FFFFFF;
    --ink:#232323;
    --slate:#6b7785;
    --slate-light:#98a2ac;
    --success:#2F8F6B;
    --success-bg:#e6f3ee;
    --danger:#B5433A;
    --danger-bg:#fbeae8;
    --line:#dfd8c8;
    --warn:#c17f1e;
    --warn-bg:#fbf0dd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Sarabun',sans-serif; font-size:15px; line-height:1.5;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  header.topbar{
    background:var(--navy); color:#fff; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    border-bottom:4px solid var(--amber);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:34px; height:34px; border-radius:7px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--navy); font-size:16px;
    transform:rotate(-4deg);
  }
  .brand h1{font-size:16px; margin:0; font-weight:600;}
  .brand .sub{font-size:11.5px; color:#b9c3cd; margin-top:1px;}
  .role-select{display:flex; align-items:center; gap:8px; font-size:13px; color:#d9dfe5;}
  .role-select select{
    background:var(--navy-2); color:#fff; border:1px solid #3c5064; border-radius:6px;
    padding:7px 10px; font-family:'Sarabun',sans-serif; font-size:13.5px; cursor:pointer;
  }
  nav.tabs{
    display:flex; gap:2px; background:var(--navy-2); padding:0 14px; overflow-x:auto;
  }
  nav.tabs button{
    background:none; border:none; color:#c3ccd4; padding:12px 16px; font-family:'Sarabun',sans-serif;
    font-size:14px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; position:relative;
  }
  nav.tabs button.active{color:#fff; border-bottom-color:var(--amber); font-weight:600;}
  nav.tabs button .badge{
    background:var(--amber); color:var(--navy); border-radius:20px; font-size:10.5px; font-weight:700;
    padding:1px 6px; margin-left:6px;
  }
  main{max-width:920px; margin:0 auto; padding:22px 16px 80px;}
  h2.view-title{font-size:19px; margin:0 0 4px; font-weight:700; color:var(--navy);}
  p.view-sub{color:var(--slate); font-size:13.5px; margin:0 0 20px;}
  .card{background:var(--card); border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(31,44,59,0.08); border:1px solid #ece6d8;}
  label.field-label{display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:6px;}
  .req-star{color:var(--danger);}
  /* "ต้องการด่วน" — ป้ายและช่องติ๊กในฟอร์มแจ้งซ่อม ใช้โทนสีแดงชุดเดียวกับ req-star
     เพื่อให้สายตาจับได้ทันทีทั้งในรายการและหน้ารายละเอียด */
  .urgent-pill{
    display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    color:var(--danger); background:var(--danger-bg); border:1px solid var(--danger); white-space:nowrap;
  }
  .check-row{
    display:flex; align-items:flex-start; gap:9px; background:var(--danger-bg); border:1.5px solid #eecfcb;
    border-radius:7px; padding:10px 12px; cursor:pointer;
  }
  .check-row input{width:18px; height:18px; margin:1px 0 0; accent-color:var(--danger); flex:none; cursor:pointer;}
  .check-row .txt{font-size:13.5px; font-weight:600; color:var(--danger);}
  .check-row .txt small{display:block; font-weight:400; color:var(--slate); font-size:11.5px; margin-top:2px;}
  select.input, input.input, textarea.input{
    width:100%; padding:10px 12px; border-radius:7px; border:1.5px solid var(--line); background:#fff;
    font-family:'Sarabun',sans-serif; font-size:14px; color:var(--ink);
  }
  select.input:focus, input.input:focus, textarea.input:focus{outline:none; border-color:var(--amber-dark);}
  textarea.input{resize:vertical; min-height:80px;}
  .field{margin-bottom:18px;}
  .dept-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px;}
  .dept-btn{
    border:2px solid var(--line); background:#fff; border-radius:9px; padding:14px 8px; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; color:var(--navy);
    text-align:center; transition:all .12s;
  }
  .dept-btn:hover{border-color:var(--amber-dark);}
  .dept-btn.selected{background:var(--navy); border-color:var(--navy); color:#fff;}
  .dept-btn .full-name{display:block; font-family:'Sarabun',sans-serif; font-weight:400; font-size:11px; margin-top:3px; opacity:.85;}
  .docnum-box{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px dashed var(--amber-dark);
    border-radius:8px; padding:12px 16px; margin-bottom:18px;
  }
  .doc-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; background:#fff;
    border:2px dashed var(--amber-dark); padding:5px 12px; border-radius:4px; transform:rotate(-2deg);
    display:inline-block; color:var(--navy); box-shadow:1px 1px 0 rgba(0,0,0,.05);
  }
  .docnum-box .hint{font-size:12.5px; color:var(--slate);}
  .search-wrap{position:relative;}
  .search-results{
    position:absolute; z-index:20; top:calc(100% + 4px); left:0; right:0; background:#fff;
    border:1.5px solid var(--line); border-radius:8px; max-height:220px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
  }
  .search-item{padding:10px 12px; cursor:pointer; border-bottom:1px solid #f0ece1; font-size:13.5px;}
  .search-item:last-child{border-bottom:none;}
  .search-item:hover{background:var(--paper);}
  .search-item b.code{font-family:'JetBrains Mono',monospace; color:var(--navy);}
  .selected-machine{
    margin-top:8px; background:var(--success-bg); border:1px solid #bfe0d1; border-radius:7px;
    padding:9px 12px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center;
  }
  .selected-machine button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:12.5px;font-family:'Sarabun',sans-serif;}
  .photo-drop{
    border:2px dashed var(--line); border-radius:9px; padding:18px; text-align:center; cursor:pointer; color:var(--slate); font-size:13.5px;
  }
  .photo-drop:hover{border-color:var(--amber-dark); color:var(--amber-dark);}
  .photo-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .photo-actions .photo-drop{
    flex:1 1 140px; margin:0; padding:16px 10px; background:none;
    font-family:'Sarabun',sans-serif; font-weight:600; line-height:1.4; -webkit-tap-highlight-color:transparent;
  }
  .photo-actions .photo-drop small{display:block; font-weight:400; font-size:11.5px; opacity:.75; margin-top:2px;}
  /* ซ่อน input file แบบไม่ใช้ display:none — เบราว์เซอร์ Android บางตัวไม่ยอมเปิดกล้อง
     ให้กับ input ที่ถูก display:none เอาไว้ */
  .photo-file-input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); border:0; opacity:0;
  }
  .photo-fallback{
    margin-top:7px; text-align:center; font-size:12px; color:var(--slate);
  }
  /* เลขเวอร์ชันท้ายหน้า — เวลาผู้ใช้แจ้งปัญหาจะได้รู้ว่าเครื่องนั้นรันโค้ดตัวไหนอยู่
     (WebView ในแอปแคชไฟล์ไว้นาน อาการ "แก้แล้วยังเหมือนเดิม" มักเป็นเพราะยังเป็นโค้ดเก่า) */
  .app-version{
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    text-align:center; color:var(--slate); font-size:11px; opacity:.75;
  }
  .cam-blocked{
    margin-top:8px; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--orange);
    border-radius:8px; background:#fff8f0; font-size:12.5px; line-height:1.55; color:var(--ink);
  }
  .cam-blocked-code{color:var(--slate); font-size:11px;}
  .cam-blocked-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .cam-blocked-actions a, .cam-blocked-actions button{
    flex:1 1 150px; text-align:center; padding:9px 10px; border-radius:7px; cursor:pointer;
    font-family:'Sarabun',sans-serif; font-size:12.5px; font-weight:600; text-decoration:none;
  }
  .cam-blocked-actions a{background:var(--navy); color:#fff; border:1px solid var(--navy);}
  .cam-blocked-actions button{background:#fff; color:var(--navy); border:1px solid var(--navy);}
  .cam-blocked-tip{margin-top:7px; color:var(--slate); font-size:11.5px;}
  .photo-fallback button{
    background:none; border:none; padding:0; color:var(--navy); font-family:'Sarabun',sans-serif;
    font-size:12px; text-decoration:underline; cursor:pointer;
  }
  /* กล้องในแอป (สำรอง) — วางไว้นอก #app เพราะ render() เขียนทับ innerHTML ทั้งก้อนทุกครั้ง
     ถ้าอยู่ข้างในวิดีโอจะถูกลบทิ้งกลางคัน */
  .cam-overlay{
    display:none; position:fixed; inset:0; z-index:9000; background:#000;
    flex-direction:column; align-items:center; justify-content:center;
  }
  .cam-overlay.open{display:flex;}
  .cam-overlay video{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;}
  .cam-bar{
    position:absolute; left:0; right:0; bottom:0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:linear-gradient(transparent, rgba(0,0,0,.65));
  }
  .cam-bar button{
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.5);
    border-radius:8px; padding:10px 16px; font-family:'Sarabun',sans-serif; font-size:14px; cursor:pointer;
  }
  .cam-shutter{
    width:64px; height:64px; border-radius:50% !important; background:#fff !important; border:4px solid rgba(255,255,255,.55) !important;
    padding:0 !important; font-size:24px !important; line-height:1; flex:0 0 auto;
  }
  .cam-hint{position:absolute; top:0; left:0; right:0; padding:14px 16px calc(14px + env(safe-area-inset-top)); color:#fff; font-size:12.5px; text-align:center; background:linear-gradient(rgba(0,0,0,.6), transparent);}
  .photo-thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .photo-thumb{position:relative; width:74px; height:74px; border-radius:7px; overflow:hidden; border:1px solid var(--line);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; cursor:zoom-in;}
  .photo-thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%;
    width:18px; height:18px; font-size:11px; cursor:pointer; line-height:18px; padding:0;
  }
  .btn{
    border:none; border-radius:8px; padding:11px 20px; font-family:'Sarabun',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--amber); color:var(--navy);}
  .btn-primary:hover{background:var(--amber-dark); color:#fff;}
  .btn-primary:disabled{background:#e4dcc8; color:#a99f86; cursor:not-allowed;}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--navy);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-success{background:var(--success); color:#fff;}
  .btn-danger-outline{background:#fff; border:1.5px solid var(--danger); color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger-bg);}
  .btn-sm{padding:7px 13px; font-size:12.5px; border-radius:6px;}
  .btn-block{width:100%; justify-content:center;}

  /* order ticket card */
  .order-card{
    background:var(--card); border-radius:9px; padding:16px 16px 16px 20px; margin-bottom:12px;
    border:1px solid #ece6d8; position:relative; box-shadow:0 1px 2px rgba(31,44,59,.06);
    border-left-width:6px; border-left-style:solid;
  }
  .order-card::before, .order-card::after{
    content:''; position:absolute; left:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--paper); border:1px solid #ece6d8;
  }
  .order-card::before{top:-7px;}
  .order-card::after{bottom:-7px;}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .order-meta{font-size:12px; color:var(--slate); margin-top:4px;}
  .status-pill{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .order-body{margin-top:10px; font-size:13.5px;}
  .order-body .cause{color:var(--ink); margin-top:4px;}
  .order-actions{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;}
  .filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filters select{font-size:13px; padding:8px 10px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--slate);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  /* detail view */
  .back-link{background:none;border:none;color:var(--navy); cursor:pointer; font-size:13.5px; font-weight:600; margin-bottom:14px; display:inline-flex; align-items:center; gap:5px; padding:0;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.grid-2{grid-template-columns:1fr;}}
  .kv{margin-bottom:10px;}
  .kv .k{font-size:11.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.4px;}
  .kv .v{font-size:14px; margin-top:2px;}
  .timeline{margin-top:6px; border-left:2px solid var(--line); padding-left:16px;}
  .timeline-item{position:relative; padding-bottom:16px; font-size:13px;}
  .timeline-item::before{content:''; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--amber-dark);}
  .timeline-item .t-time{color:var(--slate); font-size:11.5px;}
  .gallery{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .gallery img{width:100px; height:100px; object-fit:cover; border-radius:7px; border:1px solid var(--line); cursor:zoom-in;}
  .action-box{background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:16px; margin-top:16px;}
  .action-box h4{margin:0 0 10px; font-size:14px; color:var(--navy);}
  .reject-box{margin-top:10px; background:#fff; border:1px solid var(--line); border-radius:7px; padding:12px;}

  .update-banner{
    background:var(--warn-bg); color:var(--warn); border-bottom:2px solid var(--warn);
    padding:10px 20px; display:flex; align-items:center; justify-content:center; gap:12px;
    font-size:13.5px; font-weight:600; flex-wrap:wrap; text-align:center;
  }

  /* notifications */
  .notif-item{display:flex; gap:12px; padding:13px 14px; border-radius:8px; margin-bottom:8px; background:#fff; border:1px solid #ece6d8;}
  .notif-item.unread{background:#fffaf0; border-color:var(--amber);}
  .notif-icon{width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .notif-text{font-size:13.5px;}
  .notif-time{font-size:11px; color:var(--slate); margin-top:2px;}

  /* settings */
  .settings-section{margin-bottom:26px;}
  .settings-section h3{font-size:15px; color:var(--navy); margin:0 0 4px;}
  .settings-section .desc{font-size:12.5px; color:var(--slate); margin:0 0 12px;}
  table.mini{width:100%; border-collapse:collapse; font-size:13px;}
  table.mini th{text-align:left; font-size:11.5px; color:var(--slate); text-transform:uppercase; padding:6px 8px; border-bottom:1.5px solid var(--line);}
  table.mini td{padding:8px; border-bottom:1px solid #f0ece1; vertical-align:middle;}
  table.mini td .del{background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px;}
  .inline-form{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .inline-form input, .inline-form select{flex:1; min-width:100px;}
  .note-box{background:var(--warn-bg); border:1px solid #e6cd9c; border-radius:8px; padding:12px 14px; font-size:12.5px; color:#7a5a13; margin-bottom:18px;}
  .summary-stats{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .summary-stats .stat{flex:1; padding:12px 10px; text-align:center; border-right:1px solid var(--line);}
  .summary-stats .stat:last-child{border-right:none;}
  .summary-stats .stat .num{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--navy);}
  .summary-stats .stat .lbl{font-size:11px; color:var(--slate); margin-top:2px;}
  .summary-link{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
    background:var(--paper); border:1px dashed var(--amber-dark); border-radius:8px; padding:11px 13px;
  }
  .summary-link .txt{font-size:12.5px; color:var(--ink);}
  .summary-link .txt b{color:var(--navy);}
  .summary-link a{font-size:12px; font-weight:700; color:var(--amber-dark); text-decoration:none; white-space:nowrap;}
  .summary-link a:hover{text-decoration:underline;}
  .info-toggle{margin-bottom:10px;}
  .info-toggle summary{
    cursor:pointer; font-size:12.5px; color:var(--amber-dark); font-weight:600; list-style:none;
  }
  .info-toggle summary::-webkit-details-marker{display:none;}
  .info-toggle summary::before{content:'ℹ️ '; }
  .info-toggle p{margin-top:8px;}
  .auth-warn{background:#fbeae8; border:1px solid #e7b7b1; border-left:4px solid var(--danger);
    border-radius:8px; padding:10px 12px; margin:10px 0; font-size:12.5px; line-height:1.75; color:#7a2b24;}
  .auth-note{background:#fbf0dd; border:1px solid #e6cfa4; border-left:4px solid var(--amber-dark);
    border-radius:8px; padding:10px 12px; margin:10px 0; font-size:12.5px; line-height:1.75; color:#7a5510;}
  .auth-warn b, .auth-note b{color:inherit;}

  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:var(--navy); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.2); animation:toastin .18s ease-out;}
  .toast.err{background:var(--danger);}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ดูรูปเต็มจอ (lightbox) — วางไว้นอก #app เหมือนกล้อง เพราะ render() เขียนทับ innerHTML ทั้งก้อนทุกครั้ง */
  .lightbox{
    display:none; position:fixed; inset:0; z-index:9500; background:rgba(0,0,0,.94);
  }
  .lightbox.open{display:block;}
  /* ใช้ margin:auto จัดกึ่งกลางแทน align/justify-center — เวลาซูมจนรูปใหญ่กว่าจอ
     flex ที่จัดกึ่งกลางจะตัดขอบซ้าย/บนจนเลื่อนไปดูไม่ได้ */
  .lb-stage{
    position:absolute; inset:0; display:flex; overflow:auto; -webkit-overflow-scrolling:touch;
    padding:calc(54px + env(safe-area-inset-top)) 10px calc(46px + env(safe-area-inset-bottom));
  }
  .lb-stage img{
    margin:auto; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
    border-radius:4px; cursor:zoom-in; -webkit-user-select:none; user-select:none; -webkit-user-drag:none;
  }
  .lb-stage.zoom img{max-width:none; max-height:none; cursor:zoom-out;}
  .lb-bar{
    position:absolute; top:0; left:0; right:0; z-index:2; display:flex; align-items:center; justify-content:space-between;
    gap:12px; color:#fff; font-size:13px; pointer-events:none;

   ที่ยังอยู่สถานะ Developing เท่านั้น ทำให้พนักงานคนอื่นเข้าไม่ได้เลย จึงเลิกใช้ LIFF ทั้งหมด) */
const DEVICE_ID_KEY = 'mtDeviceId';
/* บั๊มเลขนี้ทุกครั้งที่แก้ไข index.html — ใช้เทียบกับไฟล์ล่าสุดบนเซิร์ฟเวอร์เพื่อเตือนแท็บที่เปิดค้าง
   ไว้นานให้รีเฟรช ป้องกันปัญหาแท็บเก่ารันโค้ดที่ล้าสมัย (เช่น ลิงก์แจ้งเตือนที่ยังไม่มี deep link) */
const APP_VERSION = '2026-09-04.1';

/* ============================= SNAPSHOT ในเครื่อง (เปิดแอปแล้วเห็นหน้าจอทันที) =============================
   ทุก storeGet คือหนึ่ง execution ของ Apps Script ซึ่งรันในนามเจ้าของสคริปต์คนเดียวสำหรับผู้ใช้ทุกคน
   ตอนเปิดแอปจึงต้องรอคิว — ก่อนหน้านี้ผู้ใช้เห็นแต่ข้อความ "กำลังตรวจสอบสิทธิ์ผู้ใช้งาน…" ค้างอยู่
   จนกว่าจะครบ 2 คลื่นคำขอ (สิทธิ์ แล้วค่อย config) ซึ่งนานเป็นนาทีเวลาคิวยาว

   วิธีแก้: เก็บสำเนาข้อมูลล่าสุดที่โหลดสำเร็จไว้ใน localStorage แล้วรอบถัดไปวาดหน้าจอจากสำเนานั้น
   ทันทีโดยไม่แตะเครือข่ายเลย (stale-while-revalidate) ระหว่างนั้นค่อยยิงเช็คสิทธิ์/โหลดของจริง
   เบื้องหลังแล้ววาดทับด้วยของสด

   กติกาความปลอดภัยของสำเนานี้ — ห้ามผ่อน:
   - คำตอบจากเซิร์ฟเวอร์ชนะสำเนาเสมอ ถ้าเช็คสิทธิ์แล้วพบว่าไม่มีสิทธิ์จริง จะล้างสำเนาแล้วรีโหลดทันที
   - สำเนาผูกกับ deviceId + APP_VERSION และหมดอายุใน 7 วัน คนละเครื่อง/คนละเวอร์ชันใช้ต่อไม่ได้
   - สำเนาใช้ "แสดงผล" เท่านั้น ไม่ปลดล็อกการเขียนกลับ — state.ordersLoaded/state.loaded ยังคงเป็น true
     เฉพาะเมื่อโหลดจากเซิร์ฟเวอร์สำเร็จจริง ปุ่มที่ต้องบันทึกทับ orders ทั้งก้อนจึงยังถูกล็อกไว้เหมือนเดิม
     (ดู persistOrders) ไม่งั้นจะเขียนข้อมูลเก่าทับของใหม่บนเซิร์ฟเวอร์ */
const SNAPSHOT_KEY = 'mtSnapshot';
const SNAPSHOT_MAX_AGE = 7 * 24 * 60 * 60 * 1000;   // 7 วัน
const SNAPSHOT_MAX_BYTES = 2500000;                  // กันเขียนจนเต็มโควตา localStorage (~5MB)
const SNAPSHOT_MIN_GAP = 20000;                      // เขียนถี่สุดทุก 20 วิ — การ stringify orders ทั้งก้อนไม่ฟรี
function readSnapshot(){
  try{
    const raw = localStorage.getItem(SNAPSHOT_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.v !== APP_VERSION) return null;
    if(!s.at || Date.now() - s.at > SNAPSHOT_MAX_AGE) return null;
    return s;
  }catch(e){ return null; }
}
function clearSnapshot(){
  try{ localStorage.removeItem(SNAPSHOT_KEY); }catch(e){ /* เขียนไม่ได้ก็ช่างมัน */ }
}
let snapshotLastWrite = 0;
function saveSnapshot(force){
  // เก็บเฉพาะตอนเข้าใช้งานได้จริงและมี config ของจริงจากเซิร์ฟเวอร์แล้วเท่านั้น
  // ไม่งั้นจะเผลอแคชค่า default ที่ฝังในโค้ดไว้เป็น "ข้อมูลจริง" ของรอบถัดไป
  if(state.authStatus !== 'ok' || !state.loaded || !state.deviceId) return;
  if(!force && Date.now() - snapshotLastWrite < SNAPSHOT_MIN_GAP) return;
  try{
    const payload = JSON.stringify({
      v: APP_VERSION,
      at: Date.now(),
      deviceId: state.deviceId,
      auth: {
        allowedRoles: state.allowedRoles,
        techIdentities: state.techIdentities,
        myName: state.myName,
        role: state.role,
      },
      config: state.config,
      counters: state.counters,
      orders: state.ordersLoaded ? state.orders : null,
      notifications: state.ordersLoaded ? state.notifications : null,
    });
    if(payload.length > SNAPSHOT_MAX_BYTES){ clearSnapshot(); return; }
    localStorage.setItem(SNAPSHOT_KEY, payload);
    snapshotLastWrite = Date.now();
  }catch(e){ /* โควตาเต็ม/โหมดส่วนตัว — ไม่ใช่เรื่องคอขาดบาดตาย ปล่อยให้โหลดจากเซิร์ฟเวอร์ตามปกติ */ }
}
/* วาง snapshot ลง state เพื่อ "วาดหน้าจอ" อย่างเดียว — ไม่แตะ state.loaded/state.ordersLoaded
   ซึ่งเป็นธงที่ปลดล็อกการเขียนกลับเซิร์ฟเวอร์ (ดูเหตุผลด้านบน) */
function applySnapshot(s){
  if(!s || s.deviceId !== state.deviceId) return false;
  const roles = ((s.auth && s.auth.allowedRoles) || []).filter(r => ROLES[r]);
  if(!roles.length) return false;
  state.allowedRoles = roles;
  state.techIdentities = (s.auth.techIdentities || []);
  state.myTechName = state.techIdentities[0] || '';
  state.myName = s.auth.myName || '';
  state.role = roles.includes(s.auth.role) ? s.auth.role : roles[0];
  state.authStatus = 'ok';
  applyMyNameToForm();
  if(s.config){ state.config = s.config; if(!state.config.lineWebhooks) state.config.lineWebhooks = {}; state.configFromCache = true; }
  if(s.counters) state.counters = s.counters;
  if(Array.isArray(s.orders)) state.orders = s.orders;
  if(Array.isArray(s.notifications)) state.notifications = s.notifications;
  return true;
}
/* "มีรายชื่อแผนก/เครื่องจักร/ช่างของจริงให้โชว์แล้วหรือยัง" — จริงจากเซิร์ฟเวอร์ หรือจากสำเนาก็ได้
   ต่างจาก state.loaded ที่แปลว่า "โหลดจากเซิร์ฟเวอร์สำเร็จรอบนี้" ซึ่งใช้กั้นการ *แก้ไข* config เท่านั้น */
function configReady(){ return state.loaded || state.configFromCache; }

async function storeGet(key){
  try{
    const res = await fetch(API_URL + '?key=' + encodeURIComponent(key));
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : null;
  }catch(e){ console.error('storage get failed', key, e); return undefined; }
}
async function getUserRoles(userId){
  try{
    const res = await fetch(API_URL + '?key=userRoles&userId=' + encodeURIComponent(userId));
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : { roles:[], techNames:[] };
  // คืน null (ไม่ใช่ { roles:[] }) ตอนเน็ต/เซิร์ฟเวอร์มีปัญหา เพื่อให้ resolveAccess() แยกออกจากกรณี
  // "เช็คสำเร็จแต่ไม่มีสิทธิ์จริงๆ" ได้ — ไม่งั้นคนที่มีสิทธิ์อยู่แล้วจะโดนเด้งกลับไปหน้าขอสิทธิ์ทุกครั้งที่โหลดพลาด
  }catch(e){ console.error('getUserRoles failed', e); return null; }
}
// ขอใบแจ้งซ่อมใบเดียวจากเซิร์ฟเวอร์ (กรองฝั่ง Apps Script) — ใช้ตอนเปิดแอปจากลิงก์แจ้งเตือน LINE
// โดยตรง เพื่อโชว์หน้ารายละเอียดได้ไวโดยไม่ต้องรอโหลดรายการ orders ทั้งหมดก่อน
async function getOrderById(id){
  try{
    const res = await fetch(API_URL + '?key=order&id=' + encodeURIComponent(id));
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : null;
  }catch(e){ console.error('getOrderById failed', id, e); return null; }
}
/* ============================= IDENTITY & ACCESS (ไม่ต้องล็อกอิน LINE) =============================
   ใครก็เปิดลิงก์แอปนี้จากเบราว์เซอร์อะไรก็ได้ แล้ว "ขอสิทธิ์" ในหน้าแรก → ผู้ดูแลระบบ (admin) กดอนุมัติ
   และเลือกบทบาทให้ → ผู้ขอเข้าใช้งานได้เองภายในไม่กี่วินาที โดยไม่ต้องล็อกอินซ้ำ

   บทบาทของผู้ใช้หนึ่งคนมาจาก 2 แหล่งรวมกัน (union) — ใช้แหล่งไหนก็ได้:
   1) ชีต "สิทธิ์ผู้ใช้ LINE" (คอลัมน์ userId | บทบาท | ชื่อ) — ผู้ดูแลพิมพ์แถวเองใน Google Sheet
      โดยใส่ "รหัสประจำเครื่อง" (ขึ้นต้นด้วย D-) ลงคอลัมน์ userId ได้ตรงๆ ค้นหาฝั่งเซิร์ฟเวอร์
      ผ่าน doGet('userRoles', ...) เหมือนเดิม (ไม่ต้องแก้ Apps Script)
   2) คำขอสิทธิ์ที่ admin อนุมัติในแอป (KV key 'accessRequests') — กดอนุมัติในหน้าตั้งค่าได้เลย

   หมายเหตุความปลอดภัย: ในคำขอที่เก็บบนเซิร์ฟเวอร์จะบันทึกเฉพาะ "ลายนิ้วมือ" (sha256) ของรหัส
   ประจำเครื่อง ไม่เก็บรหัสตัวจริง เพื่อไม่ให้ผู้ใช้คนอื่นอ่านรายการคำขอแล้วนำรหัสของคนอื่นไปสวมสิทธิ์ */
function randomToken(len){
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b => b.toString(36).padStart(2,'0')).join('').slice(0, len);
}
/* รูปแบบรหัสประจำเครื่องที่ยอมรับ — ใช้ตรวจทั้งค่าที่อ่านจากที่เก็บ (กันขยะ/ค่าที่ถูกตัดกลางคัน)
   และค่าที่ผู้ใช้วางเองในช่อง "ใช้รหัสประจำเครื่องเดิม" */
const DEVICE_ID_RE = /^D-[A-Za-z0-9_-]{6,64}$/;
function isDeviceId(v){ return DEVICE_ID_RE.test(String(v || '').trim()); }
function readCookie(name){
  const m = ('; ' + document.cookie).match(new RegExp('; ' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}
function writeCookie(name, value){
  // 365 วัน · path=/ เพื่อให้ใช้ร่วมกันได้ทุกหน้าใต้โดเมนเดียวกัน · Secure เฉพาะบน https (GitHub Pages เป็น https)
  document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=31536000; SameSite=Lax'
    + (location.protocol === 'https:' ? '; Secure' : '');
}
/* เขียนรหัสประจำเครื่องลงทั้ง 3 ที่ (localStorage · cookie · sessionStorage) แล้ว "อ่านกลับมาตรวจ"
   ว่าเก็บติดจริงไหม — คืน true ถ้ามีอย่างน้อยหนึ่งที่ที่อยู่ข้ามการรีเฟรชได้
   เหตุผลที่ต้องเก็บหลายที่: ในเบราว์เซอร์ของแอป LINE / โหมดส่วนตัว / Safari ที่ล้างข้อมูลเว็บอัตโนมัติ
   localStorage อาจเขียนไม่ได้หรือถูกล้างทิ้ง ทำให้แอปสร้างรหัสใหม่ทุกครั้งที่เปิด — รหัสที่ผู้ดูแลเพิ่ง
   ใส่ลงชีตจึงกลายเป็นรหัสเก่าทันทีและเข้าใช้งานไม่ได้สักที (ต่อให้ตอนคัดลอกรหัสมันตรงกันก็ตาม) */
function persistDeviceId(id){
  let durable = false;
  try{
    localStorage.setItem(DEVICE_ID_KEY, id);
    durable = localStorage.getItem(DEVICE_ID_KEY) === id;
  }catch(e){ /* โหมดส่วนตัว/บล็อกคุกกี้ */ }
  try{
    writeCookie(DEVICE_ID_KEY, id);
    if(!durable) durable = readCookie(DEVICE_ID_KEY) === id;
  }catch(e){ /* คุกกี้ถูกปิด */ }
  try{ sessionStorage.setItem(DEVICE_ID_KEY, id); }catch(e){ /* อยู่ได้แค่แท็บนี้ ไม่นับเป็น durable */ }
  return durable;
}
function readStoredDeviceId(){
  let v = '';
  try{ v = localStorage.getItem(DEVICE_ID_KEY) || ''; }catch(e){ /* อ่านไม่ได้ */ }
  if(!isDeviceId(v)) v = readCookie(DEVICE_ID_KEY);
  if(!isDeviceId(v)){ try{ v = sessionStorage.getItem(DEVICE_ID_KEY) || ''; }catch(e){ v = ''; } }
  return isDeviceId(v) ? String(v).trim() : '';
}
function getDeviceId(){
  const found = readStoredDeviceId();
  const id = found || ('D-' + randomToken(24));
  state.deviceIdIsNew = !found;
  // เขียนกลับทุกที่เสมอ ไม่ใช่เฉพาะตอนสร้างใหม่ — ที่เก็บที่ยังรอดจะได้ช่วยกู้ที่เก็บที่ถูกล้างไป
  state.deviceIdPersisted = persistDeviceId(id);
  return id;
}
/* ทดสอบการเชื่อมต่อ Apps Script แบบเห็นคำตอบดิบๆ — เอาไว้ชี้ว่าอาการ "ใส่รหัสในชีตแล้วแต่ยังเข้าไม่ได้"
   ติดอยู่ชั้นไหนกันแน่ ระหว่าง (1) เข้าเซิร์ฟเวอร์ไม่ได้เลย (2) เซิร์ฟเวอร์ตอบคำขออื่นได้แต่ userRoles
   ไม่คืนสิทธิ์ ทั้งที่แถวในชีตถูกต้อง — มักแปลว่าโค้ดส่วน userRoles ในสคริปต์หายไปตอนวางโค้ดไม่ครบ
   (3) เซิร์ฟเวอร์บอกว่ามีสิทธิ์แล้ว แปลว่าปัญหาอยู่ฝั่งแอป ไม่ใช่ชีต */
async function probeUrl(url){
  try{
    const res = await fetch(url);
    const text = await res.text();
    return { ok: res.ok, status: res.status, text: text.slice(0, 500) };
  }catch(e){ return { ok:false, status:0, text: 'fetch ล้มเหลว: ' + String((e && e.message) || e) }; }
}
async function runConnectionTest(){
  const id = state.deviceId || '';
  const rolesUrl = API_URL + '?key=userRoles&userId=' + encodeURIComponent(id);
  state.ui.connTest = { running:true, url: rolesUrl };
  render();
  const [roles, kv] = await Promise.all([probeUrl(rolesUrl), probeUrl(API_URL + '?key=accessRequests')]);
  let granted = null;
  try{ const j = JSON.parse(roles.text); granted = j.value ? JSON.parse(j.value) : null; }catch(e){ /* ไม่ใช่ JSON */ }
  let verdict;
  if(!roles.ok && !kv.ok){
    verdict = '❌ เข้าถึง Apps Script ไม่ได้เลย — เปิด Apps Script → Deploy → Manage deployments → แก้ไข (ดินสอ) → ตั้ง "Who has access" เป็น Anyone แล้ว Deploy ใหม่ และตรวจว่า /exec ตรงกับที่ฝังในแอป';
  } else if(granted && (granted.roles || []).length){
    verdict = '✅ เซิร์ฟเวอร์ตอบว่ารหัสนี้มีสิทธิ์: ' + (granted.roles || []).join(', ') + ' — กด "ตรวจสอบสิทธิ์ตอนนี้" อีกครั้งเพื่อเข้าระบบ';
  } else if(kv.ok){
    verdict = '⚠️ Apps Script ตอบคำขออื่นได้ปกติ แต่ userRoles ไม่คืนสิทธิ์ของรหัสนี้ ทั้งที่มีแถวในชีตแล้ว — มักแปลว่าโค้ดส่วน userRoles/readUserRoles_ ในสคริปต์หายไปหรือไม่ครบ ให้วางโค้ด Apps Script ใหม่ทั้งไฟล์ (แทนที่ทั้งหมด) แล้ว Deploy → Manage deployments → Version: New version';
  } else {
    verdict = '⚠️ ผลไม่ชัดเจน — ลองกดทดสอบอีกครั้ง';
  }
  state.ui.connTest = { at: Date.now(), url: rolesUrl, verdict, roles, kv };
  render();
}

/* ตรวจสุขภาพ relay LINE ("LineOA MT") จากในแอป — ใช้ตอนมีคนทักหา OA แล้ว userId ไม่ขึ้น
   ในแท็บ "LINE Users" จะได้รู้ว่าปัญหาอยู่ที่ relay (เปิดชีตไม่ได้ / token หมดอายุ) หรือ
   อยู่ที่ LINE Developers Console (ยิง webhook มาไม่ถึง relay เลย) โดยไม่ต้องเปิด Apps Script
   relay ตอบ ?key=selftest เป็น JSON — ดูโค้ดฝั่ง relay ได้ที่ docs/line-relay.gs */
async function runLineRelayTest(){
  const url = lineRelayUrl();
  if(!url){ toast('ยังไม่ได้ตั้งค่า URL ของ relay', true); return; }
  state.ui.lineTest = { running:true };
  render();
  const res = await probeUrl(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'key=selftest');
  let data = null;
  try{ data = JSON.parse(res.text); }catch(e){ /* ไม่ใช่ JSON — ดูข้อความดิบแทน */ }

  const lines = [];
  let verdict;
  if(!res.ok && !res.status){
    verdict = '❌ ยิงไปที่ relay ไม่ได้เลย — ตรวจว่า URL ถูกต้อง และ Apps Script → Deploy → Manage deployments ตั้ง "Who has access" เป็น Anyone แล้ว Deploy เวอร์ชันใหม่';
  } else if(!data){
    verdict = '⚠️ relay ตอบกลับมาแต่ไม่ใช่ JSON — มักแปลว่าโดน redirect ไปหน้า login ของ Google (ตั้ง "Who has access" เป็น Anyone) หรือโค้ดใน relay ยังเป็นเวอร์ชันเก่าที่ไม่มี selftest (วางโค้ดจาก docs/line-relay.gs ทับแล้ว Deploy ใหม่)';
  } else {

      : `❌ เปิดชีตไม่ได้ (SPREADSHEET_ID=${c.spreadsheet.id || '-'}) — ${c.spreadsheet.fix || ''}`);
    if(c.usersSheet) lines.push(c.usersSheet.ok
      ? `✅ แท็บ LINE Users มี ${c.usersSheet.rows} รายชื่อ`
      : `⚠️ ${c.usersSheet.error || 'ยังไม่มีแท็บ LINE Users'} — ${c.usersSheet.fix || ''}`);
    if(c.accessToken) lines.push(c.accessToken.ok
      ? '✅ LINE_CHANNEL_ACCESS_TOKEN ใช้งานได้'
      : `❌ token ใช้ไม่ได้ (HTTP ${c.accessToken.httpCode || '-'}) — ${c.accessToken.fix || ''}`);

    // เวอร์ชันของโค้ดที่ deploy อยู่จริง — ตรวจก่อนอย่างอื่นเสมอ เพราะถ้าโค้ดเป็นของเก่า
    // ผลตรวจข้ออื่นจะดูปกติดีทั้งที่การส่งจริงพังอยู่ (relay เก่าไม่อ่าน userIds ที่แอปส่งไปให้)
    lines.push(data.version === RELAY_CODE_VERSION
      ? `✅ โค้ด relay เป็นเวอร์ชันล่าสุด (${data.version})`
      : `❌ โค้ด relay เป็นเวอร์ชัน ${data.version || 'เก่ามาก (ไม่บอกเวอร์ชัน)'} แต่แอปรุ่นนี้คู่กับ ${RELAY_CODE_VERSION} — ${RELAY_UPDATE_STEPS}`);

    if(data.version !== RELAY_CODE_VERSION){
      verdict = `❌ โค้ดใน Apps Script เป็นคนละเวอร์ชันกับแอป — ${RELAY_UPDATE_STEPS}`;
    } else if(data.ok && c.usersSheet && c.usersSheet.ok && c.usersSheet.rows === 0){
      verdict = '⚠️ relay ตั้งค่าถูกหมดแล้ว แต่ยังไม่มีใครถูกบันทึกเลยสักคน — แปลว่า LINE ยิง webhook มาไม่ถึง relay ให้ไปตั้ง Webhook URL + เปิดสวิตช์ "Use webhook" ที่ developers.line.biz → Messaging API และปิดการตอบกลับอัตโนมัติใน LINE OA Manager';
    } else if(data.ok){
      verdict = '✅ relay ปกติดีทุกข้อ — ถ้ายังมีคนทักแล้วไม่ขึ้น ให้เปิดแท็บ "Relay Log" ในชีตเพื่อดูว่าตกที่ขั้นไหน';
    } else {
      verdict = '❌ relay ตั้งค่าไม่ครบ — แก้ตามรายการด้านล่าง แล้วกดทดสอบใหม่';
    }
  }
  state.ui.lineTest = { at: Date.now(), url, verdict, lines, res };
  render();
}
/* ยิงข้อความทดสอบเข้า LINE จริงตามบทบาทที่เลือก แล้วบอกผลตรงๆ ว่าถึงกี่คน
   ต่างจาก "ทดสอบ relay" ตรงที่อันนั้นตรวจแค่การตั้งค่า ส่วนอันนี้เดินเส้นทางเดียวกับการแจ้งเตือน

async function runLineSendTest(){
  const role = state.ui.testSendRole || 'admin';

  const ids = lineRecipientsForRole(role);
  const stamp = new Date().toLocaleString('th-TH', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  const res = await tryLineWebhook(role, `[ทดสอบระบบ] ข้อความทดสอบการแจ้งเตือนของบทบาท "${ROLES[role] ? ROLES[role].label : role}" เมื่อ ${stamp} — ถ้าท่านได้รับข้อความนี้ แปลว่าการแจ้งเตือน LINE ใช้งานได้ปกติ`);
  let verdict;
  if(res.ok === null) verdict = '⚠️ ส่งคำขอออกไปแล้วแต่อ่านผลตอบกลับไม่ได้ — ให้ดูที่มือถือว่าข้อความเข้าหรือไม่ (' + (res.note || '') + ')';
  else if(res.ok) verdict = `✅ relay ส่งสำเร็จ ${res.sent} ข้อความ — ตรวจที่ LINE ของผู้รับได้เลย`;
  else verdict = '❌ ไม่ถึงใครเลย — ' + (res.note || 'relay ไม่พบผู้รับสำหรับบทบาทนี้') + (ids.length ? '' : `\nแอปหา LINE ของบทบาท "${role}" ไม่เจอสักคน ให้ผูก LINE ให้ผู้ใช้ในหัวข้อ "คำขอสิทธิ์เข้าใช้งาน" ด้านบน หรือเพิ่มแถว (บทบาท=${role}, userId) ในแท็บ "แจ้งเตือน LINE - ผู้รับ" ของชีต`);
  state.ui.testSend = { at: Date.now(), role, verdict, appIds: ids.length, sent: res.sent, targets: res.targets };
  render();
  // ส่งไม่ออก = ต่อด้วยการตรวจสุขภาพ relay ให้เลย ไม่ต้องให้ผู้ใช้ไปกดปุ่มที่สองเอง
  // (คำตอบของ selftest จะบอกว่าเป็นที่ชีต, ที่ token หรือที่เวอร์ชันโค้ดของ relay)
  if(res.ok === false) await runLineRelayTest();
}
/* ผูกเครื่องนี้กับรหัสประจำเครื่องเดิมที่ผู้ดูแลใส่ไว้ในชีตแล้ว — ทางออกเมื่อรหัสเดิมหายไป

   แถวใหม่ในชีตทุกครั้งที่รหัสเปลี่ยน */
async function useExistingDeviceId(){
  const raw = (state.ui.deviceIdInput || '').trim();
  if(!isDeviceId(raw)){ toast('รหัสประจำเครื่องไม่ถูกต้อง — ต้องขึ้นต้นด้วย D- และคัดลอกมาให้ครบทั้งบรรทัด', true); return; }
  state.deviceIdPersisted = persistDeviceId(raw);
  state.deviceIdIsNew = false;
  state.deviceId = raw;
  clearSnapshot();   // เปลี่ยนตัวตนแล้ว สำเนาของรหัสเดิมใช้ต่อไม่ได้ (applySnapshot กันไว้อีกชั้นด้วย)
  state.didHash = await sha256Hex(raw);
  state.ui.deviceIdInput = '';
  state.ui.deviceIdTried = true;
  await resolveAccess();
  if(state.authStatus === 'ok'){ toast('เข้าใช้งานด้วยรหัสเดิมสำเร็จ'); await startApp(); return; }
  const c = state.lastCheck;
  if(c && !c.serverOk) toast('ติดต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', true);
  else toast('ยังไม่พบสิทธิ์ของรหัสนี้ — ตรวจว่าในชีตพิมพ์รหัสตรงกันทุกตัวอักษรหรือยัง', true);
  render();
}
async function sha256Hex(str){
  if(!crypto.subtle) return '';   // ต้องเป็น https เท่านั้น (GitHub Pages เป็น https อยู่แล้ว)
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function requestFor(hash, list){
  if(!hash) return null;
  return (list || []).find(r => r.didHash === hash) || null;
}
// เติมชื่อผู้ล็อกอินลงช่อง "ชื่อผู้แจ้ง" ให้อัตโนมัติ แค่ตอนช่องยังว่างอยู่ — ไม่เขียนทับ
// ถ้าผู้ใช้แก้ไขเป็นชื่ออื่นเอง (เช่น แจ้งซ่อมแทนเพื่อนร่วมงาน)
function applyMyNameToForm(){
  if(state.myName && !state.form.requestedBy) state.form.requestedBy = state.myName;
}
/* รวมบทบาทจากชีต + จากคำขอที่อนุมัติแล้ว แล้วตัดสินว่าเข้าใช้งานได้หรือยัง */
async function resolveAccess(){
  const [sheet, requests] = await Promise.all([
    getUserRoles(state.deviceId),
    storeGet('accessRequests'),
  ]);
  // เก็บผลดิบไว้โชว์ในหน้า "ขอสิทธิ์เข้าใช้งาน" เพื่อให้แยกออกว่าติดที่ชั้นไหน: ติดต่อเซิร์ฟเวอร์ไม่ได้
  // (serverOk=false) หรือ ติดต่อได้แต่ไม่พบรหัสนี้ในชีต (serverOk=true แต่ roles ว่าง)
  state.lastCheck = { at: Date.now(), serverOk: sheet !== null, roles: (sheet && sheet.roles) || [] };
  // sheet===null (getUserRoles ล้มเหลว) หรือ requests===undefined (storeGet ล้มเหลว) แปลว่าเช็คไม่สำเร็จ
  // ไม่ใช่ "ไม่มีสิทธิ์จริงๆ" — ถ้าตอนนี้เข้าใช้งานอยู่แล้ว (authStatus==='ok') ห้ามล้างสิทธิ์ทิ้งเด็ดขาด
  // คงสถานะเดิมไว้ก่อน ไม่งั้นแค่โหลดพลาดครั้งเดียว (เน็ตกระตุก/Apps Script ช้า) จะเด้งคนที่มีสิทธิ์อยู่แล้ว
  // กลับไปหน้า "ขอสิทธิ์เข้าใช้งาน" ทั้งที่ยังมีสิทธิ์ปกติ — บั๊กนี้เคยเจอเป็นครั้งคราว
  if((sheet === null || requests === undefined) && state.authStatus === 'ok') return;

  state.accessRequests = Array.isArray(requests) ? requests : [];
  const mine = requestFor(state.didHash, state.accessRequests);
  state.myRequest = mine;

  const roles = [...((sheet && sheet.roles) || [])];
  const techNames = [...((sheet && (sheet.techNames || (sheet.techName ? [sheet.techName] : []))) || [])];
  if(mine && mine.status === 'approved'){
    (mine.roles || []).forEach(r => roles.push(r));
    if(mine.techName) techNames.push(mine.techName);
  }
  // กรองเฉพาะบทบาทที่ระบบรู้จักจริง — พิมพ์ชื่อบทบาทผิดในชีต (เช่น "Tech") จะได้ไม่ทำให้แอปพัง
  state.allowedRoles = [...new Set(roles.filter(r => ROLES[r]))];
  state.techIdentities = [...new Set(techNames)];
  state.myTechName = state.techIdentities[0] || '';
  // ชื่อของผู้ล็อกอินเอง (จากตอนขอสิทธิ์ หรือชื่อช่างถ้าไม่มี) ไว้เติมช่อง "ชื่อผู้แจ้ง" ให้อัตโนมัติ
  // จะได้ไม่ต้องพิมพ์ชื่อตัวเองซ้ำทุกครั้งที่แจ้งซ่อม
  state.myName = (mine && mine.name) || state.techIdentities[0] || '';
  applyMyNameToForm();
  if(state.allowedRoles.length){
    // คงบทบาทที่กำลังใช้อยู่ไว้ถ้ายังมีสิทธิ์นั้นจริง — resolveAccess() ถูกเรียกซ้ำได้ระหว่างใช้งาน
    // (ตอนบูตจากสำเนา, ตอน poll เจอว่าคำขอสิทธิ์เปลี่ยน) การรีเซ็ตกลับเป็นบทบาทแรกทุกครั้งจะเตะผู้ใช้
    // ออกจากบทบาทที่เพิ่งสลับไป รวมถึงบทบาทที่มาจากลิงก์แจ้งเตือน LINE (?role=...)
    state.role = state.allowedRoles.includes(state.role) ? state.role : state.allowedRoles[0];
    state.authStatus = 'ok';
  } else if(mine && mine.status === 'pending'){
    state.authStatus = 'pending';
  } else if(mine && mine.status === 'rejected'){
    state.authStatus = 'rejected';
  } else {
    state.authStatus = 'guest';
  }
}
/* ระหว่างรอผู้ดูแลอนุมัติ ให้เช็คสิทธิ์ซ้ำเป็นระยะ พออนุมัติแล้วจะเข้าระบบให้เองโดยผู้ใช้ไม่ต้องทำอะไร
   หน้านี้ยิง 2 คำขอต่อรอบ จึงต้องกันซ้อนและหยุดตอนแท็บถูกซ่อนด้วยเหตุผลเดียวกับ pollForUpdates
   — คนที่ค้างอยู่หน้านี้แล้วเปิดทิ้งไว้ไม่ควรไปแย่งคิว Apps Script กับคนที่กำลังใช้งานจริง */
let recheckInFlight = false;
async function recheckAccess(manual){
  if(state.authStatus === 'ok') return;
  if(recheckInFlight) return;
  if(!manual && document.hidden) return;
  recheckInFlight = true;
  try{ await recheckAccessInner(manual); }
  finally{ recheckInFlight = false; }
}
async function recheckAccessInner(manual){
  const before = state.authStatus;
  const beforeServerOk = state.lastCheck ? state.lastCheck.serverOk : null;
  if(manual) state.ui.deviceIdTried = true;
  await resolveAccess();
  // เข้าระบบต่อในหน้าเดิมเลย ห้าม location.reload() — ถ้าเบราว์เซอร์เก็บรหัสประจำเครื่องไม่ได้
  // (ดู persistDeviceId) การรีโหลดจะสร้างรหัสใหม่ทันที แล้วเด้งกลับมาหน้าขอสิทธิ์ด้วยรหัสคนละตัว
  // ทั้งที่เพิ่งได้สิทธิ์ไปหยกๆ — เป็นอาการ "ใส่รหัสในชีตแล้วแต่ยังเข้าไม่ได้สักที"
  if(state.authStatus === 'ok'){ await startApp(); return; }
  if(manual){
    const c = state.lastCheck;
    if(c && !c.serverOk) toast('ติดต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', true);
    else if(state.authStatus === 'pending') toast('ยังรอผู้ดูแลอนุมัติอยู่');
    else toast('ยังไม่พบสิทธิ์ของรหัสประจำเครื่องนี้ในระบบ', true);
    render();
    return;
  }
  // เรนเดอร์ใหม่เฉพาะตอนสถานะเปลี่ยนจริงๆ — ไม่งั้นทุก 7 วินาทีจะรื้อ DOM ทิ้งจนเคอร์เซอร์หลุด
  // จากช่องที่ผู้ใช้กำลังพิมพ์อยู่ในฟอร์มขอสิทธิ์
  if(state.authStatus !== before || (state.lastCheck && state.lastCheck.serverOk) !== beforeServerOk) render();
}
/* เขียนรายการคำขอแบบดึงของล่าสุดมาก่อนเสมอ ลดโอกาสที่สองคนกดพร้อมกันแล้วทับกันเอง */
async function saveAccessRequests(mutate){
  const latest = await storeGet('accessRequests');
  const list = (Array.isArray(latest) ? latest : state.accessRequests).slice();
  const next = mutate(list);
  if(!next) return false;
  const ok = await storeSet('accessRequests', next);
  if(ok) state.accessRequests = next;
  return ok;
}
// เดารุ่นเบราว์เซอร์/อุปกรณ์แบบคร่าวๆ จาก user agent — แค่ไว้ให้ admin แยกแถวที่ชื่อซ้ำกัน
// (เช่น คนเดียวกันขอผ่านมือถือ 1 ครั้ง คอม 1 ครั้ง) ไม่ใช่ตัวระบุตัวตนที่แม่นยำ และไม่กระทบความ
// ปลอดภัยของ didHash เลย เพราะ user agent เป็นข้อมูลสาธารณะที่เบราว์เซอร์ส่งให้ทุกเว็บอยู่แล้ว
function deviceLabel(){
  const ua = navigator.userAgent || '';
  let os = '';
  if(/iPhone|iPad|iPod/.test(ua)) os = 'iPhone/iPad';
  else if(/Android/.test(ua)) os = 'Android';
  else if(/Windows/.test(ua)) os = 'Windows';
  else if(/Macintosh/.test(ua)) os = 'Mac';
  else if(/Linux/.test(ua)) os = 'Linux';
  let browser = '';
  if(/Line\//.test(ua)) browser = 'LINE in-app';
  else if(/EdgiOS|Edg\//.test(ua)) browser = 'Edge';
  else if(/CriOS|Chrome\//.test(ua)) browser = 'Chrome';
  else if(/FxiOS|Firefox\//.test(ua)) browser = 'Firefox';
  else if(/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  return [browser, os].filter(Boolean).join(' · ') || 'ไม่ทราบอุปกรณ์';
}
async function submitAccessRequest(){
  const u = state.ui;
  const name = (u.reqName || '').trim();
  if(!name){ toast('กรุณากรอกชื่อ-นามสกุล', true); return; }
  if(!ROLES[u.reqRole] || u.reqRole === 'admin'){ toast('กรุณาเลือกบทบาทที่ต้องการ', true); return; }
  if(u.reqRole === 'tech' && !u.reqTechName){ toast('กรุณาเลือกชื่อช่างของท่าน', true); return; }
  if(!state.didHash){ toast('เบราว์เซอร์นี้ไม่รองรับการขอสิทธิ์ กรุณาใช้เบราว์เซอร์อื่น', true); return; }
  const entry = {
    id: uid(), didHash: state.didHash, name,
    device: deviceLabel(),
    dept: u.reqDept || '',
    requestedRole: u.reqRole,
    requestedTechName: u.reqRole === 'tech' ? u.reqTechName : '',
    note: (u.reqNote || '').trim(),
    roles: [], techName: '', status: 'pending',
    at: nowIso(), decidedAt: '', decidedBy: '',
  };
  u.reqSending = true; render();
  const ok = await saveAccessRequests(list => {
    const idx = list.findIndex(r => r.didHash === state.didHash);
    if(idx >= 0) list[idx] = entry; else list.push(entry);
    return list;
  });
  u.reqSending = false;
  if(!ok){ toast('ส่งคำขอไม่สำเร็จ กรุณาลองใหม่', true); render(); return; }
  state.myRequest = entry;

  // ต้องรอ config (lineWebhooks) โหลดให้เสร็จก่อนแจ้งเตือน — ตอนนี้หน้าขอสิทธิ์โชว์ได้ก่อน config
  // จะโหลดเสร็จ ถ้าผู้ใช้กดส่งไวมากอาจจะยังไม่มี URL webhook ให้ยิง ไม่งั้น admin จะไม่ได้รับแจ้งเตือนเงียบๆ
  await ensureEssentialLoaded();

}
async function cancelMyAccessRequest(){
  const ok = await saveAccessRequests(list => list.filter(r => r.didHash !== state.didHash));
  if(!ok){ toast('ยกเลิกคำขอไม่สำเร็จ', true); return; }

    state.ui.reqTechName = mine.requestedTechName || '';

  }

  state.authStatus = 'guest';

async function approveAccessRequest(id){
  const req = state.accessRequests.find(r => r.id === id);
  if(!req) return;
  const roles = (state.ui.grantRole[id] && state.ui.grantRole[id].length) ? state.ui.grantRole[id] : [req.requestedRole];
  if(!roles.length || !roles.every(r => ROLES[r])){ toast('กรุณาเลือกบทบาทอย่างน้อย 1 บทบาท', true); return; }
  // บทบาท tech ต้องผูกกับชื่อช่างที่ตรงกับชีต "ช่าง" เป๊ะๆ ไม่งั้นจะไม่เห็นปุ่มเริ่ม/จบงานของตัวเอง
  const techName = roles.includes('tech') ? (state.ui.grantTechName[id] || req.requestedTechName || '') : '';
  if(roles.includes('tech') && !techName){ toast('กรุณาเลือกชื่อช่างให้ตรงกับรายชื่อในชีต "ช่าง"', true); return; }
  const lineUserId = (state.ui.grantLineUserId[id] || req.lineUserId || '').trim();
  const ok = await saveAccessRequests(list => {
    const t = list.find(r => r.id === id);
    if(!t) return null;
    t.status = 'approved'; t.roles = roles; t.techName = techName; t.lineUserId = lineUserId;
    t.decidedAt = nowIso();
    t.decidedBy = ROLES[state.role] ? ROLES[state.role].label : 'ผู้ดูแลระบบ';
    return list;
  });
  if(!ok){ toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true); return; }
  toast(`อนุมัติ ${req.name} เป็น "${roles.map(r => ROLES[r].label).join(', ')}" แล้ว`);
  if(lineUserId){
    await sendLineToUserIds([lineUserId],
      `✅ คำขอสิทธิ์เข้าใช้งานของคุณได้รับอนุมัติแล้ว เป็น "${roles.map(r => ROLES[r].label).join(', ')}"\nเข้าใช้งานได้ทันทีที่ ${APP_URL}`);
  }
  render();
}

  // LINE userId ที่ผูกไว้กับคนนี้ = ปลายทางที่การแจ้งเตือนของบทบาทข้างบนจะถูกส่งไปหา
  // (ดู lineRecipientsForRole ซึ่งรวมผู้ใช้ที่อนุมัติแล้วเข้ากับตาราง lineUserRoles)

async function copyText(text, okMsg){
  try{
    await navigator.clipboard.writeText(text);
    toast(okMsg || 'คัดลอกแล้ว');
  }catch(e){
    // สำรองสำหรับเบราว์เซอร์/บริบทที่ยังไม่รองรับ Clipboard API
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg || 'คัดลอกแล้ว'); }
    catch(e2){ toast('คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตัวเอง', true); }
    ta.remove();
  }
}
async function storeSet(key, val){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ key, value: JSON.stringify(val) })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

/* โหลดเฉพาะข้อมูลที่จำเป็นต่อการใช้งานหน้าแรก (ฟอร์ม "ใบคำร้อง/ใบแจ้งซ่อม") ให้เร็วที่สุด — แผนก/
   เครื่องจักร/ช่างอยู่ใน config เท่านั้น ส่วน orders/notifications/counters (ก้อนใหญ่ โตขึ้นเรื่อยๆ
   ตามประวัติ) กับข้อมูลหน้าตั้งค่า (lineUsers ฯลฯ ใช้แค่ admin) เลื่อนไปโหลดทีหลังแยกต่างหาก */
let essentialLoadPromise = null;
// เรียก loadEssential() ครั้งเดียวไม่ว่าจะถูกเรียกจากกี่จุด — คืน promise เดิมถ้ากำลังโหลดอยู่แล้ว/โหลดเสร็จแล้ว
// กันไม่ให้ยิง storeGet('config') ซ้ำซ้อน (เช่นตอน submitAccessRequest ต้องรอ lineWebhooks ให้พร้อมก่อนแจ้งเตือน)
function ensureEssentialLoaded(){
  if(!essentialLoadPromise) essentialLoadPromise = loadEssential();
  return essentialLoadPromise;
}
async function loadEssential(){
  const cfg = await storeGet('config');
  state.config = cfg || state.config;
  if(!state.config.lineWebhooks) state.config.lineWebhooks = {};
  // เหมือน loadBackground: undefined = ดึงไม่สำเร็จ, null = เซิร์ฟเวอร์บอกว่ายังไม่มี config จริงๆ
  // เดิมตั้ง state.loaded = true ทั้งสองกรณี ซึ่งอันตราย เพราะธงนี้คือสิ่งที่ปลดล็อกหน้าตั้งค่าให้ "แก้ไข"
  // config ได้ — โหลดพลาดแล้วปลดล็อก = admin เปิดหน้าตั้งค่าเจอค่า default ที่ฝังในโค้ด (หรือสำเนาเก่า)
  // แล้วกดบันทึก = เขียนทับแผนก/เครื่องจักร/ช่างตัวจริงบนชีตทิ้งทั้งชุด
  if(cfg !== undefined){
    state.loaded = true;
    state.configFromCache = false;   // ของสดจากเซิร์ฟเวอร์มาถึงแล้ว ไม่ต้องอ้างสำเนาอีก
  } else {
    essentialLoadPromise = null;     // ให้ลองใหม่ได้ในครั้งถัดไป แทนที่จะจำผลที่ล้มเหลวไว้ทั้ง session
  }
  // เขียน config เริ่มต้นกลับไปเฉพาะตอนเซิร์ฟเวอร์ตอบว่า "ยังไม่มี config เลยจริงๆ" (cfg === null)
  // ห้ามเขียนทับตอนแค่ดึงข้อมูลไม่สำเร็จ (cfg === undefined เช่น deploy ใหม่ยังไม่พร้อม/เน็ตหลุด)
  // มิฉะนั้นจะเผลอเขียนทับ config จริงบนเซิร์ฟเวอร์ (เช่น lineWebhooks ที่ตั้งไว้) ด้วยค่า default ว่างๆ
  // ชั้นป้องกันเพิ่ม: ให้เขียนได้เฉพาะ admin และต้องกดยืนยันก่อนเสมอ ห้าม auto-write เงียบๆ
  // อีกต่อไป — บทบาทอื่นข้ามไปเฉยๆ (ใช้ default ในเครื่องสำหรับ session นี้พอ ไม่ persist)
  if(cfg === null){
    if(state.role === 'admin' && confirm('เซิร์ฟเวอร์ยังไม่มีข้อมูลตั้งค่า (config) เลย — ต้องการเริ่มต้นค่าเริ่มต้นใหม่หรือไม่?\n\nกด "ยกเลิก" หากไม่แน่ใจ เพื่อป้องกันการเขียนทับข้อมูลเดิม (เช่น LINE Webhook) โดยไม่ตั้งใจ')){
      await storeSet('config', state.config);
    } else {
      console.warn('ข้าม auto-seed config เริ่มต้น (ยังไม่ยืนยัน หรือไม่ใช่ admin)');
    }
  }
}
/* ก้อนข้อมูลใหญ่/โตเรื่อยๆ — โหลดคู่ขนานไปเบื้องหลังหลังหน้าจอแรกโชว์แล้ว ไม่บล็อกผู้ใช้
   (ปุ่มที่ต้องเขียนกลับ orders ทุกปุ่มเช็ค state.ordersLoaded ก่อนเสมอ ดู persistOrders()) */
async function loadBackground(){
  const [counters, orders, notifs] = await Promise.all([
    storeGet('counters'), storeGet('orders'), storeGet('notifications')
  ]);
  if(counters !== undefined) state.counters = counters || {};
  // storeGet คืน undefined เมื่อดึงไม่สำเร็จ (คนละความหมายกับ null ที่แปลว่า "ไม่มีคีย์นี้จริงๆ")
  // เดิมโค้ดนี้ไม่ได้แยกสองกรณีนั้น พอโหลดพลาดจึงตั้ง state.orders = [] แล้วปลดล็อก ordersLoaded = true
  // ตามไปด้วย = ปุ่มใดก็ตามที่กดหลังจากนั้นจะเขียนอาร์เรย์ว่างทับใบแจ้งซ่อมทั้งหมดบนชีต
  // โหลดพลาดต้องไม่ปลดล็อกอะไรทั้งสิ้น — ปล่อยให้รอบ poll ถัดไปที่ได้ orders มาจริงเป็นคนปลดล็อกแทน
  if(orders !== undefined && notifs !== undefined){
    // ถ้าเปิดจากลิงก์แจ้งเตือนมาก่อน state.orders อาจมีใบที่ peek มาใบเดียวอยู่แล้ว (หรือรายการจาก
    // สำเนาในเครื่อง) — รายการเต็มที่โหลดมาตอนนี้ถูกต้องกว่าเสมอ แทนที่ตรงๆ ได้เลย
    state.orders = orders || [];
    state.notifications = notifs || [];
    state.ordersLoaded = true;
  }
  render();
  saveSnapshot(true);   // ของสดครบชุดแล้ว — เก็บไว้ให้รอบเปิดแอปครั้งหน้าวาดหน้าจอได้ทันที
  ensureNotifyRoutingReady();   // เริ่มโหลดล่วงหน้า ไม่ต้องรอ — ตัวที่ยิงแจ้งเตือนจะ await เองอีกที
}
/* ผู้รับแจ้งเตือน LINE (lineUserRoles + lineRecipients) — คนที่กดปุ่มในใบแจ้งซ่อมเป็นคนยิงแจ้งเตือนเอง
   ไม่ใช่แค่ admin เครื่องของทุกคนจึงต้องรู้ว่าบทบาทไหนส่งถึง LINE ไหน (ดู lineRecipientsForRole)
   โหลดครั้งเดียวตอนเปิดแอปเท่านั้น ไม่ได้อยู่ในรอบ poll ทุก 3 วิ — ข้อมูลชุดนี้แทบไม่เปลี่ยนระหว่างวัน */
async function loadNotifyRouting(){
  if(state.lineDataLoaded) return;
  const [lineUserRoles, lineRecipients] = await Promise.all([
    storeGet('lineUserRoles'), storeGet('lineRecipients')
  ]);
  if(state.lineDataLoaded) return;   // หน้าตั้งค่าโหลดชุดเต็มแซงไปแล้วระหว่างรอ อย่าเขียนทับของใหม่ด้วยของเก่า
  if(lineUserRoles && typeof lineUserRoles === 'object') state.lineUserRoles = lineUserRoles;
  if(Array.isArray(lineRecipients)) state.lineRecipients = lineRecipients;
  // storeGet คืน undefined เมื่อดึงไม่สำเร็จ (เน็ตกระตุก / Apps Script ช้า) — ถือว่ายังไม่พร้อม
  // เพื่อให้ ensureNotifyRoutingReady() ลองใหม่ในครั้งถัดไป แทนที่จะจำผลที่ล้มเหลวไว้ทั้ง session
  return lineUserRoles !== undefined && lineRecipients !== undefined;
}
/* รอให้ข้อมูล "ใครรับแจ้งเตือนบทบาทไหน" พร้อมก่อนยิง LINE เสมอ
   เดิม loadNotifyRouting() ถูกเรียกแบบไม่รอผลจาก loadBackground() ที่เดียว ใครกดปุ่มก่อนที่
   ข้อมูลชุดนี้จะมาถึง (เปิดจากลิงก์แจ้งเตือนแล้วกดอนุมัติทันที / เน็ตช้า) จะหาผู้รับไม่เจอแล้ว
   ข้อความหายไปเงียบๆ — และถ้ารอบนั้นโหลดพลาด ก็ไม่มีใครโหลดซ้ำให้อีกเลยทั้ง session
   เพราะรอบ poll ทุก 3 วิ ข้ามคีย์กลุ่มนี้ให้ทุกคนที่ไม่ใช่ admin */
let notifyRoutingPromise = null;
function ensureNotifyRoutingReady(){
  if(state.lineDataLoaded) return Promise.resolve(true);
  if(!notifyRoutingPromise){
    notifyRoutingPromise = loadNotifyRouting()
      .then(ok => { if(!ok) notifyRoutingPromise = null; return ok; })
      .catch(e => { notifyRoutingPromise = null; console.warn('โหลดข้อมูลผู้รับแจ้งเตือนไม่สำเร็จ', e); return false; });
  }
  return notifyRoutingPromise;
}
/* ข้อมูลเฉพาะหน้า "ตั้งค่าข้อมูลหลัก" ของ admin — คนอื่นไม่เคยต้องใช้เลย จึงโหลดแบบขี้เกียจ (lazy)
   แค่ตอน admin เข้าหน้านี้จริงๆ (เรียกจาก setView) ไม่ต้องรวมอยู่ใน initial load ของทุกคน */
async function ensureLineDataLoaded(){
  if(state.lineDataLoaded) return;
  const [lineUsers, lineUserRoles, lineRecipients] = await Promise.all([
    storeGet('lineUsers'), storeGet('lineUserRoles'), storeGet('lineRecipients')
  ]);
  state.lineUsers = Array.isArray(lineUsers) ? lineUsers : [];
  state.lineUserRoles = (lineUserRoles && typeof lineUserRoles === 'object') ? lineUserRoles : {};
  state.lineRecipients = Array.isArray(lineRecipients) ? lineRecipients : [];
  state.lineDataLoaded = true;
  render();
}

/* ============================= UTIL ============================= */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
// รองรับข้อมูลเก่าที่ยังเป็น assignment.technician (string เดี่ยว) ก่อนเปลี่ยนเป็น technicians (array)
function assignedTechs(o){
  if(o.assignment.technicians && o.assignment.technicians.length) return o.assignment.technicians;
  if(o.assignment.technician) return [o.assignment.technician];
  return [];
}
function nowIso(){ return new Date().toISOString(); }
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtDate(dstr){
  if(!dstr) return '-';
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'2-digit' });
}
/* วันนี้ในรูปแบบ YYYY-MM-DD ตามเวลาเครื่องผู้ใช้ — ห้ามใช้ toISOString() ทำงานนี้
   เพราะมันคืนค่าเป็น UTC ช่วงเที่ยงคืน-ตี 7 ตามเวลาไทยจะได้ "เมื่อวาน" เป็นค่าตั้งต้น */
function todayLocalIso(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function yyNow(){ return String(new Date().getFullYear() % 100).padStart(2,'0'); }
function previewDocNumber(deptCode){
  if(!deptCode) return 'xx---/'+yyNow();
  const yy = yyNow();
  const last = (state.counters[deptCode] && state.counters[deptCode][yy]) || 0;
  return deptCode + String(last+1).padStart(3,'0') + '/' + yy;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
/* เทียบชื่อคนแบบไม่สนช่องว่าง/ตัวพิมพ์/รูปแบบ Unicode — ชื่อเดียวกันที่พิมพ์คนละที่ (ชีตผู้รับ,
   คำขอสิทธิ์, ชื่อช่างใน config) มักต่างกันแค่เว้นวรรคซ้ำ, nbsp หรืออักขระความกว้างศูนย์ */
function normPersonName(t){
  return String(t == null ? '' : t).normalize('NFC').replace(/[\s\u00a0\u200b-\u200d\ufeff]/g, '').toLowerCase();
}
function samePersonName(a, b){
  const x = normPersonName(a), y = normPersonName(b);
  return !!x && x === y;
}
/* หา LINE userId ของผู้รับสำหรับบทบาทหนึ่งๆ จากตารางที่ admin กำหนดไว้ในหน้าตั้งค่า
   ใช้กับบทบาทที่ "ทั้งกลุ่มต้องรู้" เท่านั้น (fm / gm / maint / admin)
   ห้ามใช้กับ 'requester' หรือ 'tech' — สองอันนั้นต้องเจาะจงคนผ่าน lineIdsForPerson() */
function lineRecipientsForRole(role){
  const map = state.lineUserRoles || {};
  const matches = m => ((m.roles || []).includes(role) || (m.techName && m.techName === role));
  const ids = Object.keys(map).filter(userId => matches(map[userId] || {}));
  // ...รวมกับผู้ใช้ที่อนุมัติสิทธิ์แล้วและ admin ผูก LINE ไว้ให้ตอนอนุมัติ/แก้ไขบทบาท
  // (นี่คือทางหลักตั้งแต่ยุบหัวข้อ "กำหนดบทบาทผู้ใช้ LINE" มารวมกับคำขอสิทธิ์ที่เดียว)
  (state.accessRequests || []).forEach(r => {
    if(r.status !== 'approved' || !r.lineUserId) return;
    if(matches(r) && !ids.includes(r.lineUserId)) ids.push(r.lineUserId);
  });
  // ...และแถวที่พิมพ์เองในชีต "แจ้งเตือน LINE - ผู้รับ" ด้วย: relay จะข้ามการอ่านชีตทันทีที่เราส่ง
  // userIds มาให้ ถ้าไม่รวมแถวพวกนี้เข้ามาเอง คนที่มีแต่แถวในชีตจะหายไปจากผู้รับ
  (state.lineRecipients || []).forEach(r => {
    if(!r.userId || String(r.role || '').trim() !== String(role || '').trim()) return;
    if(!ids.includes(r.userId)) ids.push(r.userId);
  });
  return ids;
}
/* ผู้รับแบบ "เจาะจงคนเดียว" — ใช้กับผู้แจ้งซ่อมของใบนั้น และช่างที่ถูกมอบหมายงานนั้น
   คืน LINE userId เท่าที่หาเจอ (ว่างได้ = ไม่ส่ง) โดยไล่จากตัวระบุที่แม่นที่สุดไปหาที่หยาบที่สุด
   และ "หยุดทันทีที่เจอ" เพื่อไม่ให้ชื่อซ้ำกับคนอื่นลากคนที่ไม่เกี่ยวข้องเข้ามาด้วย
   สำคัญ: ห้ามตกไปใช้บทบาททั้งกลุ่มเป็น fallback เด็ดขาด — หาไม่เจอให้เงียบไปเลย ไม่ใช่ส่งหาทุกคน */
function lineIdsForPerson({ lineUserId = '', didHash = '', techName = '', name = '' } = {}){
  const out = [];
  const add = v => { const id = String(v || '').trim(); if(id && !out.includes(id)) out.push(id); };
  const reqs = state.accessRequests || [];
  const roleMap = state.lineUserRoles || {};
  const sheetRows = state.lineRecipients || [];

  // 1) LINE ที่ผูกไว้กับใบนี้ตรงๆ ตั้งแต่ตอนสร้าง — แม่นที่สุด
  add(lineUserId);
  // 2) รหัสประจำเครื่องของคนที่กดสร้างใบ (ลายนิ้วมือ sha256 ในคำขอสิทธิ์)
  if(!out.length && didHash){
    const r = reqs.find(x => x.status === 'approved' && x.didHash === didHash && x.lineUserId);
    if(r) add(r.lineUserId);
  }
  // 3) ชื่อช่าง — ตรงกับ "ชื่อช่าง" ที่ผูกไว้ในคำขอสิทธิ์ / lineUserRoles / คอลัมน์บทบาทในชีตผู้รับ
  if(!out.length && techName){
    reqs.forEach(r => { if(r.status === 'approved' && samePersonName(r.techName, techName)) add(r.lineUserId); });
    Object.keys(roleMap).forEach(id => { if(samePersonName((roleMap[id] || {}).techName, techName)) add(id); });
    sheetRows.forEach(r => { if(samePersonName(r.role, techName)) add(r.userId); });
  }
  // 4) ชื่อ-นามสกุล (ใบเก่าที่ยังไม่ได้เก็บตัวระบุตัวตนไว้ตอนสร้าง)
  if(!out.length && name){
    reqs.forEach(r => { if(r.status === 'approved' && samePersonName(r.name, name)) add(r.lineUserId); });
    Object.keys(roleMap).forEach(id => { if(samePersonName((roleMap[id] || {}).name, name)) add(id); });
    sheetRows.forEach(r => { if(samePersonName(r.name, name)) add(r.userId); });
  }
  return out;
}
/* ผู้แจ้งซ่อมของใบนี้คนเดียว ไม่ใช่ทุกคนที่มีบทบาท "ผู้แจ้งซ่อม" */
function orderRequesterLineIds(o){
  return lineIdsForPerson({ lineUserId: o.requesterLineUserId, didHash: o.requesterDidHash, name: o.requestedBy });
}
/* URL ปลายทางของ relay LINE: ใช้ค่าคงที่ LINE_RELAY_URL ก่อน แล้วจึงค่อยตกไปใช้ค่าที่ตั้งไว้ในชีต
   (จำเป็นตอนย้ายบัญชี — ค่าในชีตยังเป็น URL ของสคริปต์บัญชีเก่าซึ่งยิงไปก็ไม่มีอะไรเกิดขึ้น) */
function lineRelayUrl(role){
  if(LINE_RELAY_URL) return LINE_RELAY_URL;
  const hooks = state.config.lineWebhooks || {};
  return (role && hooks[role]) || Object.values(hooks).find(Boolean) || '';
}
/* ============================= แกนกลางการส่ง LINE =============================
   ทุกการยิงแจ้งเตือนผ่านฟังก์ชันเดียวนี้ เพื่อให้ได้สามอย่างที่เดิมไม่มีเลย
   1) "รอ" ให้ข้อมูลผู้รับ (lineUserRoles / lineRecipients / accessRequests) โหลดเสร็จก่อนเสมอ
      เดิม loadNotifyRouting() ถูกยิงแบบไม่รอผล ใครกดปุ่มเร็วกว่าที่ข้อมูลจะมาถึงจะหาผู้รับไม่เจอ
      แล้วข้อความหายไปเงียบๆ ทั้งใบ
   2) อ่านคำตอบของ relay จริงๆ ว่าส่งถึงกี่คน (relay ตอบ { ok, sent, targets }) แทนที่จะทิ้ง
      ผลลัพธ์แล้วเดาเอาว่าสำเร็จ
   3) เก็บผลทุกครั้งไว้ใน state.lineSendLog ให้เปิดดูย้อนหลังได้ที่หน้าตั้งค่า — เดิมทุกความ
      ผิดพลาดถูกกลืนหายไปใน console.warn จึงตอบไม่ได้เลยว่า "ทำไมไม่ได้รับแจ้งเตือน" */
function logLineSend(entry){
  if(!Array.isArray(state.lineSendLog)) state.lineSendLog = [];
  state.lineSendLog.unshift(Object.assign({ at: Date.now() }, entry));
  if(state.lineSendLog.length > 30) state.lineSendLog.length = 30;
}
/* เวอร์ชันของโค้ด relay (docs/line-relay.gs) ที่แอปรุ่นนี้คู่กัน — relay ตอบ version กลับมาทุกคำขอ
   ถ้าไม่ตรงหรือไม่มีเลย แปลว่าโค้ดใน Apps Script ยังเป็นของเก่า (ไฟล์ใน repo ไม่ได้รันเอง ต้อง
   คัดลอกไปวางแล้ว Deploy ใหม่ทุกครั้ง) — นี่คือสาเหตุอันดับหนึ่งของอาการ
   "แอปเห็นผู้รับ 2 คน แต่ relay ตอบว่าไม่พบผู้รับ" ซึ่งเดิมแอปไม่มีทางรู้เลย */
const RELAY_CODE_VERSION = '2026-09-03.1';
const RELAY_UPDATE_STEPS = 'เปิด Apps Script โปรเจกต์ "LineOA MT" → วางโค้ดจากไฟล์ docs/line-relay.gs ทับทั้งไฟล์ → Deploy → Manage deployments → ✏️ → Version: New version → Deploy';
/* แปลรหัสตอบกลับของ LINE Messaging API เป็นสาเหตุ + วิธีแก้ที่ลงมือทำได้จริง */
function lineErrorHint(code){
  const c = Number(code || 0);
  if(c === 401) return 'LINE_CHANNEL_ACCESS_TOKEN ผิดหรือหมดอายุ — ออก token ใหม่ที่ developers.line.biz → ช่อง Messaging API → Channel access token แล้ววางที่ Apps Script → Project Settings → Script properties';
  if(c === 403) return 'channel นี้ส่งข้อความ push ไม่ได้ — ตรวจว่า token เป็นของ LINE OA ตัวเดียวกับที่ผู้รับเพิ่มเป็นเพื่อน และบัญชียังไม่ถูกระงับ';
  if(c === 400) return 'userId ของผู้รับไม่ถูกต้อง หรือผู้รับยังไม่ได้เพิ่ม LINE OA นี้เป็นเพื่อน (หรือบล็อกไว้) — ให้เจ้าตัวทักหา OA ก่อน แล้วเอา userId จากแท็บ "LINE Users" ในชีตมาผูกให้ที่หัวข้อคำขอสิทธิ์';
  if(c === 429) return 'ส่งข้อความครบโควตาของบัญชี LINE OA เดือนนี้แล้ว — ตรวจโควตาที่ LINE OA Manager';
  if(c >= 500) return 'ฝั่ง LINE ขัดข้องชั่วคราว ลองส่งใหม่อีกครั้ง';
  return '';
}
/* สรุปคำตอบของ relay เป็นข้อความเดียวที่บอกตรงๆ ว่า "ตกที่ขั้นไหน"
   เดิมทุกความล้มเหลวถูกเหมารวมเป็น "relay ไม่พบผู้รับสำหรับการแจ้งเตือนนี้" ซึ่งไม่จริงเสมอไป
   และพาไปแก้ผิดจุดทุกครั้ง (ไปไล่เพิ่มผู้รับ ทั้งที่ตัวปัญหาคือ token หรือโค้ด relay เก่า) */
function relayResultNote({ data, sent, targets, errors, wanted }){
  const parts = [];
  // เวอร์ชันไม่ตรงคือสาเหตุที่ต้องบอกก่อนเพื่อนเสมอ เพราะทำให้ทุกอาการอื่นอธิบายผิดได้หมด
  const versionBad = data.version !== RELAY_CODE_VERSION;
  if(versionBad){
    parts.push(`โค้ด relay ใน Apps Script เป็น${data.version ? 'เวอร์ชัน ' + data.version : 'เวอร์ชันเก่า (ไม่บอกเวอร์ชันกลับมา)'} แต่แอปรุ่นนี้คู่กับ ${RELAY_CODE_VERSION} — ${RELAY_UPDATE_STEPS}`);
  }
  if(data.error) parts.push('relay ปฏิเสธคำขอ: ' + data.error);
  else if(!sent){
    if(targets > 0){
      // relay หาคนเจอแล้ว แต่ LINE ไม่รับ — สาเหตุอยู่ที่ token/ตัว userId/โควตา ไม่ใช่ที่รายชื่อผู้รับ
      const first = errors[0] || {};
      parts.push(`relay หาผู้รับได้ ${targets} คน แต่ LINE ไม่ยอมส่งสักคน` +
        (first.code ? ` (LINE ตอบ HTTP ${first.code}${first.message ? ': ' + first.message : ''})` : ''));
      const hint = lineErrorHint(first.code);
      if(hint) parts.push('วิธีแก้: ' + hint);
    } else if(wanted > 0){
      if(!versionBad) parts.push(`แอปส่งรายชื่อผู้รับไปให้ ${wanted} คน แต่ relay ตอบว่าไม่มีผู้รับเลย — ให้ตรวจโค้ด relay ว่าอ่านฟิลด์ userIds จริง (${RELAY_UPDATE_STEPS})`);
    } else {
      parts.push('ไม่พบผู้รับของการแจ้งเตือนนี้ ทั้งในแอปและในแท็บ "แจ้งเตือน LINE - ผู้รับ" ของชีต');
    }
  }
  if(data.note) parts.push(data.note);
  return parts.join(' • ');
}
/* ยิง payload ไปที่ relay แล้วแปลผลกลับมาเป็น { ok, sent, targets, errors, note }
   ok === null หมายถึง "ส่งออกไปแล้วแต่อ่านผลไม่ได้" (เบราว์เซอร์บล็อกการอ่าน response ข้ามโดเมน)
   ซึ่งไม่ใช่ความล้มเหลว — คำขอถึง Apps Script ไปแล้ว จึงห้ามรายงานว่าส่งไม่สำเร็จ */
async function postToRelay(payload, label){
  const url = lineRelayUrl(payload.role);
  const wanted = (payload.userIds || []).length;   // จำนวนผู้รับที่ "แอป" หาเจอและส่งไปให้ relay
  if(!url){
    logLineSend({ label, ok:false, sent:0, note:'ยังไม่ได้ตั้งค่า URL ของ relay' });
    return { ok:false, sent:0, note:'ยังไม่ได้ตั้งค่า URL ของ relay' };
  }
  const body = JSON.stringify(Object.assign({ at: nowIso(), appVersion: APP_VERSION }, payload));
  try{
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
    const text = await res.text();
    let data = null;
    try{ data = JSON.parse(text); }catch(e){ /* relay ตอบมาไม่ใช่ JSON */ }
    if(!data){
      const note = 'relay ตอบกลับมาแต่ไม่ใช่ JSON (HTTP ' + res.status + ') — มักแปลว่าโดนเด้งไปหน้า login ของ Google ให้ตั้ง Deploy → Who has access = Anyone';
      logLineSend({ label, ok:false, sent:0, wanted, note, raw:text.slice(0,300) });
      return { ok:false, sent:0, note };
    }
    const sent = Number(data.sent || 0);
    const targets = Number(data.targets || 0);
    const errors = Array.isArray(data.errors) ? data.errors : [];
    const note = relayResultNote({ data, sent, targets, errors, wanted });
    // เก็บคำตอบดิบไว้ด้วยเมื่อส่งไม่ออก — เวลาสาเหตุอยู่นอกเหนือที่แปลไว้ จะได้อ่านของจริงได้เลย
    logLineSend({ label, ok: sent > 0, sent, targets, wanted, errors,
      relayVersion: data.version || '', note, raw: sent ? '' : text.slice(0, 300) });
    return { ok: sent > 0, sent, targets, errors, note };
  }catch(e){
    // fetch พังหลังคำขอออกไปแล้วได้ (CORS ตอน redirect ของ Apps Script) — นับเป็น "ไม่ทราบผล"
    const note = 'ส่งคำขอออกไปแล้วแต่อ่านผลตอบกลับไม่ได้: ' + String((e && e.message) || e);
    logLineSend({ label, ok:null, sent:null, note });
    return { ok:null, sent:null, note };
  }
}
/* ส่งถึง userId ที่ระบุมาเท่านั้น — ไม่แนบ role ไปด้วยโดยตั้งใจ เพราะ relay จะตกไปอ่านชีต
   "แจ้งเตือน LINE - ผู้รับ" ตาม role ทันทีที่ userIds ว่าง (ดู handleNotifyRequest_) ซึ่งจะทำให้
   แจ้งเตือนเฉพาะบุคคลกลายเป็นส่งหาทุกคนในบทบาทนั้นแทน
   ถ้าหาตัวคนไม่เจอจริงๆ ให้ผู้เรียกส่ง fallbackRole มา เพื่อยอมให้ relay อ่านชีตแทนการทิ้งข้อความ */
async function sendLineToUserIds(userIds, message, opts){
  const o = opts || {};
  await ensureNotifyRoutingReady();
  const ids = [...new Set((userIds || []).map(x => String(x || '').trim()).filter(Boolean))];
  if(ids.length) return await postToRelay({ userIds: ids, message }, o.label || 'เจาะจงบุคคล');
  // ---- หาผู้รับเจาะจงไม่เจอ ----
  if(!o.fallbackRole){
    logLineSend({ label:o.label || 'เจาะจงบุคคล', ok:false, sent:0, note:'ไม่พบ LINE ของผู้รับ และไม่มีทางสำรอง — ส่งเฉพาะการแจ้งเตือนในแอป' });
    return { ok:false, sent:0 };
  }
  // ให้ relay อ่านแถวตามบทบาทในชีต "แจ้งเตือน LINE - ผู้รับ" แทน ดีกว่าปล่อยให้ข้อความหายไปเฉยๆ
  // (แถวพวกนี้คือคนที่ผู้ดูแลพิมพ์ไว้เอง ไม่ใช่การกระจายมั่วไปทั้ง OA) และเติมชื่อเจ้าของเรื่อง
  // ลงในข้อความ เพื่อไม่ให้คนที่ได้รับเข้าใจผิดว่าเป็นใบของตัวเอง
  // เติมชื่อเจ้าของเรื่องเฉพาะตอนที่ทางสำรองอาจถึง "หลายคน" (role=requester) — ถ้าทางสำรองคือชื่อ
  // คนนั้นเองอยู่แล้ว (role=ชื่อช่าง) ข้อความก็ถึงเจ้าตัวคนเดียว ไม่ต้องมีคำนำหน้าให้รกเปล่าๆ
  const named = (o.targetName && o.fallbackRole !== o.targetName)
    ? ('(ถึง: ' + o.targetName + ')\n' + message) : message;
  const r = await postToRelay({ role:o.fallbackRole, message: named, alsoSheet:true }, (o.label || 'เจาะจงบุคคล') + ' → สำรองตามบทบาท');
  return r;
}
async function tryLineWebhook(role, message){
  await ensureNotifyRoutingReady();
  const url = lineRelayUrl(role);
  if(!url) return { ok:false, sent:0 };
  // ส่ง userIds ไปด้วยเพื่อให้สคริปต์ LINE relay ยิงตรงถึงคนที่ admin กำหนดไว้ได้
  // alsoSheet: บอก relay ให้ "รวม" แถวตามบทบาทในชีตเข้ากับ userIds ที่ส่งไป แทนที่จะข้ามชีต
  // ทันทีที่ userIds ไม่ว่าง — เดิมคนที่มีแต่แถวในชีตจะถูกตัดทิ้งทั้งที่ตั้งค่าไว้ถูกต้อง

  const userIds = lineRecipientsForRole(role);
  return await postToRelay({ role, message, userIds, alsoSheet:true }, 'บทบาท ' + role);
}

/* ============ การเขียนรายการแจ้งเตือนแบบไม่ทับกันเอง ============
   คีย์ 'notifications' บนเซิร์ฟเวอร์เป็น "อาร์เรย์ก้อนเดียว" เขียนทีไรก็ทับทั้งก้อน เดิมโค้ดเอา
   state.notifications ในหน่วยความจำยิงทับตรงๆ จึงเสียแจ้งเตือนได้สองทาง
     1) สองเครื่องกดพร้อมกัน → คนเขียนทีหลังทับของคนแรกทิ้ง
     2) pushNotification() ค้างรอ LINE อยู่หลายวินาที ระหว่างนั้น pollForUpdates() (ทุก ~3 วิ)
        อ่านค่าเก่าจากเซิร์ฟเวอร์มาทับ state.notifications แถวที่เพิ่งเพิ่มจึงหลุดออกจาก
        หน่วยความจำ แล้วการเขียนครั้งถัดไปก็เอาอาร์เรย์ที่ขาดตัวนั้นไปทับลงชีตถาวร
   หลักฐานในชีตจริง: ST-WH005/26 มีแถว fm/gm แต่ requester และ maint หายทั้งที่ statusHistory
   บอกว่าเดินครบทุกขั้น และ GR063/26 หายแถว fm ของตอนสร้างใบ
   วิธีแก้: อ่านของล่าสุดมาก่อนเขียนเสมอ (แบบเดียวกับ saveAccessRequests) + เก็บแถวที่เครื่องนี้
   เพิ่งสร้างไว้ใน pendingNotifs จนกว่าจะเห็นมันกลับมาจากเซิร์ฟเวอร์จริงๆ */
const pendingNotifs = new Map();      // id -> { n, at } การแจ้งเตือนที่ยังไม่ยืนยันว่าลงเซิร์ฟเวอร์แล้ว
const PENDING_NOTIF_TTL = 10 * 60 * 1000;   // ค้างเกิน 10 นาที = เขียนไม่สำเร็จจริง เลิกยัดกลับ
/* รวมแถวที่ยังค้างยืนยันของเครื่องนี้เข้ากับรายการที่เพิ่งอ่านมาจากเซิร์ฟเวอร์
   ตัวไหนเซิร์ฟเวอร์รับไปแล้วให้ถอดออกจากรายการค้าง (ของบนเซิร์ฟเวอร์เป็นตัวจริงเสมอ) */
function mergePendingNotifs(list){
  const arr = Array.isArray(list) ? list.slice() : [];
  if(!pendingNotifs.size) return arr;
  const have = new Set(arr.map(n => n && n.id));
  const now = Date.now();
  pendingNotifs.forEach((p, id) => {
    if(have.has(id) || (now - p.at) > PENDING_NOTIF_TTL) pendingNotifs.delete(id);
  });
  const missing = [...pendingNotifs.values()].map(p => p.n).reverse();   // ใหม่สุดขึ้นก่อน ให้ตรงกับ unshift เดิม
  return missing.length ? missing.concat(arr) : arr;
}
/* เขียนรายการแจ้งเตือนโดยดึงของล่าสุดมาเป็นฐานก่อนเสมอ — คู่กับ saveAccessRequests() */
async function saveNotifications(mutate){
  const latest = await storeGet('notifications');
  const base = mergePendingNotifs(Array.isArray(latest) ? latest : state.notifications);
  const next = mutate(base);
  if(!next) return false;
  const ok = await storeSet('notifications', next);
  if(ok) state.notifications = next;
  return ok;
}
/* แจ้งเตือน "ทั้งบทบาท" — ใช้กับ fm / gm / maint เท่านั้น (ทุกคนในบทบาทนั้นต้องเห็นงานที่รอตัวเอง)
   opts.lineText = ข้อความที่จะส่งเข้า LINE ถ้าต้องการรูปแบบอื่นนอกจากค่าเริ่มต้น (ใช้กับช่าง
   ซึ่งข้อความต้องมีรายละเอียดเครื่องจักร/กำหนดงานมากกว่าที่โชว์บนกระดิ่ง) */
async function pushNotification(toRole, orderId, docNumber, message, target, opts){
  const o = opts || {};
  const n = { id: uid(), toRole, orderId, docNumber, message, createdAt: nowIso(), read:false };
  // target = แจ้งเตือนเจาะจงคน: ติดตัวระบุตัวตนไว้กับการแจ้งเตือนด้วย เพื่อให้กระดิ่งในแอป
  // โชว์เฉพาะเจ้าของใบ ไม่ใช่ทุกคนที่มีบทบาทเดียวกัน
  if(target){
    n.toDidHash = target.didHash || '';
    n.toName = target.name || '';
  }
  pendingNotifs.set(n.id, { n, at: Date.now() });   // เวลาเก็บไว้นอกตัวแจ้งเตือน ไม่ให้ปนลงชีต
  state.notifications.unshift(n);   // ขึ้นกระดิ่งของคนที่กดปุ่มทันที ไม่ต้องรอเซิร์ฟเวอร์
  const saved = await saveNotifications(list => {
    if(!list.some(x => x && x.id === n.id)) list.unshift(n);
    return list;
  });
  if(!saved) toast('บันทึกการแจ้งเตือนลงระบบไม่สำเร็จ — ระบบจะลองใหม่ให้เองในรอบถัดไป', true);
  const text = o.lineText || `[${docNumber}] ${message}\n${orderDeepLink(orderId, toRole)}`;
  const res = target
    ? await sendLineToUserIds(target.userIds, text, {
        fallbackRole: target.fallbackRole || '', targetName: target.name || '',
        label: o.label || `${docNumber} → ${toRole}` + (target.name ? ` (${target.name})` : '')
      })
    : await tryLineWebhook(toRole, text);
  // ok === false เท่านั้นที่แปลว่า "ไม่ถึงใครเลยแน่ๆ" (null = ส่งแล้วแต่อ่านผลไม่ได้ ไม่ใช่ความล้มเหลว)
  // บอกคนที่กดปุ่มไปเลยว่าแจ้งเตือนในแอปบันทึกแล้วแต่ LINE ไม่ออก จะได้ไม่เข้าใจผิดว่าส่งไปแล้ว
  if(res && res.ok === false) toast('บันทึกแล้ว แต่ส่ง LINE ไม่ออก — ดูสาเหตุที่หน้าตั้งค่า > บันทึกการส่ง LINE', true);
  return res;
}
/* แจ้งเตือนผู้แจ้งซ่อม "ของใบนี้" คนเดียว — หาคนไม่เจอก็ไม่ส่ง ดีกว่าส่งหาผู้แจ้งซ่อมทุกคน */
async function notifyOrderRequester(o, message){
  const userIds = orderRequesterLineIds(o);
  // ไม่มี LINE ผูกไว้ = ตกไปใช้แถว requester ในชีตผู้รับ (ดู fallbackRole ด้านล่าง) ซึ่งอาจถึงหลายคน
  // ทางที่ถูกต้องกว่าคือ admin ผูก LINE ให้คนนั้นในหน้าคำขอสิทธิ์ แล้วใบต่อๆ ไปจะถึงเจ้าตัวคนเดียว
  if(!userIds.length) console.warn('ไม่มี LINE ของผู้แจ้งใบ ' + o.docNumber + ' (' + (o.requestedBy || '-') + ') — ใช้ทางสำรองตามบทบาท requester');
  await pushNotification('requester', o.id, o.docNumber, message, {
    userIds,
    didHash: o.requesterDidHash || '',
    name: o.requestedBy || '',
    // ผูก LINE ของคนนี้ไว้ไม่ได้ ก็ยังดีกว่าปล่อยให้ข้อความหายไป: ให้ relay อ่านแถว requester
    // ในชีต "แจ้งเตือน LINE - ผู้รับ" (แถวที่ผู้ดูแลพิมพ์ไว้เอง) แล้วเติมชื่อผู้แจ้งไว้หน้าข้อความ
    // ไม่มีแถวนั้นในชีตก็ไม่มีอะไรถูกส่งอยู่ดี — พฤติกรรมจึงยังคุมได้จากในชีตเหมือนเดิม
    fallbackRole: 'requester',
  });
}
/* แจ้งเตือนช่างที่ถูกมอบหมาย "รายคน" — ทั้งกระดิ่งในแอปและ LINE
   เดิมช่างได้ผ่าน sendLineToTech() ซึ่งเป็น LINE ล้วน (ตัดออกแล้ว) ไม่มี pushNotification('tech', …) อยู่เลย
   สักที่ในไฟล์ (แท็บ "การแจ้งเตือน" ในชีตจึงมี fm/gm/maint/requester เท่านั้น ไม่มี tech สักแถว
   ตั้งแต่เปิดระบบมา) ผลคือช่างที่ยังไม่ถูกผูก LINE หรือช่วงที่ token พัง = ไม่ได้รับอะไรเลย
   และไม่มีร่องรอยค้างไว้ให้ย้อนดูด้วย
   message = ข้อความสั้นสำหรับกระดิ่ง · lineText = ข้อความเต็มสำหรับ LINE (มีรายละเอียดเครื่องจักร) */
async function notifyTech(o, techName, message, lineText){
  const userIds = lineIdsForPerson({ techName });
  if(!userIds.length) console.warn('ไม่มี LINE ของช่าง ' + techName + ' (ใบ ' + o.docNumber + ') — ใช้ทางสำรองตามชื่อช่างในชีตผู้รับ');
  return await pushNotification('tech', o.id, o.docNumber, message, {
    userIds, name: techName, fallbackRole: techName,
  }, { lineText, label: o.docNumber + ' → ช่าง ' + techName });
}
/* การแจ้งเตือนใบนี้เป็นของเรารึเปล่า (กระดิ่ง/หน้าการแจ้งเตือนในแอป)
   admin เห็นทุกอัน ส่วนคนอื่นเห็นเฉพาะบทบาทตัวเอง และถ้าเป็นการแจ้งเตือนแบบเจาะจงคน
   ต้องเป็นเราจริงๆ เท่านั้น (เทียบรหัสประจำเครื่องก่อน ไม่มีค่อยเทียบชื่อ) */
function notifIsMine(n){
  if(state.role === 'admin') return true;
  if(n.toRole !== state.role) return false;
  if(n.toDidHash) return n.toDidHash === state.didHash;
  // ช่างถูกอ้างด้วย "ชื่อช่าง" (เช่น 'ศักดา  สนผา (ผช.ผจก.แผนกวิศวกรรม)') ซึ่งมักไม่ตรงกับชื่อที่กรอก
  // ไว้ตอนขอสิทธิ์ ('ศักดา สนผา') จึงต้องเทียบกับ techIdentities ด้วย ไม่ใช่ myName อย่างเดียว
  if(n.toName) return samePersonName(n.toName, state.myName)
    || (state.techIdentities || []).some(t => samePersonName(t, n.toName));
  return true;   // การแจ้งเตือนเก่าที่ยังไม่มีเจ้าของเจาะจง — คงพฤติกรรมเดิมไว้
}
function unreadCountForRole(role){
  if(role === 'admin') return state.notifications.filter(n => !n.read).length;
  return state.notifications.filter(n => !n.read && notifIsMine(n)).length;
}

/* ============================= PHOTO HANDLING ============================= */
function resizeImageFile(file, maxW){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// เปิดกล้อง/อัลบั้มด้วยการ .click() ที่ตัว input โดยตรง แทนการพึ่ง label[for]
// เพราะ WebView/เบราว์เซอร์ใน Android บางตัวไม่ส่ง click ต่อไปยัง input ที่ถูกซ่อนไว้
function openPhotoPicker(inputId){
  const el = document.getElementById(inputId);
  if(!el){ toast('เปิดกล้องไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', true); return; }
  el.click();
}
// อ่านไฟล์ออกมาก่อนแล้วล้างค่า input ทันที เพื่อให้ถ่ายรูปเดิมซ้ำ (ชื่อไฟล์เดิม)
// แล้ว event change ยังทำงานอยู่
function takeFilesFromInput(input){
  const files = Array.from((input && input.files) || []);
  if(input) input.value = '';
  return files;
}
// กล้องบน Android บางรุ่นส่งไฟล์กลับมาโดยไม่มี MIME type — ถ้ากรองด้วย
// type.startsWith('image/') ตรงๆ รูปที่เพิ่งถ่ายจะถูกทิ้งเงียบๆ จึงยอมให้ไฟล์ที่ไม่มี
// type ผ่านเข้าไปลองถอดรหัสดูก่อน แล้วค่อยตกที่ catch ถ้าไม่ใช่รูปจริง
function looksLikeImage(file){
  if(!file) return false;
  if(file.type) return file.type.startsWith('image/');
  return /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(file.name || '');
}
async function collectPhotos(files, remaining){
  const out = [];
  let failed = 0;
  for(const f of files.slice(0, remaining)){
    if(!looksLikeImage(f)){ failed++; continue; }
    try{
      out.push(await resizeImageFile(f, 900));
    }catch(e){ console.error(e); failed++; }
  }
  if(failed) toast('มีรูปที่เปิดไม่สำเร็จ ' + failed + ' รูป กรุณาลองถ่ายหรือเลือกใหม่อีกครั้ง', true);
  return out;
}
/* กล้องสำรองในแอป — ใช้เมื่อปุ่ม "ถ่ายภาพ" (input capture) เปิดกล้องไม่ขึ้น ซึ่งเจอบ่อยบน

/* iPad รุ่นใหม่ส่ง UA เป็น Macintosh — ต้องดู maxTouchPoints ประกอบถึงจะแยกออกจาก Mac จริง */

/* เบราว์เซอร์ที่ฝังอยู่ในแอปอื่น (LINE, Facebook, Instagram, WeChat หรือ Android
   WebView ดิบๆ ที่มี "; wv)" ในสตริง) — พวกนี้บน Android มักไม่ยิง intent กล้องให้

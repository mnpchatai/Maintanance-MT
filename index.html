/* กล่องสำหรับผู้ดูแลระบบคนแรก (ยังไม่มีใครเป็น admin ในระบบ) — เอารหัสประจำเครื่องไปใส่ในชีตเองได้
   เป็นทางเดียวที่ใช้ตั้ง admin คนแรกได้ หลังจากนั้น admin กดอนุมัติคนอื่นในแอปได้เลย */
function renderAdminBootstrap(){
  const id = state.deviceId || '';
  const chk = state.lastCheck;
  // เตือนเมื่อเบราว์เซอร์เก็บรหัสประจำเครื่องไม่ได้ — เคสนี้รหัสจะถูกสร้างใหม่ทุกครั้งที่เปิด/รีเฟรชหน้า
  // แถวที่เพิ่งใส่ลงชีตจึงกลายเป็นรหัสเก่าทันที ทำให้ "ใส่รหัสในชีตแล้วแต่ยังเข้าไม่ได้สักที"
  const storageWarn = !state.deviceIdPersisted ? `
    <div class="auth-warn">
      <b>⚠️ เบราว์เซอร์นี้เก็บรหัสประจำเครื่องไม่ได้</b><br>
      รหัสด้านล่างจะเปลี่ยนเป็นรหัสใหม่ทุกครั้งที่ปิดแล้วเปิดแอปขึ้นมาใหม่ ถึงใส่ลงชีตไปแล้วก็จะใช้เข้าระบบไม่ได้
      มักเกิดจากเปิดในเบราว์เซอร์ในตัวแอป LINE หรือเปิดในหน้าต่างไม่ระบุตัวตน (ส่วนตัว/Incognito)<br>
      <b>วิธีแก้:</b> กดปุ่ม <span class="mono">⋯</span> มุมขวาบน → <b>เปิดในเบราว์เซอร์</b> (Chrome / Safari)
      แล้วเข้าลิงก์นี้อีกครั้ง จากนั้นค่อยคัดลอกรหัสไปใส่ในชีต
    </div>` : '';
  // ถ้าเคยขอสิทธิ์/เคยได้รหัสไว้แล้วแต่รหัสเปลี่ยนไป (เปลี่ยนเครื่อง เปลี่ยนเบราว์เซอร์ ล้างข้อมูลเว็บ)
  // ไม่ต้องไปเพิ่มแถวใหม่ในชีต — วางรหัสเดิมกลับเข้ามาที่นี่ได้เลย
  const newIdNote = state.deviceIdIsNew && state.deviceIdPersisted ? `
    <div class="auth-note">
      รหัสด้านล่างเป็น <b>รหัสใหม่</b> ที่เพิ่งสร้างให้เครื่องนี้ (ยังไม่พบรหัสเดิมในเบราว์เซอร์นี้)
      ถ้าเคยใส่รหัสของท่านลงชีตไว้แล้ว ให้วางรหัสเดิมในช่อง "ใช้รหัสประจำเครื่องเดิม" ด้านล่าง
      แทนการเพิ่มแถวใหม่
    </div>` : '';
  const checkNote = chk && !chk.serverOk ? `
    <div class="auth-warn">
      <b>⚠️ ติดต่อเซิร์ฟเวอร์ข้อมูล (Google Apps Script) ไม่สำเร็จ</b><br>
      ตอนนี้ระบบยังตรวจสิทธิ์ไม่ได้เลย จึงยังเข้าใช้งานไม่ได้แม้จะใส่รหัสในชีตถูกต้องแล้ว
      กรุณาตรวจสอบอินเทอร์เน็ต และให้ผู้ดูแลตรวจว่า Apps Script ตั้ง
      <span class="mono">Who has access: Anyone</span> ไว้แล้ว
    </div>` : (state.ui.deviceIdTried && chk && chk.serverOk && !chk.roles.length ? `
    <div class="auth-note">
      ตรวจกับชีตแล้ว — <b>ยังไม่พบรหัสประจำเครื่องนี้</b>ในชีต <b>สิทธิ์ผู้ใช้ LINE</b>
      ให้ตรวจว่าคัดลอกรหัสไปครบทั้งบรรทัด ไม่มีช่องว่างหน้า/หลัง และอยู่ในคอลัมน์
      <span class="mono">userId</span> ของแท็บนั้นจริงๆ
    </div>` : '');
  const ct = state.ui.connTest;
  const pre = (label, r) => `<div style="margin-top:6px;"><b>${escapeHtml(label)}</b> — HTTP ${r.status || 'ล้มเหลว'}<pre style="white-space:pre-wrap; word-break:break-all; font-size:11.5px; background:#efece4; border-radius:6px; padding:8px; margin:4px 0 0; max-height:160px; overflow:auto;">${escapeHtml(r.text || '')}</pre></div>`;
  const ctBox = !ct ? '' : (ct.running ? `<div class="auth-note">กำลังทดสอบการเชื่อมต่อ...</div>` : `
    <div class="auth-note">
      <b>ผลการทดสอบ</b><br>${escapeHtml(ct.verdict)}
      ${pre('userRoles (รหัสเครื่องนี้)', ct.roles)}
      ${pre('accessRequests (คำขอสิทธิ์)', ct.kv)}
    </div>`);
  return `
  <details class="info-toggle" style="margin-top:14px;" ${(!state.deviceIdPersisted || state.ui.deviceIdTried || ct || (chk && !chk.serverOk)) ? 'open' : ''}>
    <summary>สำหรับผู้ดูแลระบบ: ตั้งเครื่องนี้เป็นผู้ดูแลระบบ (admin)</summary>
    ${storageWarn}${newIdNote}
    <p class="desc" style="font-size:12.5px; color:var(--slate); margin:8px 0;">
      เปิดชีต <b>สิทธิ์ผู้ใช้ LINE</b> แล้วเพิ่ม 1 แถว โดยใส่ 3 ช่องนี้ตามลำดับ:
      <span class="mono">รหัสประจำเครื่อง</span> · <span class="mono">admin</span> · <span class="mono">ชื่อของท่าน</span>
      แล้วรอประมาณ 7 วินาที หน้านี้จะเข้าระบบให้เอง (ห้ามรีเฟรชหน้านี้ระหว่างรอ)<br>
      ขั้นตอนนี้<b>ไม่ต้องรอใครอนุมัติ</b> — เป็นทางเดียวที่ใช้ตั้งผู้ดูแลระบบคนแรกได้ตอนที่ยังไม่มีใครเป็น admin
      และใช้ให้สิทธิ์บทบาทอื่นได้ทุกบทบาทเช่นกัน พอมี admin เข้าระบบได้แล้วจะกดอนุมัติคำขอที่ค้างอยู่ในแอปได้เลย
    </p>
    <label class="field-label">รหัสประจำเครื่องของเครื่องนี้</label>
    <input class="input mono" style="font-size:12px;" readonly value="${escapeHtml(id)}" onclick="this.select()">
    <div class="order-actions" style="margin-top:10px;">
      <button class="btn btn-outline btn-sm" onclick="copyText('${escapeHtml(id)}', 'คัดลอกรหัสประจำเครื่องแล้ว')">คัดลอกรหัส</button>
      <a class="btn btn-outline btn-sm" href="${SHEET_URL}" target="_blank" rel="noopener">เปิด Sheet →</a>
      <button class="btn btn-outline btn-sm" onclick="recheckAccess(true)">ตรวจสอบสิทธิ์ตอนนี้</button>
    </div>
    ${checkNote}
    <div class="order-actions" style="margin-top:10px;">
      <button class="btn btn-outline btn-sm" onclick="runConnectionTest()">🔍 ทดสอบการเชื่อมต่อเซิร์ฟเวอร์</button>
      ${ct && ct.url ? `<a class="btn btn-outline btn-sm" href="${escapeHtml(ct.url)}" target="_blank" rel="noopener">เปิดคำตอบดิบ →</a>` : ''}
    </div>
    ${ctBox}
    <label class="field-label" style="margin-top:14px;">ใช้รหัสประจำเครื่องเดิม (เคยใส่ในชีตไว้แล้ว)</label>
    <input class="input mono" data-fid="deviceIdInput" style="font-size:12px;" placeholder="D-..."
      value="${escapeHtml(state.ui.deviceIdInput)}" oninput="state.ui.deviceIdInput=this.value">
    <p class="desc" style="font-size:12px; color:var(--slate); margin:6px 0 0;">
      วางรหัสเดิมที่อยู่ในชีตแล้วกดปุ่มนี้ เครื่องนี้จะใช้รหัสนั้นแทน ไม่ต้องเพิ่มแถวใหม่ในชีต
    </p>
    <div class="order-actions" style="margin-top:10px;">
      <button class="btn btn-outline btn-sm" onclick="useExistingDeviceId()">ใช้รหัสนี้เข้าใช้งาน</button>
    </div>
  </details>`;
}
function renderRequestAccess(){
  const u = state.ui;
  // ตอนนี้หน้านี้โชว์ได้ก่อน config (แผนก/ช่าง) จะโหลดเสร็จ (ดู authenticate()) — ระหว่างนั้น
  // state.config ยังเป็นค่า default ที่ฝังในโค้ด (DEPT_DEFAULT/TECH_DEFAULT) ซึ่งเป็นแค่ placeholder
  // ไม่ใช่ข้อมูลจริงจากชีต ถ้าเอามาโชว์เป็นตัวเลือกจะทำให้ผู้ใช้เข้าใจผิดว่าเป็นรายชื่อจริง (เคยเกิดขึ้นมาแล้ว
  // — เห็นแค่ 4 แผนกชื่อภาษาอังกฤษ ทั้งที่ชีตจริงมี 9 แผนกชื่อภาษาไทย) จึงต้องรอ state.loaded ก่อนค่อยโชว์
  // รายการจริง ระหว่างรอให้ปิดช่องเลือกไว้พร้อมข้อความ "กำลังโหลด..." แทน
  const cfgReady = configReady();
  const deptOpts = cfgReady ? (state.config.departments || []).map(d =>
    `<option value="${escapeHtml(d.code)}" ${u.reqDept === d.code ? 'selected' : ''}>${escapeHtml(d.code)} — ${escapeHtml(d.name)}</option>`).join('') : '';
  const roleOpts = Object.keys(ROLES).filter(r => r !== 'admin').map(r =>
    `<option value="${r}" ${u.reqRole === r ? 'selected' : ''}>${ROLES[r].icon} ${ROLES[r].label}</option>`).join('');
  const techOpts = cfgReady ? (state.config.technicians || []).map(t =>
    `<option value="${escapeHtml(t)}" ${u.reqTechName === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('') : '';
  return renderAuthShell(`
    <h2 class="view-title">ขอสิทธิ์เข้าใช้งาน</h2>
    <p class="view-sub">กรอกข้อมูลเพื่อขอสิทธิ์ ผู้ดูแลระบบจะเป็นผู้อนุมัติและกำหนดบทบาทให้ท่าน</p>
    <div class="card">
      <div class="field">
        <label class="field-label">ชื่อ-นามสกุล <span class="req-star">*</span></label>
        <input class="input" data-fid="reqName" value="${escapeHtml(u.reqName)}" oninput="state.ui.reqName=this.value" placeholder="เช่น สมชาย ใจดี">
      </div>
      <div class="field">
        <label class="field-label">แผนก</label>
        <select class="input" onchange="state.ui.reqDept=this.value" ${cfgReady ? '' : 'disabled'}>
          <option value="">${cfgReady ? '— ไม่ระบุ —' : 'กำลังโหลดรายชื่อแผนก...'}</option>
          ${deptOpts}
        </select>
      </div>
      <div class="field">
        <label class="field-label">บทบาทที่ต้องการ <span class="req-star">*</span></label>
        <select class="input" onchange="state.ui.reqRole=this.value; state.ui.reqTechName=''; render()">${roleOpts}</select>
      </div>
      ${u.reqRole === 'tech' ? `
      <div class="field">
        <label class="field-label">ชื่อช่าง (เลือกชื่อของท่านจากรายชื่อช่าง) <span class="req-star">*</span></label>
        <select class="input" onchange="state.ui.reqTechName=this.value" ${cfgReady ? '' : 'disabled'}>
          <option value="">${cfgReady ? '— กรุณาเลือก —' : 'กำลังโหลดรายชื่อช่าง...'}</option>
          ${techOpts}
        </select>
        <p class="desc" style="font-size:12px; color:var(--slate); margin:6px 0 0;">ต้องเลือกให้ตรงกับชื่อตัวเอง ระบบใช้ชื่อนี้ตรวจว่างานไหนเป็นงานที่มอบหมายให้ท่าน</p>
      </div>` : ''}
      <div class="field">
        <label class="field-label">หมายเหตุถึงผู้ดูแล</label>
        <input class="input" data-fid="reqNote" value="${escapeHtml(u.reqNote)}" oninput="state.ui.reqNote=this.value" placeholder="เช่น เบอร์ติดต่อ หรือข้อมูลยืนยันตัวตน">
      </div>
      <button class="btn btn-primary btn-block" onclick="submitAccessRequest()" ${u.reqSending ? 'disabled' : ''}>
        ${u.reqSending ? 'กำลังส่งคำขอ...' : 'ส่งคำขอสิทธิ์'}
      </button>
    </div>
    ${renderAdminBootstrap()}`);
}

      <h2 class="view-title" style="margin-top:6px;">คำขอสิทธิ์ไม่ได้รับการอนุมัติ</h2>
      <p class="view-sub">คำขอของ "${escapeHtml(r.name || '-')}" ถูกปฏิเสธโดยผู้ดูแลระบบ หากเข้าใจว่าเป็นความเข้าใจผิด กรุณาติดต่อผู้ดูแลระบบ แล้วส่งคำขอใหม่ได้</p>
      <button class="btn btn-outline btn-sm" onclick="cancelMyAccessRequest()">ส่งคำขอใหม่</button>
    </div>
    ${renderAdminBootstrap()}`);
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  if(state.authStatus === 'loading'){
    // คนที่กดลิงก์จากไลน์ควรเห็นว่าแอปกำลังพาไปที่ใบนั้นอยู่ ไม่ใช่ข้อความที่ไม่เกี่ยวกับสิ่งที่เขากดมา
    const waitMsg = DEEP_LINK.orderId ? 'กำลังเปิดใบแจ้งซ่อมจากลิงก์แจ้งเตือน...' : 'กำลังตรวจสอบสิทธิ์ผู้ใช้งาน...';
    app.innerHTML = `<div style="padding:60px; text-align:center; color:var(--slate);">${waitMsg}</div>`;
    return;
  }
  if(state.authStatus === 'guest'){ app.innerHTML = renderRequestAccess(); return; }
  if(state.authStatus === 'pending'){ app.innerHTML = renderPendingAccess(); return; }
  if(state.authStatus === 'rejected'){ app.innerHTML = renderRejectedAccess(); return; }
  // เดิมตรงนี้บังหน้าจอทั้งหน้าด้วย "กำลังโหลดระบบ..." จนกว่า config จะมาถึง ทำให้ผู้ใช้ต้องรอคำขอที่ช้า
  // ที่สุดก่อนเห็นอะไรเลย — ตอนนี้วาดโครงหน้าจอ (แถบหัว/เมนู/รายการ) ได้ทันที แล้วกั้นเป็นจุดๆ เฉพาะ
  // ส่วนที่ต้องใช้ค่าจริงจาก config เท่านั้น
  const active = document.activeElement;
  const fid = active && app.contains(active) ? active.getAttribute('data-fid') : null;
  const selStart = fid && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = fid && 'selectionEnd' in active ? active.selectionEnd : null;

  let body = '';
  if(state.view==='new') body = renderNew();
  else if(state.view==='list') body = renderList();
  else if(state.view==='detail') body = renderDetail();
  else if(state.view==='notif') body = renderNotif();
  // หน้าตั้งค่าเป็นหน้าเดียวที่ "แก้ไข" config ได้ จึงต้องรอ config ตัวจริงจากเซิร์ฟเวอร์ (state.loaded)
  // เท่านั้น ห้ามใช้สำเนาในเครื่องเป็นฐาน ไม่งั้นกดบันทึกแล้วจะเขียนข้อมูลเก่าทับของจริงบนชีต
  else if(state.view==='settings') body = state.role==='admin'
    ? (state.loaded ? renderSettings() : `<div style="padding:60px; text-align:center; color:var(--slate);">กำลังโหลดข้อมูลตั้งค่า...</div>`)
    : renderList();
  const updateBanner = state.updateAvailable ? `
    <div class="update-banner">
      🔄 มีการอัปเดตระบบเวอร์ชันใหม่ — กรุณารีเฟรชหน้าเพื่อใช้งานเวอร์ชันล่าสุด
      <button class="btn btn-primary btn-sm" onclick="location.reload()">รีเฟรชตอนนี้</button>
    </div>` : '';
  app.innerHTML = updateBanner + renderHeader() + `<main>${body}</main>`
    + `<div class="app-version">เวอร์ชัน ${APP_VERSION}</div>`;

  if(fid){
    const restored = app.querySelector(`[data-fid="${fid}"]`);
    if(restored){
      restored.focus();
      if(selStart != null && restored.setSelectionRange){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ============================= LIVE POLLING (near real-time sync) =============================
   เดิมเป็น setInterval(pollForUpdates, 3000) ซึ่งเป็นต้นเหตุหลักที่ทำให้ "เปิดแอปทีนึงรอเป็นนาที":
   หนึ่งรอบยิง 4 คำขอ = 1.33 คำขอ/วินาที ต่อ "หนึ่งแท็บที่เปิดค้าง" และ Web App ที่ deploy แบบ
   Execute as: Me รันทุกคำขอในนามเจ้าของสคริปต์คนเดียว คำขอที่เกินโควตา simultaneous execution
   จึงถูกเข้าคิว พนักงานไม่กี่คนเปิดค้างพร้อมกันก็ทำให้คิวโตเร็วกว่าที่ระบายได้ คนที่เพิ่งเปิดแอป
   ต้องไปต่อท้ายคิวนั้น ซ้ำร้าย setInterval ไม่สนว่ารอบก่อนเสร็จหรือยัง — เกิน 3 วิ ก็ยิงทับซ้อนไปเรื่อยๆ

   ของใหม่แก้สามอย่างพร้อมกัน:
   1) เป็น setTimeout ลูกโซ่ + ธง pollInFlight — รอบใหม่เริ่มได้ก็ต่อเมื่อรอบก่อนจบแล้วเท่านั้น
      ยิงทับซ้อนไม่ได้อีกโดยโครงสร้าง
   2) ถอยห่างอัตโนมัติตามเวลาที่เซิร์ฟเวอร์ใช้จริง — เซิร์ฟเวอร์ตอบช้าแปลว่าคิวกำลังยาว ยิ่งยิงถี่ยิ่ง
      ซ้ำเติม จึงยืดรอบออกเป็น ~4 เท่าของเวลาที่เพิ่งใช้ไป (คุมไว้ระหว่าง 15–90 วิ) พอคิวโล่งก็หดกลับเอง
   3) แท็บที่ถูกซ่อน (สลับแอป/พับจอ) หยุดยิงทั้งหมด — ไม่มีใครดูอยู่ ไม่ต้องแย่งคิวกับคนที่กำลังใช้งานจริง
      พอกลับมาที่แท็บ visibilitychange จะยิงรอบใหม่ให้ทันที ผู้ใช้จึงไม่รู้สึกว่าข้อมูลเก่า */
const POLL_MIN = 15000;
const POLL_MAX = 90000;
let pollDelay = POLL_MIN;
let pollInFlight = false;
function startPolling(){
  const tick = async () => {
    if(!document.hidden && !pollInFlight){
      const t0 = Date.now();
      await pollForUpdates();
      pollDelay = Math.min(POLL_MAX, Math.max(POLL_MIN, (Date.now() - t0) * 4));
    }
    setTimeout(tick, pollDelay);
  };
  setTimeout(tick, pollDelay);
}
async function pollForUpdates(){
  if(pollInFlight) return;
  pollInFlight = true;
  try{
    // lineUsers/lineUserRoles/lineRecipients ใช้แค่หน้าตั้งค่าของ admin — โหลด/poll แค่ตอนเคยเข้าหน้านั้น
    // แล้วเท่านั้น (state.lineDataLoaded) คนอื่นๆ ไม่ต้องยิง 3 คำขอนี้ทุก 3 วิให้เสียเวลาเปล่า
    const lineDataPromise = state.lineDataLoaded
      ? Promise.all([storeGet('lineUsers'), storeGet('lineUserRoles'), storeGet('lineRecipients')])
      : Promise.resolve([null, null, null]);
    const [cfg, orders, notifs, reqs, [lineUsers, lineUserRoles, lineRecipients]] = await Promise.all([
      storeGet('config'), storeGet('orders'), storeGet('notifications'), storeGet('accessRequests'),
      lineDataPromise
    ]);
    let changed = false;
    if(lineUsers && JSON.stringify(lineUsers) !== JSON.stringify(state.lineUsers)){ state.lineUsers = lineUsers; changed = true; }
    if(lineUserRoles && JSON.stringify(lineUserRoles) !== JSON.stringify(state.lineUserRoles)){ state.lineUserRoles = lineUserRoles; changed = true; }
    if(lineRecipients && JSON.stringify(lineRecipients) !== JSON.stringify(state.lineRecipients)){ state.lineRecipients = lineRecipients; changed = true; }
    if(cfg && JSON.stringify(cfg) !== JSON.stringify(state.config)){ state.config = cfg; changed = true; }
    if(orders && JSON.stringify(orders) !== JSON.stringify(state.orders)){ state.orders = orders; changed = true; }
    // ห้ามเอาค่าจากเซิร์ฟเวอร์ทับตรงๆ — Apps Script อ่านหลังเขียนมีดีเลย์ รอบที่วิ่งคาบเกี่ยวกับ
    // pushNotification() ที่ยังค้างรอ LINE อยู่จะได้ค่าเก่ากลับมา แล้วลบแถวที่เพิ่งเพิ่มทิ้ง (ดู mergePendingNotifs)
    if(notifs){
      const mergedNotifs = mergePendingNotifs(notifs);
      if(JSON.stringify(mergedNotifs) !== JSON.stringify(state.notifications)){ state.notifications = mergedNotifs; changed = true; }
    }
    // กันเหนียว: ถ้า loadBackground() พลาดไปด้วยเหตุผลใดก็ตาม รอบ poll ถัดไปที่ได้ orders มาจริง
    // จะปลดล็อกปุ่มบันทึกต่างๆ ให้เองแทน ไม่ต้องรอ refresh หน้า
    if(orders && !state.ordersLoaded) state.ordersLoaded = true;
    // เช่นเดียวกับ config: ถ้า loadEssential() พลาดไป (เน็ตกระตุกตอนเปิดแอป) รอบ poll ที่ได้ config
    // มาจริงจะปลดล็อกหน้าตั้งค่าและรายชื่อแผนกให้เอง ไม่ต้องให้ผู้ใช้รีเฟรชหน้า
    if(cfg && !state.loaded){ state.loaded = true; state.configFromCache = false; changed = true; }
    // คำขอสิทธิ์: ให้ admin เห็นคำขอใหม่สดๆ และถ้าสิทธิ์ของตัวเองถูกแก้/ถอนระหว่างใช้งานก็ปรับตามทันที
    if(reqs && JSON.stringify(reqs) !== JSON.stringify(state.accessRequests)){
      const grantSig = r => r ? `${r.status}|${(r.roles || []).join(',')}|${r.techName || ''}` : '';
      const before = grantSig(state.myRequest);
      state.accessRequests = reqs;
      state.myRequest = requestFor(state.didHash, reqs);
      if(grantSig(state.myRequest) !== before){
        await resolveAccess();   // สิทธิ์อาจยังเหลือจากชีตอยู่ จึงต้องประเมินใหม่ทั้งสองแหล่ง
        // ล้างสำเนาในเครื่องก่อนรีโหลดเสมอ ไม่งั้นรอบหน้าจะวาดหน้าจอจากสิทธิ์เก่าที่เพิ่งถูกถอนไป
        if(state.authStatus !== 'ok'){ clearSnapshot(); location.reload(); return; }
      }
      changed = true;
    }
    if(changed){ render(); saveSnapshot(); }
  }catch(e){ /* silent - next poll retries */ }
  finally{ pollInFlight = false; }
}

/* แท็บที่เปิดค้างไว้นานจะยังรันโค้ด JS เดิมในหน่วยความจำต่อไปเรื่อยๆ แม้ index.html บนเซิร์ฟเวอร์จะอัปเดตแล้ว
   (เช่น ปุ่มกดต่างๆ จะยังส่งแจ้งเตือนแบบไม่มี deep link) จึงต้องดึงไฟล์ล่าสุดมาเทียบเวอร์ชันเป็นระยะ
   แล้วเตือนให้ผู้ใช้รีเฟรชเอง แทนที่จะรีโหลดอัตโนมัติ (จะได้ไม่ขัดจังหวะระหว่างกรอกฟอร์ม) */
async function checkForUpdate(){
  if(state.updateAvailable) return;
  if(document.hidden) return;   // ดึงไฟล์ทั้งไฟล์แบบ no-store — ไม่ต้องเสียเน็ตให้แท็บที่ไม่มีใครดู
  try{
    const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache:'no-store' });
    const text = await res.text();
    const m = text.match(/const APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VERSION){
      state.updateAvailable = true;
      render();
    }
  }catch(e){ /* ignore - next check retries */ }
}

/* ============================= INIT ============================= */
/* รองรับลิงก์ลึกจากการแจ้งเตือน LINE: ?order=<id>&role=<role> เปิดตรงไปที่ใบแจ้งซ่อมนั้น
   และสลับบทบาทให้ตรงกับผู้รับแจ้งเตือน (ถ้าบัญชีนี้มีสิทธิ์บทบาทนั้นจริง)
   ?role=admin&view=settings เปิดตรงไปหน้า "ตั้งค่าข้อมูลหลัก" (ใช้กับลิงก์แจ้งเตือนคำขอสิทธิ์ใหม่ — ดู accessRequestsDeepLink) */
/* อ่านพารามิเตอร์ของลิงก์ "ตั้งแต่ตอนโหลดสคริปต์" แล้วปักหน้าเป้าหมายลง state ทันที — ต้องเกิดก่อน
   render() ครั้งแรกเสมอ
   เดิมโค้ดส่วนนี้อยู่กลาง startApp() ซึ่งกว่าจะได้ทำงานต้องผ่าน resolveAccess() (ยิง Apps Script
   หนึ่งรอบ) มาก่อน ระหว่างนั้นแอปวาดหน้าจอตาม state.view เริ่มต้นคือ 'new' = "ใบคำร้อง/ใบแจ้งซ่อม"
   ผู้ใช้ที่กดลิงก์แจ้งเตือนจากไลน์จึงต้องนั่งดูฟอร์มแจ้งซ่อมเปล่าๆ ที่ไม่เกี่ยวข้องอยู่หลายวินาที
   ก่อนหน้าจอจะกระโดดไปใบที่ตั้งใจเปิด */
const DEEP_LINK = (function(){
  const params = new URLSearchParams(location.search);
  const dl = {
    orderId: params.get('order') || '',
    role:    params.get('role') || '',
    view:    params.get('view') || '',
    search:  '',   // query string ตัวจริง เก็บไว้ใช้ตอนต้องโหลดหน้าใหม่ (ดู init())
  };
  if(dl.orderId || dl.role || dl.view){
    dl.search = location.search;
    // ล้างพารามิเตอร์ออกจากแถบที่อยู่ทันที กันผู้ใช้กดรีเฟรชแล้วถูกลากกลับมาใบเดิมซ้ำๆ
    history.replaceState(null, '', location.pathname);
  }
  return dl;
})();
/* ปักหน้าเป้าหมายลง state ก่อนที่ใครจะเรียก render() ได้ — หน้าแรกที่ผู้ใช้เห็นจึงเป็นใบที่กดมาเลย
   (ระหว่างที่ข้อมูลใบยังไม่มา renderDetail() จะขึ้น "กำลังเปิดใบแจ้งซ่อม…" ให้แทน) */
if(DEEP_LINK.orderId){
  state.view = 'detail';
  state.selectedOrderId = DEEP_LINK.orderId;
} else if(DEEP_LINK.view === 'settings'){
  // ไม่ใช่ admin จะได้หน้ารายการแทนเอง (ดูเงื่อนไขใน render()) ไม่ต้องกันซ้ำตรงนี้
  state.view = 'settings';
}
/* ยิงคำขอ "ขอใบนี้ใบเดียว" ขนานไปกับการเช็คสิทธิ์เลย ไม่รอให้เช็คเสร็จก่อน — เดิมสองคำขอนี้ต่อคิวกัน
   (เช็คสิทธิ์ → ขอใบ) ผู้ใช้จึงต้องรอ Apps Script สองรอบเต็มๆ กว่าจะเห็นใบที่กดมาจากลิงก์
   getOrderById() ดักข้อผิดพลาดไว้เองแล้ว (คืน null) พรอมิสนี้จึงไม่มีทาง reject ทิ้งไว้ */
const deepLinkOrderPromise = DEEP_LINK.orderId ? getOrderById(DEEP_LINK.orderId) : null;

/* เข้าสู่แอปจริง (หลังยืนยันสิทธิ์แล้ว) — แยกออกมาจาก init() เพื่อให้เรียกซ้ำได้ตอนผู้ใช้เพิ่งได้สิทธิ์
   ระหว่างอยู่หน้า "ขอสิทธิ์เข้าใช้งาน" โดยไม่ต้อง location.reload() (ดูเหตุผลใน recheckAccess) */
let appStarted = false;
async function startApp(){
  if(appStarted) return;
  appStarted = true;
  // ไม่ await — doGet('config') ต้องอ่าน 3 แท็บชีตสดๆ จึงเป็นคำขอที่ช้าที่สุด การรอมันก่อนวาดหน้าจอ
  // เท่ากับต่อคลื่นเครือข่ายเข้าไปใน critical path อีกหนึ่งชั้นโดยไม่จำเป็น — ทุกจุดที่ต้องใช้ค่าจริงจาก
  // config เช็ค configReady()/state.loaded เองอยู่แล้ว (ดู renderNew/renderRequestAccess/หน้าตั้งค่า)
  ensureEssentialLoaded().then(render);

  // สลับบทบาทตามลิงก์ "ก่อน" วาดหน้าจอ ไม่ใช่หลัง — หน้าแรกที่ผู้ใช้เห็นจะได้เป็นบทบาทที่ถูกต้อง
  // ตั้งแต่ต้น ไม่กระพริบเปลี่ยนทีหลัง
  if(DEEP_LINK.role && state.allowedRoles.includes(DEEP_LINK.role)){
    state.role = DEEP_LINK.role;
    if(DEEP_LINK.role === 'tech') state.myTechName = state.techIdentities[0] || '';
  }
  render();

  if(DEEP_LINK.orderId){
    // ใช้ผลของคำขอใบเดียวที่ยิงไว้ตั้งแต่ตอนโหลดสคริปต์ ระหว่างที่รายการเต็มยังโหลดอยู่เบื้องหลัง
    // (ปุ่มที่ต้องบันทึกถูกซ่อนไว้จนกว่า loadBackground() จะเสร็จ ดู renderDetail())
    const peeked = await deepLinkOrderPromise;
    if(peeked){
      // รวมเข้ากับรายการที่มีอยู่ (อาจมาจากสำเนาในเครื่อง) แทนที่จะแทนที่ทั้งก้อนด้วยใบเดียว —
      // ใบที่ขอมาสดกว่าเสมอจึงทับของเดิมที่ id เดียวกัน ส่วนใบอื่นๆ ยังอยู่ให้ผู้ใช้กดดูต่อได้ทันที
      const rest = state.orders.filter(o => o.id !== peeked.id);
      state.orders = [peeked, ...rest];
    }
    // เรียกเสมอแม้ขอใบไม่สำเร็จ ไม่ใช่แค่ตอนได้ใบมา — หน้ารายละเอียดจะขึ้น "กำลังเปิดใบแจ้งซ่อม…"
    // รอ loadBackground() มาเติมให้ ดีกว่าปล่อยผู้ใช้ค้างอยู่หน้าอื่นที่เขาไม่ได้กดมา
    // ไม่ await — openDetail() วาดหน้าจอให้ตั้งแต่ก่อน await ตัวแรกอยู่แล้ว ที่เหลือคือรูปแนบซึ่ง
    // ไม่ควรไปกั้น loadBackground() ข้างล่างไว้
    openDetail(DEEP_LINK.orderId);
  }
  loadBackground(); // ไม่ await — โหลดเบื้องหลัง ไม่บล็อกหน้าจอ
  startPolling();
  setInterval(checkForUpdate, 120000);
  // รีเฟรชทันทีเมื่อผู้ใช้กลับมาที่แท็บนี้ (สลับแท็บ/แอปแล้วกลับมา) แทนที่จะรอรอบ poll ถัดไป
  // — สำคัญเป็นพิเศษตอนนี้ เพราะรอบ poll หยุดสนิทระหว่างที่แท็บถูกซ่อน
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ pollDelay = POLL_MIN; pollForUpdates(); } });
}

(async function init(){
  // วาดหน้ารอเป็นอย่างแรกเลย — ระหว่างที่ resolveAccess() ยังไม่กลับมา ไม่มีใครเรียก render() เลย
  // สิ่งที่ค้างอยู่บนจอคือข้อความ static ใน markup ("กำลังตรวจสอบสิทธิ์ผู้ใช้งาน…") ซึ่งไม่บอกอะไร
  // กับคนที่เพิ่งกดลิงก์ใบแจ้งซ่อมมาจากไลน์ — ดูข้อความตามบริบทใน render()
  render();
  // เริ่มจากสำเนาในเครื่องก่อนเสมอ ถ้ามี — วาดหน้าจอได้ทันทีโดยไม่แตะเครือข่ายเลย แล้วค่อยเช็คสิทธิ์
  // และโหลดของสดทับเบื้องหลัง ผู้ใช้จึงไม่ต้องนั่งดู "กำลังตรวจสอบสิทธิ์ผู้ใช้งาน…" ระหว่างรอคิว Apps Script
  state.deviceId = getDeviceId();
  state.didHash = await sha256Hex(state.deviceId);
  const bootedFromCache = applySnapshot(readSnapshot());
  if(bootedFromCache){
    render();
    startApp();   // ไม่ await — ให้การเช็คสิทธิ์ของจริงข้างล่างเดินคู่ขนานไปเลย
  }

  await resolveAccess();   // คำตอบจากเซิร์ฟเวอร์ชนะสำเนาเสมอ
  render();
  if(state.authStatus !== 'ok'){
    // เคยบูตจากสำเนาแล้วแต่เซิร์ฟเวอร์บอกว่าไม่มีสิทธิ์จริง (ถูกถอนสิทธิ์/สำเนาไม่ตรงกับของจริง)
    // — ล้างสำเนาแล้วเริ่มใหม่หมด เพราะตอนนี้แอปเดินมาไกลเกินกว่าจะถอยกลับหน้าขอสิทธิ์อย่างสะอาด
    // โหลดใหม่พร้อมพารามิเตอร์เดิม ไม่ใช่ location.reload() — ตอนนี้แถบที่อยู่ถูกล้างไปแล้ว
    // (ดู DEEP_LINK) reload เฉยๆ จะพาผู้ใช้ไปโผล่หน้าแรกแทนใบที่เขากดมาจากไลน์
    if(bootedFromCache){ clearSnapshot(); location.replace(location.pathname + DEEP_LINK.search); return; }
    // หน้า "ขอสิทธิ์เข้าใช้งาน" ใช้ config (แผนก/ชื่อช่าง) ในดรอปดาวน์ — โหลดเบื้องหลังไม่บล็อกฟอร์ม
    // (เดิมหน้านี้ไม่เคยโหลด config เลย เลยโชว์รายชื่อ default ที่ฝังไว้ในโค้ด ไม่ใช่ของจริงจากชีต)
    ensureEssentialLoaded().then(render);
    // ยังไม่มีสิทธิ์ — คอยเช็คให้เอง พอผู้ดูแลกดอนุมัติแล้วหน้านี้จะเข้าระบบทันทีโดยผู้ใช้ไม่ต้องกดอะไร
    setInterval(recheckAccess, 7000);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) recheckAccess(); });
    return;
  }
  await startApp();
})();
</script>
</body>

   ตั้งแต่แรก ไม่ใช่รอให้ผู้ใช้กดลิงก์สำรองเอง */
function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /\bLine\//i.test(ua) || /\bIAB\b/i.test(ua) || /FBAN|FBAV|FB_IAB/i.test(ua)
      || /Instagram/i.test(ua) || /MicroMessenger/i.test(ua) || /;\s*wv\)/i.test(ua);
}
/* input[capture] เปิดกล้องได้จริงเฉพาะเบราว์เซอร์เต็มตัวบนมือถือ (Chrome บน Android,
   Safari บน iOS) — ที่นั่นให้ใช้ทางนี้ก่อน เพราะได้แอปกล้องเต็มระบบ คุณภาพดีกว่า
   ที่เหลือ capture ไม่เปิดกล้องให้เลย แล้วยังเงียบด้วย:
   - คอมพิวเตอร์: เบราว์เซอร์เดสก์ท็อปไม่สนใจ capture เด้งหน้าต่างเลือกไฟล์ทุกครั้ง
   - เบราว์เซอร์ที่ฝังอยู่ในแอปอื่น (LINE ฯลฯ) บน Android: ไม่ยิง intent กล้อง
     แต่เด้งเข้าตัวเลือกรูปของ Android แทน — คือ "กดถ่ายภาพแล้วเข้าหน้าอัลบั้ม" ที่แจ้งกันมา */
function captureInputOpensCamera(){
  return isMobileDevice() && !isInAppBrowser();
}
function preferInAppCamera(){ return !captureInputOpensCamera(); }
async function startCamStream(){
  const video = document.getElementById('camVideo');
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  // ขอความละเอียดสูงไว้ก่อน (ideal ไม่ใช่ exact — กล้องที่ให้ไม่ได้จะคืนขนาดที่ทำได้แทน
  // ไม่ throw) ค่า default ของ getUserMedia คือ 640x480 ซึ่งอ่านป้ายเครื่องจักรไม่ออก
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal: camFacing }, width:{ ideal:1920 }, height:{ ideal:1080 } },
      audio:false
    });
  }catch(e){
    // ถูกปฏิเสธสิทธิ์ = ขอใหม่ยังไงก็ไม่ผ่าน ส่งต่อเลย ที่เหลือ (OverconstrainedError,
    // NotReadableError, WebView เก่าที่ไม่รับ constraint ซ้อน) ลองขอแบบเปล่าอีกครั้งก่อน
    if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e;
    console.error(e);
    camStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
  }
  video.srcObject = camStream;
  try{ await video.play(); }catch(e){ /* บาง WebView เล่นเองอยู่แล้ว */ }
}
/* คืน true เมื่อเปิดกล้องในแอปได้จริง — ผู้เรียกจะได้รู้ว่าต้องตกไปทางสำรองหรือไม่
   quiet = เรียกแบบอัตโนมัติ ถ้าไม่สำเร็จให้เงียบไว้แล้วปล่อยให้ผู้เรียกจัดการต่อ */
async function openInAppCamera(target, opts){
  const quiet = !!(opts && opts.quiet);
  if(photoBucketFull(target)) return true;
  if(!inAppCameraSupported()){
    state.ui.camErr = navigator.mediaDevices ? 'NoGetUserMedia' : 'NoMediaDevices';
    if(!quiet) toast('เบราว์เซอร์นี้ไม่รองรับกล้องในแอป กรุณาเปิดลิงก์ใน Chrome แล้วลองใหม่', true);
    return false;
  }
  camTarget = target;
  camFacing = 'environment';
  try{
    await startCamStream();
  }catch(e){
    console.error(e);
    state.ui.camErr = (e && e.name) || 'CameraError';
    if(!quiet){
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      toast(denied
        ? 'ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตกล้องให้เบราว์เซอร์ หรือเปิดลิงก์ใน Chrome'
        : 'เปิดกล้องไม่สำเร็จ กรุณาเปิดลิงก์ใน Chrome แล้วลองใหม่', true);
    }
    closeInAppCamera();
    return false;
  }
  state.ui.camBlocked = false;
  state.ui.camErr = '';
  document.getElementById('camOverlay').classList.add('open');
  updateCamFlipVisibility();
  return true;
}
/* เครื่องคอมส่วนใหญ่มีกล้องตัวเดียว ปุ่ม "สลับกล้อง" กดแล้วไม่มีอะไรเกิดขึ้น จึงซ่อนไว้
   ซ่อนเฉพาะตอนที่นับกล้องได้จริงว่ามีตัวเดียว ถ้าอ่านรายชื่ออุปกรณ์ไม่ได้ให้แสดงไว้ตามเดิม
   (ใช้ visibility ไม่ใช่ display เพื่อให้ปุ่มชัตเตอร์ยังอยู่กลางแถบเหมือนเดิม) */
async function updateCamFlipVisibility(){
  const btn = document.getElementById('camFlip');
  if(!btn) return;
  btn.style.visibility = 'visible';
  if(!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)) return;
  try{
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    if(cams.length <= 1) btn.style.visibility = 'hidden';
  }catch(e){ /* อ่านรายชื่ออุปกรณ์ไม่ได้ ก็ปล่อยให้ปุ่มแสดงไว้ */ }
}
/* ปุ่ม "ถ่ายภาพ" — ห้ามจบลงที่ตัวเลือกไฟล์/อัลบั้มโดยไม่บอกอะไรเลย ไม่ว่าบนเครื่องไหน
   เครื่องที่ capture ใช้ได้: ส่งไป input capture ตามเดิม
   ที่เหลือ: กล้องในแอป ถ้าเปิดไม่ได้ให้หยุดแล้วขึ้นกล่องบอกวิธี ไม่ตกไปเปิดอัลบั้มเงียบๆ */
async function takePhoto(target, inputId){
  if(captureInputOpensCamera()){ openPhotoPicker(inputId); return; }
  if(await openInAppCamera(target, { quiet:true })) return;
  state.ui.camBlocked = true;
  render();
  toast('เปิดกล้องไม่สำเร็จ — ดูวิธีถ่ายรูปได้ใต้ปุ่มถ่ายภาพ', true);
}
/* ลิงก์ "เปิดในเบราว์เซอร์ของเครื่อง" — เป็นทางเดียวที่เหลือเมื่อ WebView ของแอปไม่ให้ทั้ง
   getUserMedia และ intent กล้อง
   LINE: ต่อ openExternalBrowser=1 แล้ว LINE จะส่งลิงก์ออกไปเปิดที่เบราว์เซอร์ของเครื่องให้
   WebView อื่นบน Android: intent:// ระบุ package ของ Chrome
   ใช้กับ <a target="_blank"> เท่านั้น ไม่ใช่ location.href — ถ้าเครื่องไหนไม่รองรับ หน้าเดิม
   พร้อมข้อความที่พิมพ์ค้างไว้จะได้ไม่ถูกโหลดทับ (ฟอร์มนี้ไม่ได้เก็บ draft ไว้ที่ไหน) */
function externalBrowserUrl(){
  const href = location.href.split('#')[0];
  if(/\bLine\//i.test(navigator.userAgent || '')){
    return href + (href.indexOf('?') >= 0 ? '&' : '?') + 'openExternalBrowser=1';
  }
  if(isAndroid()) return 'intent://' + href.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
  return href;
}
/* กล่องบอกทางออกเมื่อกล้องถูกบล็อก — มีทั้งลิงก์เปิดเบราว์เซอร์จริง ปุ่มลองกล้องของเครื่อง
   อีกรอบ (บางเครื่อง capture ใช้ได้) และวิธีที่ได้ผลเสมอคือถ่ายไว้ก่อนแล้วแนบจากอัลบั้ม */
function camBlockedPanel(target, inputId){
  const code = state.ui.camErr ? ` <span class="cam-blocked-code">(${escapeHtml(state.ui.camErr)})</span>` : '';
  if(!isMobileDevice()){
    return `<div class="cam-blocked">
      <b>เปิดกล้องของเครื่องไม่สำเร็จ</b>${code}<br>
      ถ้าเบราว์เซอร์ขึ้นถามขออนุญาตใช้กล้อง ให้กด "อนุญาต" — ถ้าเคยกดปฏิเสธไว้ ให้กดไอคอนรูปกล้องหรือแม่กุญแจข้างช่องที่อยู่เว็บ แล้วเปิดสิทธิ์กล้องให้หน้านี้ จากนั้นกดถ่ายภาพอีกครั้ง
      <div class="cam-blocked-actions">
        <button type="button" onclick="takePhoto('${target}','${inputId}')">ลองเปิดกล้องอีกครั้ง</button>
        <button type="button" onclick="openPhotoPicker('${inputId}')">เลือกไฟล์รูปจากเครื่อง</button>
      </div>
    </div>`;
  }
  return `<div class="cam-blocked">
    <b>เบราว์เซอร์ที่เปิดหน้านี้อยู่ไม่ยอมให้ใช้กล้อง</b>${code}<br>
    ถ้ากดถ่ายภาพแล้วเด้งเข้าอัลบั้ม แปลว่าเป็นเบราว์เซอร์ในแอป (เช่นของ LINE) เปิดหน้านี้ในเบราว์เซอร์ของเครื่อง (Chrome) แล้วถ่ายได้ตามปกติ
    <div class="cam-blocked-actions">
      <a href="${escapeHtml(externalBrowserUrl())}" target="_blank" rel="noopener">เปิดหน้านี้ในเบราว์เซอร์</a>
      <button type="button" onclick="openPhotoPicker('${inputId}')">ลองเปิดกล้องของเครื่อง</button>
    </div>
    <div class="cam-blocked-tip">หรือใช้แอปกล้องของเครื่องถ่ายไว้ก่อน แล้วกด "เลือกจากอัลบั้ม" เพื่อแนบรูปที่ถ่ายไว้</div>
  </div>`;
}
async function flipInAppCamera(){
  camFacing = camFacing === 'environment' ? 'user' : 'environment';
  try{ await startCamStream(); }
  catch(e){ console.error(e); toast('สลับกล้องไม่สำเร็จ', true); }
}
/* ============================= LIGHTBOX (ดูรูปเต็มจอ) ============================= */
/* กดรูปในใบแจ้งซ่อม/รูปที่แนบไว้แล้วเปิดดูเต็มจอ เลื่อนดูรูปถัดไป และแตะซ้ำเพื่อซูมขนาดจริง
   ตัว overlay อยู่นอก #app เพราะ render() เขียนทับ innerHTML ทั้งก้อนทุกครั้ง */
let lbList = [];           // รายการรูปของชุดที่กำลังเปิดดู (copy ไว้ กัน state เปลี่ยนกลางคัน)
let lbIndex = 0;
let lbTouch = null;        // จุดเริ่มนิ้วสำหรับปัดเปลี่ยนรูป
let lbSwallowClick = false;// ปัดจบแล้ว browser ยิง click ตาม — กันไม่ให้ไปสั่งซูม

function lightboxBucket(source){
  if(source === 'form') return state.form.photos;
  if(source === 'resubmit') return state.ui.resubmitPhotos;
  return state.detailPhotos;
}
function openLightbox(index, source){
  const list = (lightboxBucket(source) || []).filter(Boolean);
  if(!list.length) return;
  lbList = list.slice();
  lbIndex = Math.min(Math.max(parseInt(index, 10) || 0, 0), lbList.length - 1);
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';   // กันหน้าเบื้องหลังเลื่อนตามนิ้ว
  paintLightbox();
}
function paintLightbox(){
  const many = lbList.length > 1;
  setLightboxZoom(false);
  document.getElementById('lbImage').src = lbList[lbIndex] || '';
  document.getElementById('lbCounter').textContent = many ? `${lbIndex + 1} / ${lbList.length}` : '';
  document.getElementById('lbPrev').style.display = many ? 'block' : 'none';
  document.getElementById('lbNext').style.display = many ? 'block' : 'none';
  document.getElementById('lbHint').textContent = many
    ? 'แตะรูปเพื่อซูม • ปัดซ้าย-ขวาเพื่อดูรูปอื่น • แตะพื้นที่ว่างเพื่อปิด'
    : 'แตะรูปเพื่อซูม • แตะพื้นที่ว่างเพื่อปิด';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  setLightboxZoom(false);
  document.getElementById('lbImage').src = '';   // ปล่อยรูป base64 ก้อนใหญ่ทิ้ง ไม่ค้างในหน่วยความจำ
  document.body.style.overflow = '';
  lbList = []; lbIndex = 0; lbTouch = null;
}
function lightboxOpen(){
  return document.getElementById('lightbox').classList.contains('open');
}
function stepLightbox(dir, e){
  if(e) e.stopPropagation();
  if(lbList.length < 2) return;
  lbIndex = (lbIndex + dir + lbList.length) % lbList.length;
  paintLightbox();
}
function setLightboxZoom(on){
  const stage = document.getElementById('lbStage');
  stage.classList.toggle('zoom', !!on);
  if(!on){ stage.scrollTop = 0; stage.scrollLeft = 0; }
}
function toggleLightboxZoom(e){
  e.stopPropagation();
  if(lbSwallowClick){ lbSwallowClick = false; return; }
  const stage = document.getElementById('lbStage');
  const zoomOn = !stage.classList.contains('zoom');
  setLightboxZoom(zoomOn);
  if(zoomOn){
    // ขยายแล้วให้เริ่มมองที่กลางรูป ไม่ใช่มุมซ้ายบน
    const img = document.getElementById('lbImage');
    stage.scrollLeft = Math.max(0, (img.offsetWidth  - stage.clientWidth)  / 2);
    stage.scrollTop  = Math.max(0, (img.offsetHeight - stage.clientHeight) / 2);
  }
}
function onLightboxStageClick(e){
  if(e.target.id === 'lbStage') closeLightbox();   // แตะพื้นที่ว่างรอบรูป = ปิด
}
function onLightboxTouchStart(e){
  lbSwallowClick = false;
  if(e.touches.length !== 1 || document.getElementById('lbStage').classList.contains('zoom')){ lbTouch = null; return; }
  lbTouch = { x:e.touches[0].clientX, y:e.touches[0].clientY };
}
function onLightboxTouchEnd(e){
  if(!lbTouch) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - lbTouch.x, dy = t.clientY - lbTouch.y;
  lbTouch = null;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){
    lbSwallowClick = true;
    stepLightbox(dx < 0 ? 1 : -1);
  }
}
/* บนคอม — Esc ปิด, ลูกศรซ้าย/ขวาเปลี่ยนรูป */
document.addEventListener('keydown', e => {
  if(!lightboxOpen()) return;
  if(e.key === 'Escape'){ closeLightbox(); }
  else if(e.key === 'ArrowLeft'){ stepLightbox(-1); }
  else if(e.key === 'ArrowRight'){ stepLightbox(1); }
});

/* บนคอมมีคีย์บอร์ด — ให้ Esc ปิดกล้องได้เหมือน overlay ทั่วไป */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && camStream) closeInAppCamera();
});
function closeInAppCamera(){
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const video = document.getElementById('camVideo');
  if(video) video.srcObject = null;
  document.getElementById('camOverlay').classList.remove('open');
  camTarget = null;
}
function shootInAppCamera(){
  const video = document.getElementById('camVideo');
  const target = camTarget;
  const w0 = video.videoWidth, h0 = video.videoHeight;
  if(!w0 || !h0){ toast('กล้องยังไม่พร้อม กรุณารอสักครู่แล้วลองใหม่', true); return; }
  if(photoBucketFull(target)){ closeInAppCamera(); return; }
  const scale = Math.min(1, 900 / w0);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w0 * scale); canvas.height = Math.round(h0 * scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  photoBucket(target).push(canvas.toDataURL('image/jpeg', 0.6));
  closeInAppCamera();
  toast('เพิ่มรูปแล้ว');
  render();
}
/* ลิงก์สลับไปใช้อีกวิธีหนึ่ง — ข้อความกลับด้านตามว่าปุ่มถ่ายภาพเลือกทางไหนเป็นทางหลัก
   บนเครื่องนั้น เพื่อให้ทางที่เหลือกดถึงได้เสมอด้วยการแตะครั้งเดียว */
function photoFallbackHint(target, inputId){
  if(state.ui.camBlocked) return camBlockedPanel(target, inputId);
  if(preferInAppCamera()){
    // บนคอม ปุ่มนี้เปิดหน้าต่างเลือกไฟล์ ไม่ใช่กล้อง จึงต้องเรียกให้ตรงกับที่เห็นจริง
    const hint = isMobileDevice()
      ? { lead:'อยากใช้แอปกล้องของเครื่องแทน?', label:'เปิดกล้องของเครื่อง' }
      : { lead:'อยากใช้รูปที่มีอยู่แล้ว?', label:'เลือกไฟล์รูปจากเครื่อง' };
    return `<div class="photo-fallback">${hint.lead} <button type="button" onclick="openPhotoPicker('${inputId}')">${hint.label}</button></div>`;
  }
  return `<div class="photo-fallback">กดถ่ายภาพแล้วกล้องไม่ขึ้น? <button type="button" onclick="openInAppCamera('${target}')">ใช้กล้องในแอป</button></div>`;
}
async function handlePhotoInput(input){
  const files = takeFilesFromInput(input);
  if(!files.length) return;
  const remaining = 5 - state.form.photos.length;
  if(remaining <= 0){ toast('แนบรูปได้สูงสุด 5 รูปต่อใบแจ้งซ่อม', true); return; }
  const added = await collectPhotos(files, remaining);
  state.form.photos.push(...added);
  render();
}

async function submitOrder(){
  const f = state.form;
  if(!state.ordersLoaded){ toast('กำลังโหลดข้อมูลระบบ กรุณารอสักครู่แล้วลองใหม่', true); return; }
  if(!f.dept){ toast('กรุณาเลือกแผนก', true); return; }
  if(!f.docType){ toast('กรุณาเลือกประเภทเอกสาร', true); return; }
  if(!f.machineCode){ toast('กรุณาเลือกรหัสเครื่องจักร', true); return; }
  if(!f.cause || !f.cause.trim()){ toast('กรุณาระบุอาการ/สาเหตุที่ต้องการแจ้งซ่อม', true); return; }
  if(!f.neededDate){ toast('กรุณาระบุวันที่ต้องการใช้งาน', true); return; }
  if(!f.requestedBy || !f.requestedBy.trim()){ toast('กรุณาระบุชื่อผู้แจ้ง', true); return; }

  // re-fetch counters right before incrementing to reduce race window
  const freshCounters = await storeGet('counters');
  const counters = freshCounters || state.counters;
  const yy = yyNow();
  const deptCounters = { ...(counters[f.dept] || {}) };
  const next = (deptCounters[yy] || 0) + 1;
  deptCounters[yy] = next;
  const newCounters = { ...counters, [f.dept]: deptCounters };
  const docNumber = f.dept + String(next).padStart(3,'0') + '/' + yy;

  const id = uid();
  const order = {
    id, docNumber, department: f.dept, docType: f.docType, machineCode: f.machineCode, machineName: f.machineName,
    cause: f.cause.trim(), neededDate: f.neededDate, urgent: !!f.urgent, requestedBy: f.requestedBy.trim(),
    // ตัวตนของ "คนที่กดส่งใบนี้" — ใช้ยิงแจ้งเตือนกลับหาเจ้าของใบคนเดียว ไม่ใช่ผู้แจ้งซ่อมทุกคน
    // (ช่องชื่อผู้แจ้งแก้เป็นชื่อคนอื่นได้ เช่นแจ้งแทนเพื่อน จึงเก็บทั้งรหัสเครื่องและ LINE ที่ผูกไว้)
    requesterDidHash: state.didHash || '',
    requesterLineUserId: (state.myRequest && state.myRequest.status === 'approved' && state.myRequest.lineUserId) || '',
    createdAt: nowIso(), status: 'PENDING_FM', photoCount: f.photos.length,
    approvals: { fm:{status:null,by:'',at:'',note:''}, gm:{status:null,by:'',at:'',note:''} },
    assignment: { technicians:[], assignedBy:'', assignedAt:'', startDate:'', endDate:'', executionPlan:'', receivedByName:'' },
    maintRecord: null,
    // ความคืบหน้าตามแนวทางที่ช่างผู้ตรวจสอบเลือกไว้ — { opinion, steps:{ <stepKey>:{date,note,by,at} } }
    // ใบเก่าที่ไม่มีคีย์นี้อ่านผ่าน opinionProgressOf() ได้ตามปกติ (คืนอ็อบเจกต์ว่าง)
    opinionProgress: null,
    verification: null,
    verificationHistory: [],
    statusHistory: [{ status:'PENDING_FM', at: nowIso(), note:'สร้างใบแจ้งซ่อม โดย ' + f.requestedBy.trim() + (f.urgent ? ' (ต้องการด่วน)' : '') }],
  };
  const newOrders = [order, ...state.orders];

  // เขียน "orders" ก่อน — นี่คือข้อมูลตัวจริงของใบแจ้งซ่อม ต้องสำเร็จก่อนถึงจะถือว่าส่งคำร้องได้จริง
  // ห้ามอัปเดต state.orders/แสดงข้อความสำเร็จถ้า storeSet ล้มเหลว (เช่น deploy สิทธิ์ผิด, เน็ตหลุด)
  // มิฉะนั้นผู้ใช้จะเห็นว่า "ส่งเรียบร้อย" ทั้งที่ข้อมูลไม่เข้าชีตจริง
  const ordersOk = await storeSet('orders', newOrders);
  if(!ordersOk){
    toast('ส่งใบแจ้งซ่อมไม่สำเร็จ (เชื่อมต่อฐานข้อมูลไม่ได้) กรุณาลองใหม่อีกครั้ง', true);
    return;
  }
  state.orders = newOrders;
  state.counters = newCounters;
  storeSet('counters', newCounters); // best-effort, ไม่บล็อกเพราะใบแจ้งซ่อมถูกบันทึกแล้ว
  if(f.photos.length){
    const photosOk = await storeSet('photos:'+id, f.photos);
    if(!photosOk) toast('บันทึกรูปภาพแนบไม่สำเร็จ แต่ใบแจ้งซ่อมถูกบันทึกแล้ว', true);
  }

  await pushNotification('fm', id, docNumber, `${f.urgent ? '🚨 [ด่วน] ' : ''}มีใบแจ้งซ่อมใหม่จากแผนก ${f.dept} รอการอนุมัติของท่าน`);

  state.form = emptyForm();
  applyMyNameToForm();
  toast(`ส่งใบแจ้งซ่อมเรียบร้อย เลขที่เอกสาร ${docNumber}`);
  state.view = 'list';
  render();
}

function filteredMachines(){
  const dept = state.form.dept;
  if(!dept) return [];
  const q = (state.form.machineSearch||'').trim().toLowerCase();
  return state.config.machines.filter(m => m.dept === dept &&
    (!q || m.code.toLowerCase().includes(q) || m.name.toLowerCase().includes(q)));
}

async function openDetail(id){
  state.selectedOrderId = id;
  state.view = 'detail';
  state.ui.actionFor = null; state.ui.actionType = null; state.ui.actionNote='';
  state.ui.editNeededFor = null; state.ui.editNeededDate = ''; state.ui.editNeededUrgent = false;
  state.detailPhotos = [];   // ล้างรูปของใบก่อนหน้าก่อนเสมอ ไม่งั้นจะค้างโผล่บนใบใหม่ชั่วครู่
  // mark related notifications read for current role (admin: all roles' notifications for this order)
  // ทำเครื่องหมาย "อ่านแล้ว" ในหน่วยความจำก่อน เพื่อให้ตัวเลขบนกระดิ่งลดทันทีที่กด
  let changed = false;
  state.notifications.forEach(n => { if(n.orderId === id && !n.read && notifIsMine(n)){ n.read = true; changed = true; } });
  // วาดหน้ารายละเอียด "ทันทีที่รู้ว่าจะเปิดใบไหน" แล้วค่อยเติมรูปแนบตามมาทีหลัง — เดิม render() อยู่
  // หลัง await storeGet('photos:') จึงต้องรอคิว Apps Script อีกหนึ่งรอบก่อนหน้าจอจะยอมเปลี่ยน
  // ซึ่งบนเส้นทาง "กดลิงก์จากไลน์" คือรอบที่สามต่อกัน (เช็คสิทธิ์ → ขอใบ → ขอรูป) ผู้ใช้จึงค้างอยู่
  // หน้าที่ไม่เกี่ยวข้องหลายวินาทีกว่าจะถึงใบที่ตั้งใจเปิด
  render();
  // เดิมบรรทัดนี้เป็น storeSet('notifications', state.notifications) แบบยิงทิ้ง — เอาอาร์เรย์ใน
  // หน่วยความจำ (ซึ่งอาจเก่ากว่าของบนเซิร์ฟเวอร์อยู่หลายแถว) ทับทั้งก้อนทุกครั้งที่มีคนเปิดใบ
  // แค่ "เปิดดูใบ" จึงลบแจ้งเตือนของคนอื่นทิ้งได้ และมันเกิดบ่อยที่สุดในระบบ
  if(changed) saveNotifications(list => {
    list.forEach(n => { if(n.orderId === id && !n.read && notifIsMine(n)) n.read = true; });
    return list;
  });
  const photos = await storeGet('photos:'+id);
  // ผู้ใช้อาจกดออกจากใบนี้ไปแล้วระหว่างรอ — อย่าเอารูปของใบเก่าไปแปะทับหน้าที่กำลังดูอยู่
  if(state.selectedOrderId !== id || state.view !== 'detail') return;
  state.detailPhotos = photos || [];
  if(state.detailPhotos.length) render();
}

/* admin แก้ไข "วันที่ต้องการใช้งาน" และธง "ต้องการด่วน" ของใบที่ส่งไปแล้วได้
   (ผู้แจ้งกรอกวันผิด หรือความเร่งด่วนเปลี่ยนหลังส่ง — เดิมต้องยกเลิกใบแล้วแจ้งใหม่ทั้งใบ
   ซึ่งกินเลขที่เอกสารเพิ่มอีกใบและทำให้ประวัติการอนุมัติที่ทำไปแล้วหายไปทั้งหมด)
   ทุกครั้งที่แก้จะถูกบันทึกลง statusHistory โดยไม่เปลี่ยนสถานะใบ เพื่อให้ตามรอยได้ว่าแก้อะไรเมื่อไหร่ */
function openEditNeededDate(id){
  const o = getOrder(id); if(!o) return;
  state.ui.editNeededFor = id;
  state.ui.editNeededDate = o.neededDate || '';
  state.ui.editNeededUrgent = !!o.urgent;
  render();
}
function cancelEditNeededDate(){
  state.ui.editNeededFor = null; state.ui.editNeededDate = ''; state.ui.editNeededUrgent = false;
  render();
}
async function saveNeededDate(id){
  const o = getOrder(id); if(!o) return;
  if(state.role !== 'admin'){ toast('เฉพาะผู้ดูแลระบบเท่านั้นที่แก้ไขข้อมูลนี้ได้', true); return; }
  if(!state.ordersLoaded){ toast('กำลังโหลดข้อมูลระบบ กรุณารอสักครู่แล้วลองใหม่', true); return; }
  const newDate = state.ui.editNeededDate;
  if(!newDate){ toast('กรุณาระบุวันที่ต้องการใช้งาน', true); return; }
  const newUrgent = !!state.ui.editNeededUrgent;
  const oldDate = o.neededDate || '';
  const oldUrgent = !!o.urgent;
  if(newDate === oldDate && newUrgent === oldUrgent){ cancelEditNeededDate(); return; }

  const changes = [];
  if(newDate !== oldDate) changes.push(`วันที่ต้องการใช้งาน ${oldDate ? fmtDate(oldDate) : '—'} → ${fmtDate(newDate)}`);
  if(newUrgent !== oldUrgent) changes.push(newUrgent ? 'ตั้งเป็น "ต้องการด่วน"' : 'ยกเลิก "ต้องการด่วน"');
  const note = 'ผู้ดูแลระบบแก้ไข: ' + changes.join(' • ');

  o.neededDate = newDate;
  o.urgent = newUrgent;
  o.statusHistory.push({ status: o.status, at: nowIso(), note });

  const ok = await persistOrders();
  if(!ok){
    // เขียนกลับเซิร์ฟเวอร์ไม่สำเร็จ — คืนค่าเดิมใน state ทันที ห้ามปล่อยให้หน้าจอโชว์ค่าที่ยังไม่เข้าฐานข้อมูลจริง
    o.neededDate = oldDate; o.urgent = oldUrgent; o.statusHistory.pop();
    toast('บันทึกการแก้ไขไม่สำเร็จ (เชื่อมต่อฐานข้อมูลไม่ได้) กรุณาลองใหม่อีกครั้ง', true);
    render();
    return;
  }
  await notifyOrderRequester(o, note);
  toast('บันทึกการแก้ไขแล้ว');
  cancelEditNeededDate();
}

async function handleResubmitPhotoInput(input){

// อิงจากสถานะใบแจ้งซ่อม (ไม่ใช่ state.role ตรงๆ) เพื่อให้ admin ซึ่งผ่าน hasRole() ได้ทุกบทบาท
// พร้อมกัน ยังคงรันฟังก์ชันที่ถูกต้องตรงกับกล่องการทำงานที่กำลังเปิดอยู่จริง
function confirmAction(id){
  const o = getOrder(id); if(!o) return;
  const type = state.ui.actionType;
  const note = state.ui.actionNote.trim();
  if(type !== 'approve' && type !== 'verify_pass' && !note){ toast('กรุณาระบุหมายเหตุ', true); return; }
  if(o.status === 'PENDING_FM'){
    if(type==='approve') approveFm(id, note);
    else if(type==='reject') rejectFm(id, note);
    else if(type==='needinfo') needInfoFm(id, note);
  } else if(o.status === 'PENDING_GM'){
    if(type==='approve') approveGm(id, note);
    else if(type==='reject') rejectGm(id, note);
    else if(type==='needinfo') needInfoGm(id, note);
  } else if((o.status === 'NEEDS_INFO_FM' || o.status === 'NEEDS_INFO_GM') && type === 'resubmit'){
    resubmitInfo(id, note);
  } else if(o.status === 'PENDING_VERIFY' && (type === 'verify_pass' || type === 'verify_fail')){
    verifyRepair(id, type, note);
  }
}
async function approveFm(id, note){
  const o = getOrder(id); if(!o) return;
  const n = (note||'').trim();
  o.approvals.fm = { status:'approved', by: ROLES.fm.label, at: nowIso(), note: n };
  o.status = 'PENDING_GM';
  o.statusHistory.push({ status:'PENDING_GM', at: nowIso(), note:'ผู้จัดการโรงงานอนุมัติแล้ว' + (n ? ' — หมายเหตุ: ' + n : '') });

  await pushNotification('gm', id, o.docNumber, `ใบแจ้งซ่อมแผนก ${o.department} ผ่านการอนุมัติของผู้จัดการโรงงานแล้ว รอการอนุมัติของท่าน`);
  // ผู้แจ้งซ่อมต้องรู้ความคืบหน้าของใบตัวเองทุกขั้น ไม่ใช่รู้เฉพาะตอนถูกปฏิเสธ

  toast('อนุมัติแล้ว ส่งต่อให้ผู้จัดการทั่วไป');
  closeActionBox();
}

async function resubmitInfo(id, note){
  const o = getOrder(id); if(!o) return;
  const msg = (note||'').trim();
  const newPhotos = state.ui.resubmitPhotos || [];
  const backTo = o.status === 'NEEDS_INFO_FM' ? 'PENDING_FM' : 'PENDING_GM';
  o.status = backTo;
  o.statusHistory.push({ status: backTo, at: nowIso(), note:'ผู้แจ้งซ่อมส่งข้อมูลเพิ่มเติม: ' + msg + (newPhotos.length ? ` (แนบรูปเพิ่ม ${newPhotos.length} รูป)` : '') });
  if(newPhotos.length){
    const existing = (await storeGet('photos:'+id)) || [];
    const merged = existing.concat(newPhotos);
    await storeSet('photos:'+id, merged);
    o.photoCount = merged.length;
    if(state.selectedOrderId === id) state.detailPhotos = merged;
  }
  await persistOrders();
  await pushNotification(backTo==='PENDING_FM' ? 'fm' : 'gm', id, o.docNumber, `ผู้แจ้งซ่อมส่งข้อมูลเพิ่มเติมสำหรับใบแจ้งซ่อมแผนก ${o.department} แล้ว กรุณาตรวจสอบอีกครั้ง`);
  toast('ส่งข้อมูลเพิ่มเติมแล้ว รอการอนุมัติอีกครั้ง');
  closeActionBox();
}

async function assignTechnician(id){
  const o = getOrder(id); if(!o) return;
  const techs = [...new Set(state.ui.assignTechs.filter(Boolean))];
  const startDate = state.ui.assignStartDate;
  const endDate = state.ui.assignEndDate;
  const receivedBy = (state.ui.assignReceivedBy||'').trim();
  const executionPlan = state.ui.assignExecutionPlan;
  if(!receivedBy){ toast('กรุณาระบุชื่อผู้จัดการที่รับใบแจ้งซ่อม', true); return; }
  if(!startDate || !endDate){ toast('กรุณากำหนดวันเริ่มงานและวันที่คาดว่าจะเสร็จก่อนมอบหมายงาน', true); return; }
  if(endDate < startDate){ toast('วันที่คาดว่าจะเสร็จต้องไม่ก่อนวันเริ่มงาน', true); return; }
  if(!techs.length){ toast('กรุณาเลือกชื่อช่างผู้รับผิดชอบอย่างน้อย 1 คน', true); return; }
  if(!executionPlan){ toast('กรุณาเลือกการดำเนินงาน', true); return; }
  o.assignment = { technicians: techs, assignedBy: ROLES.maint.label, assignedAt: nowIso(), startDate, endDate, executionPlan, receivedByName: receivedBy };
  o.status = 'ASSIGNED';
  o.statusHistory.push({ status:'ASSIGNED', at: nowIso(), note:`รับใบแจ้งซ่อมโดย ${receivedBy} — มอบหมายงานให้ ${techs.join(', ')} (กำหนดงาน ${fmtDate(startDate)} - ${fmtDate(endDate)}) — การดำเนินงาน: ${EXECUTION_PLAN_META[executionPlan]}` });
  await persistOrders();
  await notifyOrderRequester(o, `งานซ่อมของท่านถูกมอบหมายให้ ${techs.join(', ')} แล้ว สถานะ: รอดำเนินการ`);
  for(const tech of techs){
    await notifyTech(o, tech,
      `คุณได้รับมอบหมายงานซ่อม (${o.machineCode} — ${o.machineName}) กำหนดงาน ${fmtDate(startDate)} - ${fmtDate(endDate)}`,
      `[${o.docNumber}] คุณได้รับมอบหมายงานซ่อม\nแผนก: ${o.department}\nเครื่องจักร: ${o.machineCode} — ${o.machineName}\nอาการ/รายละเอียด: ${o.cause}\nกำหนดงาน: ${fmtDate(startDate)} - ${fmtDate(endDate)}\n${orderDeepLink(o.id, 'tech')}`);
  }
  state.ui.assignTechs = [''];
  state.ui.assignStartDate = '';
  state.ui.assignEndDate = '';
  state.ui.assignReceivedBy = '';
  state.ui.assignExecutionPlan = '';
  toast('มอบหมายงานเรียบร้อย');
  render();
}

async function saveMaintRecord(id){

  if(!opinion){ toast('กรุณาเลือกความคิดเห็นของช่างผู้ตรวจสอบ', true); return; }

  // แล้วบันทึกไว้ใน "ลำดับเหตุการณ์" ว่าเปลี่ยนจากอะไรเป็นอะไร ประวัติหมุดเดิมยังอ่านย้อนได้จากที่นั่น
  if(prevOpinion && prevOpinion !== opinion && o.opinionProgress){
    o.opinionProgress = null;

      note:'เปลี่ยนแนวทางจาก "' + prevLabel + '" เป็น "' + INSPECTOR_OPINION_META[opinion] + '" — ล้างความคืบหน้าเดิมของแนวทางก่อนหน้า' });
  }
  o.statusHistory.push({ status:o.status, at: nowIso(), note:'ผู้จัดการแผนกซ่อมบำรุงบันทึกข้อมูลซ่อมบำรุง (วิเคราะห์สาเหตุ/รายการอะไหล่)' });
  await persistOrders();
  toast('บันทึกข้อมูลซ่อมบำรุงเรียบร้อย');
  closeMaintRecord();
}

/* ============================= ความคืบหน้าตามความคิดเห็นของช่างผู้ตรวจสอบ ============================= */
function opinionStepsFor(opinion){ return OPINION_STEPS[opinion] || []; }
/* "การดำเนินงาน" ที่เลือกตอนมอบหมาย → ชุดหมุดที่ต้องตาม (ใช้เมื่อยังไม่มีบันทึกข้อมูลซ่อมบำรุง)
   ต้องการสั่งซื้ออุปกรณ์ = รอสั่งของ → รอของมาส่ง ซึ่งเป็นขั้นตอนเดียวกับแนวทาง "ซื้ออุปกรณ์มาทำเอง"
   ส่วน immediate / use_existing ไม่มีอะไรต้องรอจากข้างนอก จึงไม่มีหมุด (เหมือนเดิม) */
const PLAN_PROGRESS_TRACK = { need_purchase: 'buy_parts' };
/* แนวทางที่ใช้กำหนดหมุดความคืบหน้าของใบนี้ — ความคิดเห็นของช่างผู้ตรวจสอบมาก่อนเสมอ (ละเอียดกว่า)
   ไม่มีบันทึกนั้นค่อยตกมาใช้ "การดำเนินงาน" ที่ ผจก.แผนกซ่อมบำรุงเลือกไว้ตอนมอบหมาย
   เดิมหมุดผูกกับ maintRecord อย่างเดียว ใบที่มอบหมายแล้วเลือก "ต้องการสั่งซื้ออุปกรณ์" ไว้จึงไม่มี
   หมุดให้กดสักขั้น ทั้งที่กำลังรอของอยู่จริง และ notifyOpinionStep() (ตัวเดียวที่แจ้งครบทั้งผู้แจ้ง +
   ผจก.แผนกซ่อมบำรุง + ช่าง) ไม่มีทางถูกเรียกเลย — ST-WH005/26 เป็นเคสนี้เป๊ะ */
function progressTrackOf(o){
  const op = o.maintRecord && o.maintRecord.inspectorOpinion;
  if(op && OPINION_STEPS[op]) return op;
  return PLAN_PROGRESS_TRACK[(o.assignment && o.assignment.executionPlan) || ''] || '';
}
/* ชื่อแนวทางที่เอาไว้โชว์/ใส่ในข้อความแจ้งเตือน — ต้องเรียกตามที่ผู้ใช้เลือกไว้จริง
   ใบที่หมุดมาจาก "การดำเนินงาน" ต้องขึ้นว่า "ต้องการสั่งซื้ออุปกรณ์" ไม่ใช่ "ซื้ออุปกรณ์มาทำเอง" */
function progressTrackLabel(o){
  const op = o.maintRecord && o.maintRecord.inspectorOpinion;
  if(op && OPINION_STEPS[op]) return INSPECTOR_OPINION_META[op] || op;
  const plan = (o.assignment && o.assignment.executionPlan) || '';
  return PLAN_PROGRESS_TRACK[plan] ? (EXECUTION_PLAN_META[plan] || plan) : '';
}
/* หมุดที่บันทึกไว้ของ "แนวทางปัจจุบัน" เท่านั้น — ถ้า ผจก.แผนกซ่อมบำรุงเปลี่ยนความคิดเห็น
   ภายหลัง (เช่นจากซื้ออุปกรณ์มาทำเอง เป็นส่งซ่อม) หมุดของแนวทางเดิมไม่ใช่ความคืบหน้าของ
   แนวทางใหม่ จึงไม่นำมาแสดง/นับต่อ แต่ยังคงอยู่ในข้อมูลและใน "ลำดับเหตุการณ์" ให้ย้อนดูได้ */
function opinionProgressOf(o){
  const p = o.opinionProgress;
  if(!p || p.opinion !== progressTrackOf(o)) return {};
  return p.steps || {};
}
/* หมุดล่าสุดที่บันทึกแล้ว (ไว้โชว์ป้ายสรุปในรายการแจ้งซ่อม) */
function latestOpinionStep(o){
  const steps = opinionStepsFor(progressTrackOf(o));
  const done = opinionProgressOf(o);
  let last = null;
  for(const s of steps){ if(done[s.key]) last = s; else break; }
  return last;
}
/* ขั้นแรกที่ยังไม่ถูกบันทึก = สิ่งที่ใบนี้ "ค้างรออยู่" ตอนนี้ (null = ครบทุกขั้นแล้ว หรือใบนี้
   ไม่มีแนวทางที่ต้องตามหมุด) */
function opinionPendingStep(o){
  const steps = opinionStepsFor(progressTrackOf(o));
  const done = opinionProgressOf(o);
  return steps.find(s => !done[s.key]) || null;
}
/* ป้าย "รออะไรอยู่" ที่โชว์คู่กับสถานะใบ — หน้างานจริงเกิดได้ทั้งสองแบบ คือช่างเริ่มซ่อมไปก่อน
   ด้วยอุปกรณ์ที่มีระหว่างรอของมาส่ง กับยังเริ่มไม่ได้เลยเพราะรอของ ทั้งสองแบบถูกต้องทั้งคู่
   จึงไม่บล็อกปุ่มเริ่มซ่อม แต่ต้องแยกให้ออกว่าใบที่ขึ้น "กำลังซ่อม" อยู่นั้นเดินอยู่จริง
   หรือค้างรอของ — เดิมสองอย่างนี้หน้าตาเหมือนกันเป๊ะ
   โชว์เฉพาะใบที่ยังอยู่ในช่วงทำงาน ใบที่ส่งตรวจรับ/ปิดไปแล้วไม่ต้องมาเตือนว่ารอของ */
function opinionWaitingLabel(o){
  if(o.status !== 'ASSIGNED' && o.status !== 'IN_PROGRESS') return '';
  const s = opinionPendingStep(o);
  return (s && s.pendingLabel) || '';
}
/* ใครกดอัปเดตหมุดได้: ผจก.แผนกซ่อมบำรุง (รวม admin ผ่าน hasRole) และช่างที่ถูกมอบหมายใบนี้
   — สองกลุ่มนี้คือคนที่รู้จริงว่าของส่งออกไปหรือมาส่งแล้ว ผู้แจ้ง/ผู้อนุมัติดูได้อย่างเดียว */
function canUpdateOpinionProgress(o){
  if(hasRole('maint')) return true;
  return state.role === 'tech' && assignedTechs(o).includes(state.myTechName);
}
function openOpinionStep(id, key){
  const o = getOrder(id); if(!o) return;
  const cur = opinionProgressOf(o)[key];
  state.ui.opinionStepFor = id;
  state.ui.opinionStepKey = key;
  state.ui.opinionStepDate = (cur && cur.date) || todayLocalIso();
  state.ui.opinionStepNote = (cur && cur.note) || '';
  render();
}
function closeOpinionStep(){
  state.ui.opinionStepFor = null; state.ui.opinionStepKey = '';
  state.ui.opinionStepDate = ''; state.ui.opinionStepNote = '';
  render();
}
async function saveOpinionStep(id){
  const o = getOrder(id); if(!o) return;
  if(!state.ordersLoaded){ toast('กำลังโหลดข้อมูลระบบ กรุณารอสักครู่แล้วลองใหม่', true); return; }
  if(!canUpdateOpinionProgress(o)){ toast('ท่านไม่มีสิทธิ์อัปเดตความคืบหน้าของใบนี้', true); return; }
  const opinion = progressTrackOf(o);
  const steps = opinionStepsFor(opinion);
  const idx = steps.findIndex(s => s.key === state.ui.opinionStepKey);
  if(idx < 0){ toast('ไม่พบขั้นตอนที่ต้องการบันทึก', true); return; }
  const step = steps[idx];
  const done = { ...opinionProgressOf(o) };
  // กันหน้าจอที่ค้างอยู่กับข้อมูลเก่ากดข้ามขั้น (เช่นอีกเครื่องเพิ่งย้อนหมุดก่อนหน้าออกไป)
  if(idx > 0 && !done[steps[idx-1].key]){ toast('กรุณาบันทึก "' + steps[idx-1].label + '" ก่อน', true); return; }
  const date = state.ui.opinionStepDate;
  if(!date){ toast('กรุณาระบุ' + step.dateLabel, true); return; }
  const isEdit = !!done[step.key];
  const by = state.myName || state.myTechName || (ROLES[state.role] ? ROLES[state.role].label : '');
  done[step.key] = { date, note: state.ui.opinionStepNote.trim(), by, at: nowIso() };
  const prevProgress = o.opinionProgress;
  o.opinionProgress = { opinion, steps: done };
  const label = INSPECTOR_OPINION_META[opinion] + ' — ' + step.label;
  o.statusHistory.push({ status:o.status, at: nowIso(),
    note: (isEdit ? 'แก้ไขความคืบหน้า: ' : 'อัปเดตความคืบหน้า: ') + label + ' (' + fmtDate(date) + ')'
          + (by ? ' โดย ' + by : '') + (done[step.key].note ? ' — ' + done[step.key].note : '') });
  const ok = await persistOrders();
  if(!ok){
    // เขียนกลับไม่สำเร็จ = ยังไม่มีอะไรถูกบันทึกจริง ต้องคืนค่าในหน้าจอให้ตรงกับของบนเซิร์ฟเวอร์
    // ไม่งั้นผู้ใช้จะเห็นหมุดขึ้นเขียวทั้งที่ไม่มีใครอื่นเห็น แล้วก็ไม่มีใครได้รับแจ้งเตือนด้วย
    o.opinionProgress = prevProgress;
    o.statusHistory.pop();
    toast('บันทึกความคืบหน้าไม่สำเร็จ (เชื่อมต่อฐานข้อมูลไม่ได้) กรุณาลองใหม่', true);
    render();
    return;
  }
  await notifyOpinionStep(o, step, date, done[step.key].note, isEdit);
  toast((isEdit ? 'แก้ไข' : 'บันทึก') + step.label + 'เรียบร้อย');
  closeOpinionStep();
}
/* แจ้งเตือน "ผู้ที่เกี่ยวข้อง" ของหมุดหนึ่งๆ = ผู้แจ้งซ่อมเจ้าของใบ + ผจก.แผนกซ่อมบำรุง
   + ช่างทุกคนที่ถูกมอบหมายใบนี้ (ช่างรับผ่าน LINE อย่างเดียว ไม่ต้องมีสิทธิ์ในแอปก็ได้รับ) */
async function notifyOpinionStep(o, step, date, note, isEdit){
  const head = (isEdit ? '[แก้ไขข้อมูล] ' : '') + progressTrackLabel(o) + ': ';
  const body = step.notify + ' (' + step.dateLabel + ' ' + fmtDate(date) + ')' + (note ? '\nหมายเหตุ: ' + note : '');
  // เพิ่งบันทึกหมุดสุดท้ายครบ = ของมาถึง/งานกลับมาแล้ว บอกก้าวถัดไปให้ชัดในข้อความเลย
  // ข้อความต่างกันตามว่าช่างเริ่มซ่อมไปก่อนแล้วหรือยัง — สองกรณีนี้เกิดจริงทั้งคู่หน้างาน
  let hint = '', techHint = '';
  if(!isEdit && !opinionPendingStep(o)){
    if(o.status === 'ASSIGNED'){
      hint = '\n✅ พร้อมเริ่มดำเนินการซ่อมแล้ว';
      techHint = hint + ' — เปิดใบแล้วกด "▶ เริ่มดำเนินการซ่อม"';
    } else if(o.status === 'IN_PROGRESS'){
      hint = '\n✅ ของครบแล้ว ช่างดำเนินการซ่อมต่อได้เลย';
      techHint = hint;
    }
  }
  await notifyOrderRequester(o, head + body + hint);
  await pushNotification('maint', o.id, o.docNumber, head + body + hint);
  for(const tech of assignedTechs(o)){
    await notifyTech(o, tech, head + body + techHint,
      '[' + o.docNumber + '] ' + head + body + techHint
      + '\nเครื่องจักร: ' + o.machineCode + ' — ' + o.machineName + '\n' + orderDeepLink(o.id, 'tech'));
  }
}
async function startRepair(id){
  const o = getOrder(id); if(!o) return;
  o.status = 'IN_PROGRESS';
  const techLabel = assignedTechs(o).join(', ') || 'ช่าง';
  o.statusHistory.push({ status:'IN_PROGRESS', at: nowIso(), note: techLabel + ' เริ่มดำเนินการซ่อม' });
  await persistOrders();
  await notifyOrderRequester(o, `งานซ่อมของท่านสถานะ: กำลังซ่อม`);
  toast('อัปเดตสถานะ: กำลังซ่อม');
  render();
}
async function finishRepair(id){
  const o = getOrder(id); if(!o) return;
  o.status = 'PENDING_VERIFY';
  o.statusHistory.push({ status:'PENDING_VERIFY', at: nowIso(), note:'ซ่อมเสร็จสิ้น รอผู้แจ้งซ่อมตรวจสอบการใช้งาน' });
  await persistOrders();
  await notifyOrderRequester(o, `งานซ่อมของท่านเสร็จสิ้นแล้ว กรุณาตรวจสอบการใช้งานเครื่องจักร`);
  await pushNotification('maint', id, o.docNumber, `ช่างแจ้งซ่อมเสร็จแล้ว (${assignedTechs(o).join(', ') || 'ไม่ระบุช่าง'}) รอผู้แจ้งซ่อมตรวจรับ`);
  toast('อัปเดตสถานะ: รอผู้แจ้งตรวจสอบผลการซ่อม');
  render();
}

/* ============================= REQUESTER VERIFICATION (ตรวจสอบผลการซ่อม) ============================= */
async function verifyRepair(id, type, note){
  const o = getOrder(id); if(!o) return;
  const n = (note||'').trim();
  if(type === 'verify_pass'){
    o.status = 'DONE';
    o.verification = { result:'pass', by:o.requestedBy, at: nowIso(), note:n };
    o.statusHistory.push({ status:'DONE', at: nowIso(), note:'ผู้แจ้งซ่อมตรวจสอบแล้ว: ผ่าน ใช้งานได้ปกติ' + (n ? ' — หมายเหตุ: ' + n : '') });
    await persistOrders();
    await pushNotification('maint', id, o.docNumber, `ผู้แจ้งซ่อมตรวจสอบแล้ว งานซ่อมแผนก ${o.department} ผ่าน ปิดงานเรียบร้อย`);
    for(const tech of assignedTechs(o)){
      await notifyTech(o, tech,
        `ผู้แจ้งซ่อมตรวจสอบแล้ว งานซ่อมของคุณผ่าน ปิดงานเรียบร้อย${n ? ' — หมายเหตุจากผู้แจ้ง: ' + n : ''}`,
        `[${o.docNumber}] ผู้แจ้งซ่อมตรวจสอบแล้ว งานซ่อมของคุณผ่าน ปิดงานเรียบร้อย ขอบคุณสำหรับการซ่อม${n ? '\nหมายเหตุจากผู้แจ้ง: ' + n : ''}\n${orderDeepLink(o.id, 'tech')}`);
    }
    toast('ยืนยันผลการซ่อมเรียบร้อย ปิดงาน');
  } else {
    if(!n){ toast('กรุณาระบุสาเหตุที่ต้องซ่อมเพิ่มเติม', true); return; }
    o.status = 'ASSIGNED';
    o.verification = { result:'fail', by:o.requestedBy, at: nowIso(), note:n };
    o.verificationHistory = [...(o.verificationHistory||[]), o.verification];
    o.statusHistory.push({ status:'ASSIGNED', at: nowIso(), note:'ผู้แจ้งซ่อมตรวจสอบแล้ว: ไม่ผ่าน ต้องซ่อมเพิ่มเติม เนื่องจาก ' + n });
    await persistOrders();
    const techs = assignedTechs(o);
    await pushNotification('maint', id, o.docNumber, `ผู้แจ้งซ่อมตรวจสอบพบว่างานซ่อมแผนก ${o.department} ไม่ผ่าน ต้องซ่อมเพิ่มเติม เนื่องจาก ${n}`);
    for(const tech of techs){
      await notifyTech(o, tech,
        `ผู้แจ้งซ่อมตรวจสอบพบว่างานซ่อมไม่ผ่าน ต้องดำเนินการซ่อมเพิ่มเติม — สาเหตุ: ${n}`,
        `[${o.docNumber}] ผู้แจ้งซ่อมตรวจสอบพบว่างานซ่อมไม่ผ่าน ต้องดำเนินการซ่อมเพิ่มเติม\nสาเหตุ: ${n}\n${orderDeepLink(o.id, 'tech')}`);
    }
    toast('ส่งกลับเพื่อซ่อมเพิ่มเติมแล้ว');
  }
  closeActionBox();
}

async function saveWebhook(){
  const role = state.ui.newWebhookRole;
  const prevUrl = state.config.lineWebhooks[role];
  state.config.lineWebhooks[role] = state.ui.newWebhookUrl.trim();
  // เดิม storeSet() ไม่เคยเช็คผลลัพธ์ ทำให้โชว์ toast "บันทึกแล้ว" เสมอแม้ POST จะล้มเหลวจริง
  // (เช่น เน็ตหลุด/deploy สิทธิ์ผิด) ผู้ใช้จึงเข้าใจผิดว่าตั้งค่าสำเร็จทั้งที่ข้อมูลไม่เข้าเซิร์ฟเวอร์เลย
  const ok = await storeSet('config', state.config);
  if(!ok){
    state.config.lineWebhooks[role] = prevUrl;
    toast('บันทึก Webhook ไม่สำเร็จ (เชื่อมต่อฐานข้อมูลไม่ได้) กรุณาลองใหม่อีกครั้ง', true);
    render();
    return;
  }
  toast('บันทึก Webhook สำหรับ ' + ROLES[role].label + ' แล้ว');
  render();
}
function openResetConfirm(){

}
function cancelResetConfirm(){

async function confirmResetAllData(){

async function resetAllData(){

/* ============================= RENDER: HEADER / NAV ============================= */
// บทบาท "tech" หนึ่งบัญชี LINE อาจผูกกับชื่อช่างได้หลายคน (เช่น บัญชีทดสอบ) จึงต้องขยาย
// รายการตัวเลือกให้เห็นชื่อช่างแต่ละคนแยกกัน ค่า option จึงเป็น "tech|<index>" สำหรับ tech
// และเป็น role key เฉยๆ สำหรับบทบาทอื่น
// admin สลับไปดูหน้าจอ "ในฐานะ" บทบาท/ช่างคนไหนก็ได้ — ระหว่างสลับ hasRole() จะเห็นเฉพาะ
// บทบาทที่กำลังสวมอยู่จริง (ไม่ผ่าน admin bypass) เพื่อให้เห็นหน้าจอตรงกับที่คนนั้นเห็นจริง
// สลับกลับมาเป็น admin ได้เสมอจาก dropdown เดียวกัน
function techSwitchNames(){
  return state.allowedRoles.includes('admin') ? (state.config.technicians || []) : state.techIdentities;
}
function roleOptionList(){
  const isAdmin = state.allowedRoles.includes('admin');
  const opts = [];
  (isAdmin ? Object.keys(ROLES) : state.allowedRoles).forEach(r => {
    if(r === 'tech'){
      const names = techSwitchNames();
      if(names.length > 1){
        names.forEach((name, i) => {
          opts.push({ value:`tech|${i}`, label:`${ROLES.tech.icon} ${ROLES.tech.label} — ${name}` });
        });
      } else {
        opts.push({ value:'tech|0', label:`${ROLES.tech.icon} ${ROLES.tech.label}` + (names[0] ? ` — ${names[0]}` : '') });
      }
    } else {
      opts.push({ value:r, label:`${ROLES[r].icon} ${ROLES[r].label}` });
    }
  });
  return opts;
}
function currentRoleValue(){
  if(state.role === 'tech'){
    const idx = techSwitchNames().indexOf(state.myTechName);
    return `tech|${idx >= 0 ? idx : 0}`;
  }
  return state.role;
}
function setRole(value){
  const [key, idxStr] = String(value).split('|');
  if(!ROLES[key]) return;
  if(!state.allowedRoles.includes('admin') && !state.allowedRoles.includes(key)) return;
  state.role = key; state.ui.actionFor=null; state.ui.actionType=null; state.ui.actionNote='';
  if(key === 'tech'){
    state.myTechName = techSwitchNames()[parseInt(idxStr, 10) || 0] || '';
  }
  if(state.view==='settings' && state.role!=='admin') state.view='list';
  render();
}
function setView(v){
  if(v==='settings' && state.role!=='admin') return;
  if(v==='settings') ensureLineDataLoaded(); // ไม่ await — โหลดเบื้องหลัง render() เองเมื่อเสร็จ
  state.view = v; render();
}

function renderHeader(){
  const roleOpts = roleOptionList();
  const curVal = currentRoleValue();
  const roleUi = roleOpts.length > 1
    ? `<select onchange="setRole(this.value)">${roleOpts.map(o => `<option value="${o.value}" ${curVal===o.value?'selected':''}>${o.label}</option>`).join('')}</select>`
    : `<span class="mono">${roleOpts[0] ? roleOpts[0].label : ''}</span>`;
  return `
  <header class="topbar">
    <div class="brand">
      <div class="logo">🛠</div>
      <div>
        <h1>ระบบแจ้งซ่อมเครื่องจักร</h1>
        <div class="sub">Maintenance Work Order System</div>
      </div>
    </div>
    <div class="role-select">
      <span>บทบาทปัจจุบัน:</span>
      ${roleUi}
    </div>
  </header>
  <nav class="tabs">
    <button class="${state.view==='new'?'active':''}" onclick="setView('new')">➕ ใบคำร้อง/ใบแจ้งซ่อม</button>
    <button class="${state.view==='list'||state.view==='detail'?'active':''}" onclick="setView('list')">📋 รายการแจ้งซ่อม</button>
    <button class="${state.view==='notif'?'active':''}" onclick="setView('notif')">🔔 การแจ้งเตือน${unreadCountForRole(state.role)>0?`<span class="badge">${unreadCountForRole(state.role)}</span>`:''}</button>
    ${state.role==='admin' ? `<button class="${state.view==='settings'?'active':''}" onclick="setView('settings')">⚙️ ตั้งค่าข้อมูลหลัก${pendingAccessCount()>0?`<span class="badge">${pendingAccessCount()}</span>`:''}</button>` : ''}
  </nav>`;
}

/* ============================= RENDER: LIST ============================= */
function renderList(){
  const deptOpts = ['ALL', ...state.config.departments.map(d=>d.code)];
  let orders = state.orders.filter(o =>
    (state.filterStatus==='ALL' || o.status===state.filterStatus) &&
    (state.filterDept==='ALL' || o.department===state.filterDept)
  );
  const cards = orders.map(o => {
    const meta = STATUS_META[o.status];
    // ป้ายสรุปความคืบหน้าของแนวทางที่เลือกไว้ — เห็นได้จากรายการเลยว่าใบไหนติดอยู่ที่รอของ/รอส่งซ่อม
    // ใบที่ยังค้างรออะไรอยู่ให้ขึ้นป้าย "รอ..." ก่อน (นั่นคือสิ่งที่ต้องตามงาน) ครบแล้วค่อย
    // แสดงหมุดล่าสุดที่ทำไป — สำคัญกับใบที่ขึ้น "กำลังซ่อม" ทั้งที่จริงๆ ยังรอของอยู่
    const opWaiting = opinionWaitingLabel(o);
    const opStep = latestOpinionStep(o);
    const opPill = opWaiting
      ? `<span class="status-pill" style="color:#c17f1e; background:#fbf0dd;">⏳ ${escapeHtml(opWaiting)}</span>`
      : opStep
        ? `<span class="status-pill" style="color:#2a6f97; background:#e4f0f7;">${escapeHtml(progressTrackLabel(o))}: ${escapeHtml(opStep.doneLabel)}</span>`
        : '';
    return `
    <div class="order-card" style="border-left-color:${meta.color}">
      <div class="order-top">
        <div>
          <span class="doc-chip" style="font-size:14px; padding:3px 9px;">${o.docNumber}</span>
          <span style="margin-left:8px; font-weight:600; color:var(--navy);">${o.department}</span>
          ${o.docType ? `<span style="margin-left:8px; font-size:11.5px; color:var(--slate);">${DOC_TYPES[o.docType]||''}</span>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          ${o.urgent ? `<span class="urgent-pill">🚨 ด่วน</span>` : ''}
          ${opPill}
          <span class="status-pill" style="color:${meta.color}; background:${meta.bg};">${meta.label}</span>
        </div>
      </div>
      <div class="order-body">
        <div><b class="mono">${escapeHtml(o.machineCode)}</b> — ${escapeHtml(o.machineName)}</div>
        <div class="cause">${escapeHtml(o.cause.length>90 ? o.cause.slice(0,90)+'…' : o.cause)}</div>
        <div class="order-meta">ผู้แจ้ง: ${escapeHtml(o.requestedBy)} • ต้องการใช้งาน: ${fmtDate(o.neededDate)}${o.urgent ? ' (ด่วน)' : ''} • แจ้งเมื่อ ${fmtDateTime(o.createdAt)}</div>
      </div>
      <div class="order-actions">
        <button class="btn btn-outline btn-sm" onclick="openDetail('${o.id}')">ดูรายละเอียด →</button>
      </div>
    </div>`;
  }).join('');

  return `
  <h2 class="view-title">รายการแจ้งซ่อม</h2>
  <p class="view-sub">ทั้งหมด ${state.orders.length} รายการ</p>
  <div class="filters">
    <select onchange="state.filterDept=this.value; render();">
      ${deptOpts.map(d=>`<option value="${d}" ${state.filterDept===d?'selected':''}>${d==='ALL'?'ทุกแผนก':d}</option>`).join('')}
    </select>
    <select onchange="state.filterStatus=this.value; render();">
      <option value="ALL" ${state.filterStatus==='ALL'?'selected':''}>ทุกสถานะ</option>
      ${Object.keys(STATUS_META).map(s=>`<option value="${s}" ${state.filterStatus===s?'selected':''}>${STATUS_META[s].label}</option>`).join('')}
    </select>
  </div>
  ${!state.ordersLoaded ? `<p class="desc">⏳ กำลังโหลดรายการ...</p>` : ''}
  ${orders.length ? cards : `<div class="empty-state"><div class="big">🗒️</div>ยังไม่มีใบแจ้งซ่อมตามเงื่อนไขที่เลือก</div>`}
  `;
}

  const urgentBadge = o.urgent ? ' <span class="urgent-pill">🚨 ต้องการด่วน</span>' : '';

  if(state.role === 'admin' && state.ui.editNeededFor === o.id){

  } else {

      (state.role === 'admin' ? ` <button class="btn btn-outline btn-sm" style="margin-left:6px;" onclick="openEditNeededDate('${o.id}')">✎ แก้ไข</button>` : '');
  }

  // "รออะไรอยู่" — โชว์คู่กับสถานะใบทั้งที่หัวใบ กล่องของช่าง และการ์ดในหน้ารายการ
  // ตั้งใจไม่ล็อกปุ่มเริ่ม/จบซ่อมไว้กับหมุดพวกนี้ เพราะหน้างานจริงเกิดได้ทั้งสองแบบ:
  // ช่างเริ่มซ่อมไปก่อนด้วยของที่มีระหว่างรอของมาส่ง กับยังเริ่มไม่ได้เลยเพราะรอของ
  // สิ่งที่ระบบต้องทำคือ "แยกสองแบบนี้ให้ออก" ไม่ใช่ไปห้ามแบบใดแบบหนึ่ง
  const waitingLabel = opinionWaitingLabel(o);
  const waitingNote = waitingLabel
    ? `<p class="desc" style="margin:0 0 10px; color:#c17f1e;">⏳ ${escapeHtml(waitingLabel)} — ยังเริ่ม/ทำต่อด้วยอุปกรณ์ที่มีอยู่ก่อนได้ ระบบไม่ได้ล็อกปุ่มไว้</p>`
    : '';

  // action box depending on role + status
  let actionBox = '';
  const actionBoxOpen = state.ui.actionFor === o.id;
  const actionType = state.ui.actionType;
  const NOTE_LABELS = { approve:'หมายเหตุ (ถ้ามี)', reject:'เหตุผลที่ไม่อนุมัติ', needinfo:'ระบุข้อมูลที่ต้องการเพิ่มเติม', resubmit:'ข้อมูลเพิ่มเติม', verify_pass:'หมายเหตุ (ถ้ามี)', verify_fail:'ระบุสาเหตุที่ต้องซ่อมเพิ่มเติม' };
  const CONFIRM_LABELS = { approve:'ยืนยันอนุมัติ', reject:'ยืนยันไม่อนุมัติ', needinfo:'ส่งคำขอข้อมูลเพิ่มเติม', resubmit:'ส่งข้อมูล', verify_pass:'ยืนยันผ่านการตรวจสอบ', verify_fail:'ส่งกลับเพื่อซ่อมเพิ่มเติม' };

          <button type="button" class="photo-drop" onclick="takePhoto('resubmit','resubmitPhotoCameraInput')">📷 ถ่ายภาพ<small>เปิดกล้องถ่ายรูปตอนนี้</small></button>
          <button type="button" class="photo-drop" onclick="openPhotoPicker('resubmitPhotoGalleryInput')">🖼️ เลือกจากอัลบั้ม<small>เลือกได้หลายรูป</small></button>

      <div class="reject-box">
        <label class="field-label">${NOTE_LABELS[actionType]}</label>
        <textarea class="input" data-fid="actionNote" oninput="state.ui.actionNote=this.value" placeholder="ระบุหมายเหตุ...">${escapeHtml(state.ui.actionNote)}</textarea>

          <button class="btn ${(actionType==='reject'||actionType==='verify_fail')?'btn-danger-outline':'btn-primary'} btn-sm" onclick="confirmAction('${o.id}')">${CONFIRM_LABELS[actionType]}</button>

  if(!state.ordersLoaded){
    // เปิดจากลิงก์แจ้งเตือน LINE โดยตรง — โชว์ใบนี้ได้ไวจากข้อมูลที่ขอมาเฉพาะใบ แต่ปุ่มที่ต้องบันทึกกลับ
    // ต้องรอให้รายการเต็มโหลดเสร็จก่อน กันไม่ให้บันทึกทับข้อมูลใบอื่นที่ยังไม่ถูกโหลดเข้ามาใน state.orders
    actionBox = `<div class="action-box"><p class="desc" style="margin:0;">⏳ กำลังโหลดข้อมูลเพิ่มเติม กรุณารอสักครู่ก่อนกดปุ่มดำเนินการ...</p></div>`;
  } else if(hasRole('fm') && o.status==='PENDING_FM'){
    actionBox = `
    <div class="action-box">
      <h4>รออนุมัติจากผู้จัดการโรงงาน</h4>
      <div class="order-actions">
        <button class="btn btn-success" onclick="openActionBox('${o.id}','approve')">✓ อนุมัติ</button>

        <button class="btn btn-danger-outline" onclick="openActionBox('${o.id}','reject')">✕ ไม่อนุมัติ</button>
      </div>
      ${noteBox()}
    </div>`;
  } else if(hasRole('gm') && o.status==='PENDING_GM'){
    actionBox = `
    <div class="action-box">
      <h4>รออนุมัติจากผู้จัดการทั่วไป</h4>
      <div class="order-actions">
        <button class="btn btn-success" onclick="openActionBox('${o.id}','approve')">✓ อนุมัติ</button>
        <button class="btn btn-outline" onclick="openActionBox('${o.id}','needinfo')">❓ ต้องการข้อมูลเพิ่มเติม</button>
        <button class="btn btn-danger-outline" onclick="openActionBox('${o.id}','reject')">✕ ไม่อนุมัติ</button>
      </div>
      ${noteBox()}
    </div>`;
  } else if(hasRole('requester') && (o.status==='NEEDS_INFO_FM' || o.status==='NEEDS_INFO_GM')){
    actionBox = `
    <div class="action-box">
      <h4>ต้องการข้อมูลเพิ่มเติมจากท่าน</h4>
      <div class="order-actions">
        <button class="btn btn-primary" onclick="openActionBox('${o.id}','resubmit')">📨 ส่งข้อมูลเพิ่มเติม</button>
      </div>
      ${noteBox()}
    </div>`;
  } else if(hasRole('requester') && o.status==='PENDING_VERIFY'){
    actionBox = `
    <div class="action-box">
      <h4>ตรวจสอบผลการซ่อม</h4>
      <p class="desc" style="margin:0 0 10px;">ช่างแจ้งว่าซ่อมเสร็จแล้ว กรุณาตรวจสอบการใช้งานเครื่องจักรจริง</p>
      <div class="order-actions">
        <button class="btn btn-success" onclick="openActionBox('${o.id}','verify_pass')">✓ ผ่าน (ใช้งานได้ปกติ)</button>
        <button class="btn btn-danger-outline" onclick="openActionBox('${o.id}','verify_fail')">✕ ไม่ผ่าน (ต้องซ่อมเพิ่มเติม)</button>
      </div>
      ${noteBox()}
    </div>`;
  } else if(hasRole('maint') && o.status==='PENDING_ASSIGN'){
    const rows = state.ui.assignTechs.map((val, i) => `
      <div class="inline-form" style="margin-bottom:6px;">
        <select class="input" onchange="setAssignTech(${i}, this.value)">
          <option value="">-- เลือกช่าง --</option>
          ${state.config.technicians.map(t=>`<option value="${escapeHtml(t)}" ${val===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}

        ${state.ui.assignTechs.length>1 ? `<button class="btn btn-outline btn-sm" onclick="removeAssignTechRow(${i})">✕</button>` : ''}

    <div class="action-box">

        <input class="input" data-fid="assignReceivedBy" type="text" placeholder="ชื่อ-นามสกุล" value="${escapeHtml(state.ui.assignReceivedBy)}" oninput="state.ui.assignReceivedBy=this.value">

      <div class="grid-2" style="margin:14px 0 10px;">
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">วันที่เริ่มงาน <span class="req-star">*</span></label>
          <input type="date" class="input" value="${state.ui.assignStartDate}" onchange="state.ui.assignStartDate=this.value">
        </div>
        <div class="field" style="margin-bottom:0;">

      ${waitingNote}

  // "บันทึกข้อมูลซ่อมบำรุง" — เอกสารประกอบตามใบมอบหมายงาน/ใบวิเคราะห์สาเหตุของ ผจก.แผนกซ่อมบำรุง
  // แสดงให้ทุกบทบาทเห็นแบบอ่านอย่างเดียวหลังมอบหมายงานแล้ว แต่แก้ไข/บันทึกได้เฉพาะ role==='maint'
  let maintRecordSection = '';
  if(assignedTechs(o).length){
    const mr = o.maintRecord;
    const editingRecord = state.ui.maintRecordFor === o.id;
    if(editingRecord){
      const partRows = state.ui.maintRecordParts.map((p,i) => `
        <tr>
          <td>${i+1}</td>

          <td><input class="input" style="width:64px;" value="${escapeHtml(p.qty)}" oninput="setMaintPart(${i},'qty',this.value)"></td>
          <td><input class="input" style="width:64px;" value="${escapeHtml(p.unit)}" oninput="setMaintPart(${i},'unit',this.value)"></td>
          <td><input class="input" style="width:84px;" value="${escapeHtml(p.price)}" oninput="setMaintPart(${i},'price',this.value)"></td>
          <td><input class="input" style="min-width:100px;" value="${escapeHtml(p.shop)}" oninput="setMaintPart(${i},'shop',this.value)"></td>
          <td><input class="input" style="min-width:100px;" value="${escapeHtml(p.note)}" oninput="setMaintPart(${i},'note',this.value)"></td>
          <td>${state.ui.maintRecordParts.length>1 ? `<button class="del" onclick="removeMaintPartRow(${i})">✕</button>` : ''}</td>
        </tr>`).join('');
      maintRecordSection = `
      <div class="action-box">
        <h4>บันทึกข้อมูลซ่อมบำรุง (ผจก.แผนกซ่อมบำรุง)</h4>
        <div class="field">
          <label class="field-label">วิเคราะห์สาเหตุ / อาการที่ชำรุด พบว่า <span class="req-star">*</span></label>
          <textarea class="input" oninput="state.ui.maintRecordCause=this.value" placeholder="ระบุผลการวิเคราะห์สาเหตุ...">${escapeHtml(state.ui.maintRecordCause)}</textarea>
        </div>
        <div class="field">
          <label class="field-label">ความคิดเห็นของช่างผู้ตรวจสอบ <span class="req-star">*</span></label>
          <select class="input" onchange="state.ui.maintRecordOpinion=this.value">
            <option value="">-- เลือก --</option>
            ${Object.entries(INSPECTOR_OPINION_META).map(([k,v])=>`<option value="${k}" ${state.ui.maintRecordOpinion===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label class="field-label">รายการอะไหล่ / วัสดุที่ใช้ (เฉพาะเครื่องจักรมีรหัส)</label>
          <div style="overflow-x:auto;">
            <table class="mini">
              <tr><th>ลำดับ</th><th>รายการ</th><th>จำนวน</th><th>หน่วย</th><th>ราคา</th><th>ชื่อร้าน</th><th>หมายเหตุ</th><th></th></tr>
              ${partRows}
            </table>
          </div>
          <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="addMaintPartRow()">+ เพิ่มรายการ</button>
        </div>
        <div class="order-actions">
          <button class="btn btn-primary" onclick="saveMaintRecord('${o.id}')">บันทึก</button>
          <button class="btn btn-outline" onclick="closeMaintRecord()">ยกเลิก</button>
        </div>
      </div>`;
    } else {
      maintRecordSection = `
      <div class="action-box">
        <h4>บันทึกข้อมูลซ่อมบำรุง (เอกสารประกอบ)</h4>
        ${mr ? `
          <div class="kv"><div class="k">วิเคราะห์สาเหตุ / อาการที่ชำรุด</div><div class="v">${escapeHtml(mr.causeAnalysis)}</div></div>
          <div class="kv"><div class="k">ความคิดเห็นของช่างผู้ตรวจสอบ</div><div class="v">${INSPECTOR_OPINION_META[mr.inspectorOpinion]||'-'}</div></div>
          ${mr.parts && mr.parts.length ? `
          <div class="kv"><div class="k">รายการอะไหล่ / วัสดุที่ใช้</div>
            <div style="overflow-x:auto;">
              <table class="mini">
                <tr><th>ลำดับ</th><th>รายการ</th><th>จำนวน</th><th>หน่วย</th><th>ราคา</th><th>ชื่อร้าน</th><th>หมายเหตุ</th></tr>
                ${mr.parts.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.qty)}</td><td>${escapeHtml(p.unit)}</td><td>${escapeHtml(p.price)}</td><td>${escapeHtml(p.shop)}</td><td>${escapeHtml(p.note)}</td></tr>`).join('')}

        ${hasRole('maint') ? `<div class="order-actions"><button class="btn btn-outline btn-sm" onclick="openMaintRecord('${o.id}')">${mr?'แก้ไขบันทึก':'📋 บันทึกข้อมูลซ่อมบำรุง'}</button></div>` : ''}
      </div>`;
    }
  }

  // ความคืบหน้าตามแนวทางที่เลือกไว้ในบันทึกข้อมูลซ่อมบำรุง — เห็นได้ทุกบทบาท (ผู้แจ้งจะได้เลิกตามถาม)
  // แต่กดบันทึกได้เฉพาะ ผจก.แผนกซ่อมบำรุง / admin / ช่างที่ถูกมอบหมายใบนี้ (canUpdateOpinionProgress)
  let opinionProgressSection = '';
  const opinionKey = progressTrackOf(o);
  const opSteps = opinionStepsFor(opinionKey);
  if(opSteps.length){
    const doneSteps = opinionProgressOf(o);
    const canUpdate = state.ordersLoaded && canUpdateOpinionProgress(o);
    const finishedCount = opSteps.filter(s => doneSteps[s.key]).length;
    const stepRows = opSteps.map((s, i) => {
      const rec = doneSteps[s.key];
      const prevDone = i === 0 || !!doneSteps[opSteps[i-1].key];
      const editing = state.ui.opinionStepFor === o.id && state.ui.opinionStepKey === s.key;
      const form = editing ? `
        <div class="reject-box">
          <div class="field" style="margin-bottom:10px;">
            <label class="field-label">${s.dateLabel} <span class="req-star">*</span></label>
            <input type="date" class="input" value="${state.ui.opinionStepDate}" onchange="state.ui.opinionStepDate=this.value">
          </div>
          <label class="field-label">หมายเหตุ (ถ้ามี)</label>
          <textarea class="input" oninput="state.ui.opinionStepNote=this.value" placeholder="เช่น ชื่อร้าน/ผู้รับงาน เลขที่ใบสั่งซื้อ...">${escapeHtml(state.ui.opinionStepNote)}</textarea>
          <div class="order-actions">
            <button class="btn btn-primary btn-sm" onclick="saveOpinionStep('${o.id}')">${rec ? 'บันทึกการแก้ไข' : 'ยืนยันและแจ้งเตือน'}</button>
            <button class="btn btn-outline btn-sm" onclick="closeOpinionStep()">ยกเลิก</button>
          </div>
        </div>` : '';
      let statusCell, actionCell = '';
      if(rec){
        statusCell = `<span class="status-pill" style="color:#2F8F6B; background:#e6f3ee;">✓ ${escapeHtml(s.doneLabel)}</span>
          <span style="margin-left:8px;">${fmtDate(rec.date)}</span>
          ${rec.by ? `<span style="color:var(--slate);"> • บันทึกโดย ${escapeHtml(rec.by)}</span>` : ''}
          ${rec.note ? `<div style="margin-top:2px; color:var(--slate);">หมายเหตุ: ${escapeHtml(rec.note)}</div>` : ''}`;
        if(canUpdate && !editing) actionCell = `<button class="btn btn-outline btn-sm" onclick="openOpinionStep('${o.id}','${s.key}')">✎ แก้ไข</button>`;
      } else if(prevDone){
        statusCell = `<span class="status-pill" style="color:#c17f1e; background:#fbf0dd;">รอบันทึก</span>`;
        if(canUpdate && !editing) actionCell = `<button class="btn btn-primary btn-sm" onclick="openOpinionStep('${o.id}','${s.key}')">${s.btn}</button>`;
      } else {
        statusCell = `<span class="status-pill" style="color:#6b7785; background:#eef0f2;">รอขั้นตอนก่อนหน้า</span>`;
      }
      return `
        <div class="kv" style="padding-bottom:10px; ${i < opSteps.length-1 ? 'border-bottom:1px solid var(--line);' : 'margin-bottom:0;'}">
          <div class="k">ขั้นที่ ${i+1} — ${escapeHtml(s.label)}</div>
          <div class="v">${statusCell}</div>
          ${actionCell ? `<div class="order-actions" style="margin-top:8px;">${actionCell}</div>` : ''}
          ${form}
        </div>`;
    }).join('');
    opinionProgressSection = `
    <div class="action-box">
      <h4>ความคืบหน้า: ${escapeHtml(progressTrackLabel(o))} (${finishedCount}/${opSteps.length})</h4>
      <p class="desc" style="margin:0 0 12px; font-size:12.5px; color:var(--slate);">
        ${canUpdate ? 'ทุกครั้งที่บันทึก ระบบจะแจ้งเตือนผู้แจ้งซ่อม ผู้จัดการแผนกซ่อมบำรุง และช่างผู้รับผิดชอบโดยอัตโนมัติ'
                    : 'อัปเดตได้โดยผู้จัดการแผนกซ่อมบำรุงหรือช่างผู้รับผิดชอบใบนี้'}
      </p>
      ${stepRows}
    </div>`;
  }

  return `
  <button class="back-link" onclick="backToList()">← กลับไปรายการแจ้งซ่อม</button>
  <div class="detail-head">
    <div>
      <span class="doc-chip">${o.docNumber}</span>
      <h2 class="view-title" style="display:inline-block; margin-left:10px;">แผนก ${o.department}</h2>
    </div>
    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
      ${waitingLabel ? `<span class="status-pill" style="color:#c17f1e; background:#fbf0dd; font-size:13px; padding:6px 14px;">⏳ ${escapeHtml(waitingLabel)}</span>` : ''}
      <span class="status-pill" style="color:${meta.color}; background:${meta.bg}; font-size:13px; padding:6px 14px;">${meta.label}</span>
    </div>
  </div>
  <div class="card">
    <div class="grid-2">
      <div class="kv"><div class="k">ประเภทเอกสาร</div><div class="v">${o.docType ? DOC_TYPES[o.docType] : '—'}</div></div>
      <div class="kv"><div class="k">รหัสเครื่องจักร</div><div class="v mono">${escapeHtml(o.machineCode)}</div></div>
      <div class="kv"><div class="k">ชื่อเครื่องจักร</div><div class="v">${escapeHtml(o.machineName)}</div></div>
      <div class="kv"><div class="k">ผู้แจ้ง</div><div class="v">${escapeHtml(o.requestedBy)}</div></div>
      <div class="kv"><div class="k">วันที่ต้องการใช้งาน</div><div class="v">${neededDateCell}</div></div>
      <div class="kv"><div class="k">แจ้งเมื่อ</div><div class="v">${fmtDateTime(o.createdAt)}</div></div>
      <div class="kv"><div class="k">ช่างผู้รับผิดชอบ</div><div class="v">${assignedTechs(o).length ? assignedTechs(o).map(escapeHtml).join(', ') : '—'}</div></div>
      ${o.assignment.receivedByName ? `<div class="kv"><div class="k">ผู้รับใบแจ้งซ่อม</div><div class="v">${escapeHtml(o.assignment.receivedByName)}</div></div>` : ''}
      ${o.assignment.startDate ? `<div class="kv"><div class="k">วันที่เริ่มงาน</div><div class="v">${fmtDate(o.assignment.startDate)}</div></div>` : ''}
      ${o.assignment.endDate ? `<div class="kv"><div class="k">กำหนดการดำเนินงานเสร็จสิ้น</div><div class="v">${fmtDate(o.assignment.endDate)}</div></div>` : ''}
      ${o.assignment.executionPlan ? `<div class="kv"><div class="k">การดำเนินงาน</div><div class="v">${EXECUTION_PLAN_META[o.assignment.executionPlan]}</div></div>` : ''}
      ${o.verification ? `<div class="kv"><div class="k">ผลการตรวจสอบของผู้แจ้ง (ล่าสุด)</div><div class="v">${VERIFY_RESULT_META[o.verification.result]}${o.verification.note ? ' — ' + escapeHtml(o.verification.note) : ''}</div></div>` : ''}
    </div>
    <div class="kv"><div class="k">อาการ / สาเหตุ</div><div class="v">${escapeHtml(o.cause)}</div></div>
    ${gallery}
    ${actionBox}
    ${maintRecordSection}
    ${opinionProgressSection}
    ${o.verificationHistory && o.verificationHistory.length ? `
    <div class="kv" style="margin-top:16px;"><div class="k">ประวัติการตรวจสอบของผู้แจ้ง (ครั้งที่ไม่ผ่าน)</div>
      <div class="timeline">
        ${o.verificationHistory.map(v => `<div class="timeline-item"><div>✕ ไม่ผ่าน — เนื่องจาก ${escapeHtml(v.note||'')}</div><div class="t-time">${fmtDateTime(v.at)}</div></div>`).join('')}
      </div>
    </div>` : ''}
    <div class="kv" style="margin-top:20px;"><div class="k">ลำดับเหตุการณ์</div><div class="timeline">${timeline}</div></div>
  </div>`;
}

/* ============================= RENDER: NOTIFICATIONS ============================= */
async function markAllRead(){
  const ok = await saveNotifications(list => {
    list.forEach(n => { if(notifIsMine(n)) n.read = true; });
    return list;
  });
  if(!ok) toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true);
  render();
}
function renderNotif(){
  // admin เห็นการแจ้งเตือนของทุกบทบาทรวมกัน (ตรงกับ "เข้าถึงทุกฟังก์ชัน")
  const mine = state.notifications.filter(notifIsMine);
  const items = mine.map(n => `
    <div class="notif-item ${n.read?'':'unread'}">
      <div class="notif-icon">🔔</div>
      <div>
        <div class="notif-text">
          ${state.role==='admin' ? `<span class="status-pill" style="color:#6b7785; background:#eef0f2; margin-right:6px;">${ROLES[n.toRole] ? ROLES[n.toRole].label : n.toRole}</span>` : ''}
          <b class="mono">${n.docNumber}</b> — ${escapeHtml(n.message)}
        </div>
        <div class="notif-time">${fmtDateTime(n.createdAt)}</div>
      </div>
    </div>`).join('');
  return `
  <h2 class="view-title">การแจ้งเตือน — ${ROLES[state.role].label}</h2>
  <p class="view-sub">${state.role==='admin' ? 'การแจ้งเตือนในระบบของทุกบทบาทรวมกัน' : 'การแจ้งเตือนในระบบสำหรับบทบาทนี้'} (พร้อมส่งต่อไปยัง LINE หากตั้งค่า Webhook ไว้ในหน้าตั้งค่า)</p>
  ${!state.ordersLoaded ? `<p class="desc">⏳ กำลังโหลดรายการ...</p>` : ''}
  ${mine.length ? `<div style="margin-bottom:12px;"><button class="btn btn-outline btn-sm" onclick="markAllRead()">ทำเครื่องหมายว่าอ่านแล้วทั้งหมด</button></div>` : ''}
  ${mine.length ? items : `<div class="empty-state"><div class="big">📭</div>ยังไม่มีการแจ้งเตือนสำหรับบทบาทนี้</div>`}
  `;
}

/* ============================= RENDER: SETTINGS ============================= */
function toggleGrantRole(id, defaultRoles, role, checked){
  const cur = state.ui.grantRole[id] || defaultRoles.slice();
  state.ui.grantRole[id] = checked ? [...new Set([...cur, role])] : cur.filter(r => r !== role);
  render();
}
function pendingAccessCount(){ return state.accessRequests.filter(r => r.status === 'pending').length; }
function renderAccessRequests(){
  const list = state.accessRequests.slice().sort((a,b) => String(b.at).localeCompare(String(a.at)));
  const pending = list.filter(r => r.status === 'pending');
  const decided = list.filter(r => r.status !== 'pending');
  const techOptsFor = (cur) => (state.config.technicians || []).map(t =>
    `<option value="${escapeHtml(t)}" ${cur === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('');
  // คนที่เคยทักไลน์ OA เข้ามา (แท็บ LINE Users) + คนที่ถูกกำหนดบทบาทไว้แล้ว + คนที่พิมพ์ไว้เองในชีต
  // "แจ้งเตือน LINE - ผู้รับ" ให้ admin เลือกผูกกับคำขอนี้ได้ (รวมทุกแหล่ง ไม่ซ้ำ userId เดียวกัน)
  const lineRecipientById = {};
  state.lineRecipients.forEach(r => { if(r.userId && !lineRecipientById[r.userId]) lineRecipientById[r.userId] = r; });
  // โชว์ควบ "ชื่อจริง (ชื่อไลน์)" เมื่อรู้ทั้งสองอย่าง — ชื่อจริงมาจากที่ admin พิมพ์เอง (คอลัมน์ชื่อใน
  // ชีตผู้รับ หรือ lineUserRoles เก่า) ส่วนชื่อไลน์คือชื่อโปรไฟล์ที่เจ้าตัวตั้งเอง (แท็บ LINE Users)
  // เดิมชื่อไลน์ทับชื่อจริงเสมอ ทำให้ดรอปดาวน์ขึ้นเป็นชื่อเล่น/อีโมจิจนผูกผิดคนได้ง่าย
  // เทียบชื่อด้วย samePersonName() (ไม่สนช่องว่าง/รูปแบบ Unicode) ไม่งั้นชื่อเดียวกันที่พิมพ์คนละที่
  // จะกลายเป็น "อุดม หนานคำ (อุดม หนานคำ)" ซ้ำสองรอบ เพราะต่างกันแค่เว้นวรรคซ้ำหรืออักขระความกว้างศูนย์
  const lineLabelFor = (id) => {
    const known = state.lineUsers.find(u => u.userId === id) || {};
    const fromSheet = lineRecipientById[id];
    const lineName = String(known.displayName || '').trim();
    const realName = String((fromSheet && fromSheet.name)
      || (state.lineUserRoles[id] && state.lineUserRoles[id].name) || '').trim();
    if(realName && lineName && !samePersonName(realName, lineName)) return `${realName} (${lineName})`;
    return realName || lineName || id;
  };
  const lineUserOptsFor = (cur) => {
    const ids = [...new Set(
      state.lineUsers.map(u => u.userId)
        .concat(Object.keys(state.lineUserRoles))
        .concat(Object.keys(lineRecipientById))
        .concat(cur ? [cur] : [])   // ค่าที่ผูกไว้เดิมต้องไม่หายจากรายการ แม้คนนั้นจะหลุดจากทุกแหล่ง
    )];
    return ids.map(id => {
      const fromSheet = lineRecipientById[id];
      const label = lineLabelFor(id);
      return `<option value="${escapeHtml(id)}" ${cur === id ? 'selected' : ''}>${escapeHtml(label === id && fromSheet ? `(${fromSheet.role})` : label)}</option>`;
    }).join('');
  };

  const pendingCards = pending.map(r => {
    const defaultRoles = [r.requestedRole];
    const roles = state.ui.grantRole[r.id] || defaultRoles;
    const techName = state.ui.grantTechName[r.id] || r.requestedTechName || '';
    const lineUserId = state.ui.grantLineUserId[r.id] !== undefined ? state.ui.grantLineUserId[r.id] : (r.lineUserId || '');
    const defaultRolesJs = `[${defaultRoles.map(x => `'${x}'`).join(',')}]`;
    const roleChecks = Object.keys(ROLES).map(k => `
        <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:normal;">
          <input type="checkbox" value="${k}" ${roles.includes(k) ? 'checked' : ''}
            onchange="toggleGrantRole('${r.id}', ${defaultRolesJs}, '${k}', this.checked)">
          ${ROLES[k].label}
        </label>`).join('');
    return `
    <div class="reject-box">
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline;">
        <b style="color:var(--navy); font-size:14.5px;">${escapeHtml(r.name)}</b>
        <span style="font-size:12px; color:var(--slate);">${escapeHtml(fmtDateTime(r.at))}</span>
      </div>
      <div style="font-size:13px; color:var(--slate); margin-top:3px;">
        แผนก: ${escapeHtml(r.dept || '-')} · ขอบทบาท: <b style="color:var(--ink);">${ROLES[r.requestedRole] ? escapeHtml(ROLES[r.requestedRole].label) : escapeHtml(r.requestedRole || '-')}</b>
        ${r.requestedTechName ? ` · ระบุชื่อช่าง: ${escapeHtml(r.requestedTechName)}` : ''}
        ${r.device ? ` · อุปกรณ์: ${escapeHtml(r.device)}` : ''}
      </div>
      ${r.note ? `<div style="font-size:13px; margin-top:4px;">หมายเหตุ: ${escapeHtml(r.note)}</div>` : ''}
      <div style="margin-top:10px;">
        <label class="field-label">บทบาทที่จะให้ (เลือกได้มากกว่า 1)</label>
        <div style="display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:4px;">${roleChecks}</div>
      </div>
      ${roles.includes('tech') ? `
      <div style="margin-top:10px;">
        <label class="field-label">ชื่อช่าง (ต้องตรงกับชีต "ช่าง") <span class="req-star">*</span></label>
        <select class="input" onchange="state.ui.grantTechName['${r.id}']=this.value">
          <option value="">— กรุณาเลือก —</option>
          ${techOptsFor(techName)}
        </select>
      </div>` : ''}
      <div style="margin-top:10px;">
        <label class="field-label">LINE ของคนนี้ (ถ้ามี) — แจ้งเตือนตอนอนุมัติ และการแจ้งเตือนของบทบาทที่ให้ไว้</label>
        <select class="input" onchange="state.ui.grantLineUserId['${r.id}']=this.value">
          <option value="">— ไม่ทราบ/ไม่เชื่อม —</option>
          ${lineUserOptsFor(lineUserId)}
        </select>
      </div>
      <div class="order-actions" style="margin-top:12px;">
        <button class="btn btn-success btn-sm" onclick="approveAccessRequest('${r.id}')">✓ อนุมัติ</button>
        <button class="btn btn-danger-outline btn-sm" onclick="rejectAccessRequest('${r.id}')">ปฏิเสธ</button>
      </div>
    </div>`;
  }).join('');

  const decidedRows = decided.map(r => {
    const granted = (r.roles || []).map(k => ROLES[k] ? ROLES[k].label : k).join(', ');
    const pill = r.status === 'approved'
      ? `<span class="status-pill" style="color:#2F8F6B; background:#e6f3ee;">อนุมัติแล้ว</span>`
      : `<span class="status-pill" style="color:#B5433A; background:#fbeae8;">ปฏิเสธ</span>`;
    if(r.status === 'approved' && state.ui.editingAccessId === r.id){
      const roles = state.ui.editRole[r.id] || [];
      const techName = state.ui.editTechName[r.id] || '';
      const lineUserId = state.ui.editLineUserId[r.id] !== undefined ? state.ui.editLineUserId[r.id] : (r.lineUserId || '');
      const roleChecks = Object.keys(ROLES).map(k => `
          <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:normal;">
            <input type="checkbox" value="${k}" ${roles.includes(k) ? 'checked' : ''}
              onchange="toggleEditRole('${r.id}', '${k}', this.checked)">
            ${ROLES[k].label}
          </label>`).join('');
      return `<tr><td colspan="4">
        <div style="padding:6px 0;">
          <div style="font-size:13px; margin-bottom:6px;"><b>${escapeHtml(r.name)}</b>${r.dept ? ` · ${escapeHtml(r.dept)}` : ''}</div>
          <div style="display:flex; flex-wrap:wrap; gap:4px 16px;">${roleChecks}</div>
          ${roles.includes('tech') ? `
          <div style="margin-top:8px;">
            <label class="field-label">ชื่อช่าง (ต้องตรงกับชีต "ช่าง") <span class="req-star">*</span></label>
            <select class="input" onchange="state.ui.editTechName['${r.id}']=this.value">
              <option value="">— กรุณาเลือก —</option>
              ${techOptsFor(techName)}
            </select>
          </div>` : ''}
          <div style="margin-top:8px;">
            <label class="field-label">LINE ที่รับการแจ้งเตือนของบทบาทนี้</label>
            <select class="input" onchange="state.ui.editLineUserId['${r.id}']=this.value">
              <option value="">— ไม่ส่งแจ้งเตือนทาง LINE —</option>
              ${lineUserOptsFor(lineUserId)}
            </select>
            <p class="desc" style="margin:4px 0 0; font-size:12px;">ไม่พบชื่อในรายการ? ให้คนนั้นทักแชทหา LINE OA หนึ่งครั้ง หรือเพิ่ม userId เองที่หัวข้อ "เพิ่มผู้ใช้ LINE ด้วยตัวเอง" ด้านล่าง</p>
          </div>
          <div class="order-actions" style="margin-top:10px;">
            <button class="btn btn-success btn-sm" onclick="saveAccessRoles('${r.id}')">บันทึก</button>
            <button class="btn btn-outline btn-sm" onclick="cancelEditAccessRoles()">ยกเลิก</button>
          </div>
        </div>
      </td></tr>`;
    }
    return `<tr>
      <td>${escapeHtml(r.name)}${r.techName ? `<div style="font-size:11.5px; color:var(--slate);">${escapeHtml(r.techName)}</div>` : ''}${r.device ? `<div style="font-size:11px; color:var(--slate-light);">${escapeHtml(r.device)}</div>` : ''}</td>
      <td>${escapeHtml(r.dept || '-')}</td>
      <td>${pill}${granted ? ` <span style="font-size:12px;">${escapeHtml(granted)}</span>` : ''}${r.status === 'approved' ? `<div style="font-size:11.5px; color:var(--slate);">LINE: ${r.lineUserId ? escapeHtml(lineLabelFor(r.lineUserId)) : 'ยังไม่ผูก'}</div>` : ''}</td>
      <td>
        ${r.status === 'approved' ? `<button class="del" onclick="startEditAccessRoles('${r.id}')">แก้ไขบทบาท</button> ` : ''}
        <button class="del" onclick="revokeAccessRequest('${r.id}')">ถอนสิทธิ์/ลบ</button>
      </td>
    </tr>`;
  }).join('');

  // ผู้รับที่เคยกำหนดไว้ใน KV 'lineUserRoles' สมัยที่ยังมีหัวข้อ "กำหนดบทบาทผู้ใช้ LINE ที่ทักเข้ามา"
  // แยกต่างหาก — ตอนนี้ยุบมาผูกที่คำขอสิทธิ์ด้านบนที่เดียวแล้ว แต่ของเดิมยังส่งแจ้งเตือนอยู่จริง
  // (ดู lineRecipientsForRole) จึงต้องโชว์และลบได้ ไม่งั้นจะกลายเป็นผู้รับผีที่ admin มองไม่เห็น
  const legacyRows = Object.keys(state.lineUserRoles).map(id => {

/* ============================= ADMIN: LINE ที่ใช้รับแจ้งเตือน ============================= */
/* เพิ่ม userId เองสำหรับคนที่ยังไม่โผล่ในแท็บ LINE Users (ยังไม่เคยทักหา OA) — เพิ่มแล้วจะไปขึ้น
   ในช่อง "LINE ของคนนี้" ของรายการคำขอสิทธิ์ ให้ผูกกับชื่อผู้ขอได้เลย */
async function addLineUserManually(){
  const id = (state.ui.newLineUserId || '').trim();
  const name = (state.ui.newLineUserName || '').trim();
  if(!id){ toast('กรุณากรอก LINE userId', true); return; }
  if(state.lineUsers.some(u => u.userId === id)){ toast('มีผู้ใช้รายนี้ในรายการอยู่แล้ว', true); return; }
  const next = state.lineUsers.concat([{ userId:id, displayName:name || '(เพิ่มด้วยตัวเอง)', lastSeen:nowIso() }]);
  if(!await storeSet('lineUsers', next)){ toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true); return; }
  state.lineUsers = next;
  state.ui.newLineUserId = ''; state.ui.newLineUserName = '';
  toast('เพิ่ม LINE แล้ว — เลือกผูกกับผู้ใช้ในรายการคำขอสิทธิ์ได้เลย');
  render();
}
/* ลบผู้รับที่ตั้งไว้สมัยยังมีหัวข้อ "กำหนดบทบาทผู้ใช้ LINE" แยกต่างหาก (KV: lineUserRoles)
   ตอนนี้เหลือทางเดียวคือผูก LINE กับคำขอสิทธิ์ด้านบน ที่นี่จึงมีแค่ปุ่มลบของเก่า ไม่มีปุ่มเพิ่ม */
async function removeLegacyLineUserRole(userId){
  const cur = state.lineUserRoles[userId];
  if(!cur) return;
  if(!confirm(`ลบ "${cur.name || userId}" ออกจากผู้รับแจ้งเตือน ?\n\nคนนี้จะไม่ได้รับแจ้งเตือนทาง LINE อีก จนกว่าจะถูกผูกไว้กับผู้ใช้ในรายการคำขอสิทธิ์`)) return;
  const next = Object.assign({}, state.lineUserRoles);
  delete next[userId];
  if(!await storeSet('lineUserRoles', next)){ toast('ลบไม่สำเร็จ กรุณาลองใหม่', true); return; }
  state.lineUserRoles = next;
  toast('ลบผู้รับแจ้งเตือนแล้ว');
  render();
}
